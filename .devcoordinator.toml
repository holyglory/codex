[test.multi12-rate-card]
timeout_seconds = 7200
[test.multi12-rate-card.env]
PATH = "/home/holyglory/.cargo/bin:/home/holyglory/.local/bin:/usr/local/bin:/usr/bin:/bin"
RUSTUP_TOOLCHAIN = "1.95.0"
PYTHONDONTWRITEBYTECODE = "1"
INSTA_UPDATE = "no"

[[test.multi12-rate-card.check]]
name = "usage-rate-card"
tier = "release"
timeout_seconds = 1800
command = ["just", "--justfile", "justfile", "test", "-p", "codex-usage"]

[[test.multi12-rate-card.check]]
name = "responses-metadata-preservation"
tier = "release"
timeout_seconds = 1200
command = ["just", "--justfile", "justfile", "test", "-p", "codex-api"]

[[test.multi12-rate-card.check]]
name = "core-cost-capture"
tier = "release"
timeout_seconds = 2400
command = ["just", "--justfile", "justfile", "test", "-p", "codex-core", "-E", "test(usage_metadata_preserves_exact_billing_and_rate_card_provenance)"]

[test.multi12-local-package]

# This non-human identity can reach the cache and nothing else over SSH.
Match User codex-bazel-cache
    AuthorizedKeysFile /etc/codex-bazel-cache/authorized_keys
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    PermitOpen 127.0.0.1:9095
    PermitListen none
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    ForceCommand /usr/bin/false
Match all

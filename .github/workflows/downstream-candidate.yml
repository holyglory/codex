name: downstream-candidate

on:
  workflow_dispatch:
    inputs:
      native_source_commit:
        description: Native source commit whose product tree the packaging must preserve
        type: string
        required: true
      local_acceptance:
        description: Complete local acceptance receipt JSON; required for final npm assembly
        type: string
        required: false
      native_only:
        description: Build only the three hosted native targets; ineligible for npm publication
        type: boolean
        required: true
        default: false
      hosted_native_run_id:
        description: Successful hosted run with unchanged product and hosted build inputs
        type: string
        required: false
      linux_handoff:
        description: Hash-bound Linux x64 musl handoff JSON from the VPS
        type: string
        required: false
      windows_handoff:
        description: Hash-bound handoff JSON from the private Windows controller
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: downstream-candidate-${{ github.sha }}-${{ inputs.native_only && 'native' || 'complete' }}
  cancel-in-progress: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  identity:
    name: Verify local acceptance and native source identity
    if: github.repository == 'holyglory/codex'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      source_version: ${{ steps.identity.outputs.source_version }}
      npm_version: ${{ steps.identity.outputs.npm_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the completed local proof and permitted packaging-only diff
        id: identity
        env:
          NATIVE_SOURCE_COMMIT: ${{ inputs.native_source_commit }}
          LOCAL_ACCEPTANCE: ${{ inputs.local_acceptance }}
          CANDIDATE_MODE: ${{ inputs.native_only && 'native-only' || 'complete' }}
        run: >-
          python3 scripts/release_identity.py
          --producer "$NATIVE_SOURCE_COMMIT" --packaging "$GITHUB_SHA"
          --candidate-mode "$CANDIDATE_MODE"
          --local-acceptance "$LOCAL_ACCEPTANCE" --github-output "$GITHUB_OUTPUT"
      - name: Verify the seven-package fixture and release receipt regressions
        run: |
          python3 -m unittest discover -s codex-cli/tests -p test_build_npm_package.py -v
          python3 -m unittest discover -s scripts -p test_npm_release.py -v
      - name: Verify the optional hosted native producer
        if: inputs.hosted_native_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTED_RUN_ID: ${{ inputs.hosted_native_run_id }}
          NATIVE_ONLY: ${{ inputs.native_only }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_ONLY" == false && "$HOSTED_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HOSTED_RUN_ID" > "$RUNNER_TEMP/hosted-run.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$HOSTED_RUN_ID/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/hosted-jobs.json"
          hosted_commit="$(jq -r '.head_sha' "$RUNNER_TEMP/hosted-run.json")"
          python3 scripts/release_identity.py --producer "$hosted_commit" --packaging "$GITHUB_SHA" --hosted-native
          python3 codex-cli/scripts/verify_candidate_run.py --repository "$GITHUB_REPOSITORY" --commit "$hosted_commit" --jobs-file "$RUNNER_TEMP/hosted-jobs.json" --hosted-native < "$RUNNER_TEMP/hosted-run.json"

  handoff:
    name: Import verified VPS and private Windows outputs
    if: ${{ !inputs.native_only }}
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Import authenticated and digested native bundles
        env:
          LINUX_HANDOFF: ${{ inputs.linux_handoff }}
          WINDOWS_HANDOFF: ${{ inputs.windows_handoff }}
          RUNNER_HANDOFF_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/runner_handoff.py download --manifest "$LINUX_HANDOFF" --commit "$GITHUB_SHA" --producer linux-local --targets x86_64-unknown-linux-musl --destination native-artifacts
          python3 scripts/runner_handoff.py download --manifest "$WINDOWS_HANDOFF" --commit "$GITHUB_SHA" --producer windows-private-controller --targets x86_64-pc-windows-msvc,aarch64-pc-windows-msvc --destination native-artifacts
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: runner-handoff-${{ github.sha }}
          path: native-artifacts
          if-no-files-found: error
          retention-days: 14

  native:
    name: Build and test ${{ matrix.target }}
    if: inputs.hosted_native_run_id == ''
    needs: identity
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux_arm64_musl
            bazel_config: ci
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos_amd64
            bazel_config: ci-macos
          - runner: macos-15-xlarge
            target: aarch64-apple-darwin
            platform: macos_arm64
            bazel_config: ci-macos
    uses: ./.github/workflows/downstream-unix-native-target.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      platform: ${{ matrix.platform }}
      bazel_config: ${{ matrix.bazel_config }}
      source_version: ${{ needs.identity.outputs.source_version }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

  npm:
    name: Assemble and verify all seven npm tarballs
    if: >-
      !cancelled() && !inputs.native_only && needs.identity.result == 'success' &&
      needs.handoff.result == 'success' &&
      (needs.native.result == 'success' ||
       (needs.native.result == 'skipped' && inputs.hosted_native_run_id != ''))
    needs: [identity, handoff, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.hosted_native_run_id || github.run_id }}
          path: native-artifacts
          pattern: "{aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runner-handoff-${{ github.sha }}
          path: native-artifacts
      - name: Verify all six native producer identities and archive bytes
        env:
          NATIVE_SOURCE_COMMIT: ${{ inputs.native_source_commit }}
        run: >-
          python3 scripts/release_identity.py --producer "$NATIVE_SOURCE_COMMIT"
          --packaging "$GITHUB_SHA" --artifacts-dir native-artifacts > native-receipts.json
      - name: Pack, verify, and smoke the npm launcher
        env:
          VERSION: ${{ needs.identity.outputs.npm_version }}
        run: |
          python3 scripts/stage_npm_packages.py --release-version "$VERSION" --artifacts-dir native-artifacts --output-dir dist/npm --package codex
          python3 scripts/verify_npm_release.py --version "$VERSION" --dist-dir dist/npm
          python3 scripts/check_npm_install.py --version "$VERSION" --dist-dir dist/npm
          cp native-receipts.json dist/npm/
          cd dist/npm
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/npm/*
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-candidate-${{ needs.identity.outputs.npm_version }}
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 14

  candidate-result:
    name: Candidate checks passed
    if: ${{ !inputs.native_only && always() }}
    needs: [identity, handoff, native, npm]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          HOSTED_RUN_ID: ${{ inputs.hosted_native_run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          results = {name: job['result'] for name, job in json.loads(os.environ['NEEDS_JSON']).items()}
          expected = {name: 'success' for name in ('identity', 'handoff', 'native', 'npm')}
          if os.environ['HOSTED_RUN_ID']:
              expected['native'] = 'skipped'
          if results != expected:
              raise SystemExit(f'Candidate gates did not all pass: {results}')
          print('All native producers and seven npm packages passed their declared checks.')
          PY

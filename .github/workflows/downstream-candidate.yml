name: downstream-candidate

on:
  workflow_dispatch:
    inputs:
      local_acceptance:
        description: Exact-commit successful Linux receipt from scripts/local_candidate.py
        type: string
        required: true
      linux_handoff:
        description: Signed manifest for Linux artifacts produced by the local server
        type: string
        required: true
      windows_handoff:
        description: Signed manifest for Windows artifacts produced by the private controller
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: downstream-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  CODEX_REPO_ROOT: ${{ github.workspace }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  identity:
    name: Validate candidate identity
    runs-on: ubuntu-24.04
    outputs:
      source_version: ${{ steps.version.outputs.source_version }}
      npm_version: ${{ steps.version.outputs.npm_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require local Linux acceptance and external runner handoffs
        env:
          LOCAL_ACCEPTANCE: ${{ inputs.local_acceptance }}
          LINUX_HANDOFF: ${{ inputs.linux_handoff }}
          WINDOWS_HANDOFF: ${{ inputs.windows_handoff }}
        run: python3 scripts/local_candidate.py verify --commit "$GITHUB_SHA"
      - name: Validate Linux handoff manifest
        env:
          LINUX_HANDOFF: ${{ inputs.linux_handoff }}
        run: >-
          python3 scripts/runner_handoff.py verify
          --manifest "$LINUX_HANDOFF"
          --commit "$GITHUB_SHA"
          --producer linux-local
          --targets x86_64-unknown-linux-musl
      - name: Validate Windows handoff manifest
        env:
          WINDOWS_HANDOFF: ${{ inputs.windows_handoff }}
        run: >-
          python3 scripts/runner_handoff.py verify
          --manifest "$WINDOWS_HANDOFF"
          --commit "$GITHUB_SHA"
          --producer windows-private-controller
          --targets x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - name: Validate downstream versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("codex-rs/Cargo.toml").read_text())
          print(manifest["workspace"]["package"]["version"])
          PY
          )"
          npm_version="${source_version/+multi./-multi.}"
          if [[ "$source_version" != *+multi.* || "$npm_version" == *+* ]]; then
            echo "Expected a Rust +multi revision that maps safely to npm: $source_version" >&2
            exit 1
          fi
          echo "source_version=$source_version" >> "$GITHUB_OUTPUT"
          echo "npm_version=$npm_version" >> "$GITHUB_OUTPUT"
          printf 'Candidate `%s` / npm `%s` at `%s`\n' \
            "$source_version" "$npm_version" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify downstream packaging and publication helpers
        run: |
          python3 .github/scripts/test_archive_release_symbols.py -v
          python3 -m unittest discover -s codex-cli/scripts -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_stage*.py'
          python3 -m unittest discover -s scripts -p 'test_run_candidate_preflight.py'
          python3 -m unittest discover -s scripts -p 'test_local_candidate.py'
          python3 -m unittest discover -s scripts -p 'test_runner_handoff.py'
          python3 -m unittest discover -s scripts -p 'test_prepare_runner_handoff.py'
          python3 -m unittest discover -s .github/scripts -p 'test_bounded_bazel_cache.py'
          python3 -m unittest discover -s .github/scripts -p 'test_bazel_remote_cache.py'
          python3 -m unittest discover -s .github/scripts -p 'test_run_bazel_with_buildbuddy.py'
          python3 -m unittest discover -s .github/scripts -p 'test_probe_compiler_cache_persistence.py'
          python3 -m unittest discover -s .github/scripts -p 'test_persistent_compiler_wrapper.py'
          python3 -m unittest discover -s .github/scripts -p 'test_cache_ssh_key_format.py'

  # Full Linux validation and x86_64 packaging are produced by the owner-operated
  # local runner. The handoff job below verifies and imports those immutable
  # outputs; no GitHub-hosted Linux compiler or test graph runs for this candidate.
  handoff:
    name: Import local Linux and private Windows handoffs
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download and verify local Linux artifacts
        env:
          LINUX_HANDOFF: ${{ inputs.linux_handoff }}
          RUNNER_HANDOFF_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/runner_handoff.py download
          --manifest "$LINUX_HANDOFF"
          --commit "$GITHUB_SHA"
          --producer linux-local
          --targets x86_64-unknown-linux-musl
          --destination native-artifacts
      - name: Download and verify private Windows artifacts
        env:
          WINDOWS_HANDOFF: ${{ inputs.windows_handoff }}
          RUNNER_HANDOFF_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/runner_handoff.py download
          --manifest "$WINDOWS_HANDOFF"
          --commit "$GITHUB_SHA"
          --producer windows-private-controller
          --targets x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
          --destination native-artifacts
      - name: Preserve imported handoff artifacts for npm staging
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: runner-handoff-${{ github.sha }}
          path: native-artifacts
          if-no-files-found: error
          retention-days: 14

  native:
    name: Build ${{ matrix.target }}
    # After focused regressions pass, compile alongside complete validation.
    # Publication still requires every validation and packaging job to succeed.
    needs: [identity]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes || 240 }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The local VPS owns x86_64 Linux validation and packaging. This
          # ARM64 build remains only because that host has no ARM cross-toolchain
          # and the npm matrix still requires an ARM64 Linux package.
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-xlarge
            target: x86_64-apple-darwin
            timeout_minutes: 360
          - runner: macos-15-xlarge
            target: aarch64-apple-darwin
            timeout_minutes: 360
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "1"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ contains(matrix.target, 'apple-darwin') && 'packed' || 'off' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Bound Linux release compiler memory use
        if: runner.os == 'Linux'
        shell: bash
        run: echo 'CARGO_BUILD_JOBS=1' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils pkg-config libcap-dev zstd
          bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
      - name: Configure MSVC linker
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}
      - name: Check Windows private-storage bindings before the product build
        if: runner.os == 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo check --locked --tests -p codex-private-storage --target "$TARGET"
      - uses: ./.github/actions/downstream-compiler-cache
        with:
          backend: persistent
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - name: Build and hash bundled bwrap
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CODEX_BAZEL_CACHE_HOST: ${{ vars.CODEX_BAZEL_CACHE_HOST }}
          CODEX_BAZEL_CACHE_HOST_KEY: ${{ vars.CODEX_BAZEL_CACHE_HOST_KEY }}
          CODEX_BAZEL_CACHE_SSH_KEY: ${{ secrets.CODEX_BAZEL_CACHE_SSH_KEY }}
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/.github/scripts/run_with_persistent_compiler_cache.py" \
            --stats-file "$RUNNER_TEMP/compiler-cache-bwrap.json" --defer-health -- \
            cargo build --locked --target "$TARGET" --release --bin bwrap
          bwrap_path="${CARGO_TARGET_DIR}/${TARGET}/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap_path"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=$digest" >> "$GITHUB_ENV"
      - name: Build product binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CODEX_BAZEL_CACHE_HOST: ${{ vars.CODEX_BAZEL_CACHE_HOST }}
          CODEX_BAZEL_CACHE_HOST_KEY: ${{ vars.CODEX_BAZEL_CACHE_HOST_KEY }}
          CODEX_BAZEL_CACHE_SSH_KEY: ${{ secrets.CODEX_BAZEL_CACHE_SSH_KEY }}
        run: |
          set -euo pipefail
          args=(
            cargo build --locked --target "$TARGET" --release
            --bin codex
            --bin codex-app-server
            --bin codex-code-mode-host
          )
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
            args+=(--bin codex-command-runner --bin codex-windows-sandbox-setup)
          fi
          python3 "${GITHUB_WORKSPACE}/.github/scripts/run_with_persistent_compiler_cache.py" \
            --stats-file "$RUNNER_TEMP/compiler-cache-product.json" --defer-health -- "${args[@]}"
      - name: Verify the native fork updater without changing any installation
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          suffix=""
          [[ "$RUNNER_OS" == "Windows" ]] && suffix=".exe"
          python3 "${GITHUB_WORKSPACE}/scripts/check_fork_update.py" \
            --codex-binary "${CARGO_TARGET_DIR}/${TARGET}/release/codex${suffix}"
      - name: Archive symbols and strip product binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/archive-release-symbols-and-strip-binaries.sh" \
            --target "$TARGET" \
            --artifact-name "$TARGET" \
            --release-dir "${CARGO_TARGET_DIR}/${TARGET}/release" \
            --archive-dir "native-dist/${TARGET}" \
            --binaries "codex codex-app-server codex-code-mode-host"
      - name: Build canonical package archives
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.identity.outputs.source_version }}
        run: |
          set -euo pipefail
          release_dir="${CARGO_TARGET_DIR}/${TARGET}/release"
          dist_dir="${GITHUB_WORKSPACE}/codex-rs/native-dist/${TARGET}"
          suffix=""
          [[ "$RUNNER_OS" == "Windows" ]] && suffix=".exe"
          resources=(
            --code-mode-host-bin "${release_dir}/codex-code-mode-host${suffix}"
          )
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            resources+=(--bwrap-bin "${release_dir}/bwrap")
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            resources+=(
              --codex-command-runner-bin "${release_dir}/codex-command-runner.exe"
              --codex-windows-sandbox-setup-bin "${release_dir}/codex-windows-sandbox-setup.exe"
            )
          fi
          mkdir -p "$dist_dir"
          python3 "${GITHUB_WORKSPACE}/scripts/build_codex_package.py" \
            --target "$TARGET" \
            --variant codex \
            --package-version "$VERSION" \
            --entrypoint-bin "${release_dir}/codex${suffix}" \
            "${resources[@]}" \
            --archive-output "${dist_dir}/codex-package-${TARGET}.tar.gz" \
            --archive-output "${dist_dir}/codex-package-${TARGET}.tar.zst"
          python3 "${GITHUB_WORKSPACE}/scripts/build_codex_package.py" \
            --target "$TARGET" \
            --variant codex-app-server \
            --package-version "$VERSION" \
            --entrypoint-bin "${release_dir}/codex-app-server${suffix}" \
            "${resources[@]}" \
            --archive-output "${dist_dir}/codex-app-server-package-${TARGET}.tar.gz" \
            --archive-output "${dist_dir}/codex-app-server-package-${TARGET}.tar.zst"
      - name: Write checksums
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          dist = Path("native-dist") / os.environ["TARGET"]
          lines = []
          for path in sorted(dist.iterdir()):
              if path.is_file() and path.name != "SHA256SUMS":
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n")
          (dist / "SHA256SUMS").write_text("".join(lines))
          PY
      - name: Attest candidate artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: codex-rs/native-dist/${{ matrix.target }}/*
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}
          path: codex-rs/native-dist/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Verify compiler-cache writes completed successfully
        shell: bash
        run: |
          cache_check_status=0
          for receipt in "$RUNNER_TEMP"/compiler-cache-*.json; do
            python3 "${GITHUB_WORKSPACE}/.github/scripts/compiler_cache_health.py" \
              --file "$receipt" --backend bazel-http || cache_check_status=1
          done
          exit "$cache_check_status"

  npm:
    name: Build and verify seven npm tarballs
    needs: [identity, handoff, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@holyglory"
      - name: Download native package archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: native-artifacts
          pattern: "{aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin}"
      - name: Import verified local and Windows package archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runner-handoff-${{ github.sha }}
          path: ${{ runner.temp }}/runner-handoff
      - name: Merge imported package archives into the npm input layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-artifacts
          cp -a "$RUNNER_TEMP/runner-handoff/." native-artifacts/
          for target in \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc \
            aarch64-pc-windows-msvc; do
            test -f "native-artifacts/$target/codex-package-$target.tar.gz"
          done
      - name: Build npm tarballs
        shell: bash
        env:
          VERSION: ${{ needs.identity.outputs.npm_version }}
        run: |
          ./scripts/stage_npm_packages.py \
            --release-version "$VERSION" \
            --artifacts-dir native-artifacts \
            --output-dir dist/npm \
            --package codex
      - name: Verify exact npm package set
        shell: bash
        env:
          VERSION: ${{ needs.identity.outputs.npm_version }}
        run: |
          python3 scripts/verify_npm_release.py --version "$VERSION" --dist-dir dist/npm
          cd dist/npm
          sha256sum *.tgz > SHA256SUMS
      - name: Verify isolated npm replacement and fork update
        shell: bash
        env:
          VERSION: ${{ needs.identity.outputs.npm_version }}
        run: python3 scripts/check_npm_install.py --version "$VERSION" --dist-dir dist/npm
      - name: Attest npm candidate tarballs
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/npm/*
      - name: Upload npm candidate tarballs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-candidate-${{ needs.identity.outputs.npm_version }}
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 14

  candidate-result:
    name: Candidate checks passed
    if: always()
    needs:
      [
        identity,
        handoff,
        native,
        npm,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every candidate job
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = {
              name: job["result"] for name, job in json.loads(os.environ["NEEDS_JSON"]).items()
          }
          failures = {name: result for name, result in results.items() if result != "success"}
          if failures:
              raise SystemExit(f"Candidate jobs did not all pass: {failures}")
          print("Every candidate validation and packaging job passed.")
          PY

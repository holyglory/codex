name: downstream-candidate

on:
  workflow_dispatch:
    inputs:
      pipeline_mode:
        description: Prefer locally assembled npm inputs; hosted compilation is an explicit fallback
        type: choice
        required: true
        default: local-npm
        options: [local-npm, verify-native, macos-build, hosted-build]
      local_npm_descriptor:
        description: Uploaded local npm bundle descriptor JSON
        type: string
        required: false
      prebuilt_native_descriptor:
        description: Uploaded native bundle descriptor JSON with target, URL, size and digests
        type: string
        required: false
      release_tag:
        description: Immutable annotated npm product tag for local npm verification
        type: string
        required: false
      native_source_commit:
        description: Native source commit whose product tree the packaging must preserve
        type: string
        required: true
      local_acceptance:
        description: Complete local acceptance receipt JSON; required for final npm assembly
        type: string
        required: false
      native_only:
        description: Build only the three hosted native targets; ineligible for npm publication
        type: boolean
        required: true
        default: false
      hosted_native_run_id:
        description: Successful hosted run with unchanged product and hosted build inputs
        type: string
        required: false
      hosted_native_runs:
        description: JSON mapping each of the three hosted targets to a completed producer run ID
        type: string
        required: false
      hosted_v8_run_id:
        description: Completed hosted run whose successful V8 jobs may be reused for fresh package builds
        type: string
        required: false
      linux_handoff:
        description: Hash-bound Linux x64 musl handoff JSON from the VPS
        type: string
        required: false
      windows_handoff:
        description: Hash-bound handoff JSON from the private Windows controller
        type: string
        required: false
      reuse_linux_arm_handoff:
        description: Reuse a separately verified Linux ARM64 handoff when its hosted runner is unavailable
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: downstream-candidate-${{ github.sha }}-${{ inputs.pipeline_mode }}-${{ fromJSON(inputs.prebuilt_native_descriptor || '{}').target || 'all' }}-${{ inputs.native_only && 'native' || 'complete' }}
  cancel-in-progress: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  prebuilt-native:
    name: Verify locally compiled native target
    if: inputs.pipeline_mode == 'verify-native'
    uses: ./.github/workflows/downstream-prebuilt-native.yml
    with:
      source_sha: ${{ inputs.native_source_commit }}
      helper_sha: ${{ github.sha }}
      target: ${{ fromJSON(inputs.prebuilt_native_descriptor || '{}').target }}
      asset_url: ${{ fromJSON(inputs.prebuilt_native_descriptor || '{}').url }}
      asset_sha256: ${{ fromJSON(inputs.prebuilt_native_descriptor || '{}').sha256 }}
      asset_size: ${{ format('{0}', fromJSON(inputs.prebuilt_native_descriptor || '{}').size_bytes) }}
      manifest_sha256: ${{ fromJSON(inputs.prebuilt_native_descriptor || '{}').manifest_sha256 }}

  local-npm:
    name: Verify locally assembled npm candidate
    if: inputs.pipeline_mode == 'local-npm'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/downstream-local-npm.yml
    with:
      source_commit: ${{ inputs.native_source_commit }}
      packaging_commit: ${{ github.sha }}
      tag: ${{ inputs.release_tag }}
      transport_descriptor: ${{ inputs.local_npm_descriptor }}

  local-npm-result:
    name: Local npm candidate checks passed
    if: ${{ always() && inputs.pipeline_mode == 'local-npm' }}
    needs: local-npm
    runs-on: ubuntu-24.04
    steps:
      - name: Require verified original tarballs
        env:
          RESULT: ${{ needs.local-npm.result }}
        run: test "$RESULT" = success

  identity:
    name: Verify local acceptance and native source identity
    if: github.repository == 'holyglory/codex' && (inputs.pipeline_mode == 'hosted-build' || inputs.pipeline_mode == 'macos-build')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      source_version: ${{ steps.identity.outputs.source_version }}
      npm_version: ${{ steps.identity.outputs.npm_version }}
      hosted_v8_source_commit: ${{ steps.hosted_v8.outputs.source_commit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check native producer modes
        env:
          NATIVE_ONLY: ${{ inputs.native_only }}
          HOSTED_NATIVE_RUN_ID: ${{ inputs.hosted_native_run_id }}
          HOSTED_NATIVE_RUNS: ${{ inputs.hosted_native_runs }}
          HOSTED_V8_RUN_ID: ${{ inputs.hosted_v8_run_id }}
          REUSE_LINUX_ARM: ${{ inputs.reuse_linux_arm_handoff }}
        run: |
          if [[ "$REUSE_LINUX_ARM" == true && ( "$NATIVE_ONLY" == true || -n "$HOSTED_NATIVE_RUN_ID" ) ]]; then
            echo 'Linux ARM handoff reuse requires a complete candidate without hosted native reuse.' >&2
            exit 1
          fi
          if [[ -n "$HOSTED_NATIVE_RUNS" && ( "$NATIVE_ONLY" == true || -n "$HOSTED_NATIVE_RUN_ID" || -n "$HOSTED_V8_RUN_ID" || "$REUSE_LINUX_ARM" == true ) ]]; then
            echo 'Per-target native reuse requires a complete candidate without another reuse mode.' >&2
            exit 1
          fi
      - name: Check the completed local proof and permitted packaging-only diff
        id: identity
        env:
          NATIVE_SOURCE_COMMIT: ${{ inputs.native_source_commit }}
          LOCAL_ACCEPTANCE: ${{ inputs.local_acceptance }}
          CANDIDATE_MODE: ${{ (inputs.native_only || inputs.pipeline_mode == 'macos-build') && 'native-only' || 'complete' }}
        run: >-
          python3 scripts/release_identity.py
          --producer "$NATIVE_SOURCE_COMMIT" --packaging "$GITHUB_SHA"
          --candidate-mode "$CANDIDATE_MODE"
          --local-acceptance "$LOCAL_ACCEPTANCE" --github-output "$GITHUB_OUTPUT"
      - name: Verify the seven-package fixture and release receipt regressions
        run: |
          python3 -m unittest discover -s codex-cli/tests -p test_build_npm_package.py -v
          python3 -m unittest discover -s scripts -p test_npm_release.py -v
          python3 -m unittest discover -s scripts -p test_hosted_native_handoff.py -v
          python3 .github/scripts/test_bootstrap_bazel_distdir.py -v
      - name: Verify the optional hosted native producer
        if: inputs.hosted_native_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_SOURCE_COMMIT: ${{ inputs.native_source_commit }}
          HOSTED_RUN_ID: ${{ inputs.hosted_native_run_id }}
          HOSTED_V8_RUN_ID: ${{ inputs.hosted_v8_run_id }}
          NATIVE_ONLY: ${{ inputs.native_only }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_ONLY" == false && "$HOSTED_RUN_ID" =~ ^[0-9]+$ ]]
          [[ -z "$HOSTED_V8_RUN_ID" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HOSTED_RUN_ID" > "$RUNNER_TEMP/hosted-run.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$HOSTED_RUN_ID/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/hosted-jobs.json"
          hosted_commit="$(jq -r '.head_sha' "$RUNNER_TEMP/hosted-run.json")"
          python3 scripts/release_identity.py --producer "$hosted_commit" --product-source "$NATIVE_SOURCE_COMMIT" --packaging "$GITHUB_SHA" --hosted-native
          python3 codex-cli/scripts/verify_candidate_run.py --repository "$GITHUB_REPOSITORY" --commit "$hosted_commit" --jobs-file "$RUNNER_TEMP/hosted-jobs.json" --hosted-native < "$RUNNER_TEMP/hosted-run.json"

      - name: Verify the optional hosted V8 producer
        id: hosted_v8
        if: inputs.hosted_v8_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_SOURCE_COMMIT: ${{ inputs.native_source_commit }}
          HOSTED_RUN_ID: ${{ inputs.hosted_v8_run_id }}
          HOSTED_NATIVE_RUN_ID: ${{ inputs.hosted_native_run_id }}
        run: |
          set -euo pipefail
          [[ "$HOSTED_RUN_ID" =~ ^[0-9]+$ ]]
          [[ -z "$HOSTED_NATIVE_RUN_ID" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HOSTED_RUN_ID" > "$RUNNER_TEMP/hosted-v8-run.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$HOSTED_RUN_ID/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/hosted-v8-jobs.json"
          hosted_commit="$(jq -r '.head_sha' "$RUNNER_TEMP/hosted-v8-run.json")"
          python3 scripts/release_identity.py --producer "$hosted_commit" --product-source "$NATIVE_SOURCE_COMMIT" --packaging "$GITHUB_SHA" --hosted-v8
          python3 codex-cli/scripts/verify_candidate_run.py --repository "$GITHUB_REPOSITORY" --commit "$hosted_commit" --jobs-file "$RUNNER_TEMP/hosted-v8-jobs.json" --hosted-v8 < "$RUNNER_TEMP/hosted-v8-run.json"
          echo "source_commit=$hosted_commit" >> "$GITHUB_OUTPUT"

  handoff:
    name: Import verified VPS and private Windows outputs
    if: ${{ inputs.pipeline_mode == 'hosted-build' && !inputs.native_only }}
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Import authenticated and digested native bundles
        env:
          LINUX_HANDOFF: ${{ inputs.linux_handoff }}
          WINDOWS_HANDOFF: ${{ inputs.windows_handoff }}
          REUSE_LINUX_ARM: ${{ inputs.reuse_linux_arm_handoff }}
          RUNNER_HANDOFF_TOKEN: ${{ github.token }}
        run: |
          linux_targets=x86_64-unknown-linux-musl
          if [[ "$REUSE_LINUX_ARM" == true ]]; then
            linux_targets+=,aarch64-unknown-linux-musl
          fi
          python3 scripts/runner_handoff.py download --manifest "$LINUX_HANDOFF" --commit "$GITHUB_SHA" --producer linux-local --targets "$linux_targets" --destination native-artifacts
          python3 scripts/runner_handoff.py download --manifest "$WINDOWS_HANDOFF" --commit "$GITHUB_SHA" --producer windows-private-controller --targets x86_64-pc-windows-msvc,aarch64-pc-windows-msvc --destination native-artifacts
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: runner-handoff-${{ github.sha }}
          path: native-artifacts
          if-no-files-found: error
          retention-days: 14

  macos-local-pipeline:
    name: Build and test ${{ matrix.target }}
    if: inputs.pipeline_mode == 'macos-build'
    needs: identity
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos_amd64
            bazel_config: ci-macos
          - runner: macos-15-xlarge
            target: aarch64-apple-darwin
            platform: macos_arm64
            bazel_config: ci-macos
    uses: ./.github/workflows/downstream-unix-native-target.yml
    with:
      source_sha: ${{ inputs.native_source_commit }}
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      platform: ${{ matrix.platform }}
      bazel_config: ${{ matrix.bazel_config }}
      source_version: ${{ needs.identity.outputs.source_version }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

  native:
    name: Build and test ${{ matrix.target }}
    if: inputs.pipeline_mode == 'hosted-build' && inputs.hosted_native_run_id == '' && inputs.hosted_native_runs == '' && !inputs.reuse_linux_arm_handoff
    needs: identity
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux_arm64_musl
            bazel_config: ci
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos_amd64
            bazel_config: ci-macos
          - runner: macos-15-xlarge
            target: aarch64-apple-darwin
            platform: macos_arm64
            bazel_config: ci-macos
    uses: ./.github/workflows/downstream-unix-native-target.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      platform: ${{ matrix.platform }}
      bazel_config: ${{ matrix.bazel_config }}
      source_version: ${{ needs.identity.outputs.source_version }}
      v8_run_id: ${{ inputs.hosted_v8_run_id }}
      v8_source_commit: ${{ needs.identity.outputs.hosted_v8_source_commit }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

  native-mac:
    name: Build and test ${{ matrix.target }} with verified Linux ARM handoff
    if: inputs.pipeline_mode == 'hosted-build' && inputs.reuse_linux_arm_handoff
    needs: identity
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos_amd64
            bazel_config: ci-macos
          - runner: macos-15-xlarge
            target: aarch64-apple-darwin
            platform: macos_arm64
            bazel_config: ci-macos
    uses: ./.github/workflows/downstream-unix-native-target.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      platform: ${{ matrix.platform }}
      bazel_config: ${{ matrix.bazel_config }}
      source_version: ${{ needs.identity.outputs.source_version }}
      v8_run_id: ${{ inputs.hosted_v8_run_id }}
      v8_source_commit: ${{ needs.identity.outputs.hosted_v8_source_commit }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

  npm:
    name: Assemble and verify all seven npm tarballs
    if: >-
      inputs.pipeline_mode == 'hosted-build' &&
      !cancelled() && !inputs.native_only && needs.identity.result == 'success' &&
      needs.handoff.result == 'success' &&
      (needs.native.result == 'success' || needs.native-mac.result == 'success' ||
       (needs.native.result == 'skipped' && needs.native-mac.result == 'skipped' &&
        (inputs.hosted_native_run_id != '' || inputs.hosted_native_runs != '')))
    needs: [identity, handoff, native, native-mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.hosted_native_runs == ''
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.hosted_native_run_id || github.run_id }}
          path: native-artifacts
          pattern: "{aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin}"
      - name: Import verified hosted native targets
        if: inputs.hosted_native_runs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTED_NATIVE_RUNS: ${{ inputs.hosted_native_runs }}
          PRODUCT_SOURCE: ${{ inputs.native_source_commit }}
        run: >-
          python3 scripts/hosted_native_handoff.py --runs "$HOSTED_NATIVE_RUNS"
          --repository "$GITHUB_REPOSITORY" --product-source "$PRODUCT_SOURCE"
          --packaging "$GITHUB_SHA" --destination native-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runner-handoff-${{ github.sha }}
          path: native-artifacts
      - name: Verify all six native producer identities and archive bytes
        env:
          NATIVE_SOURCE_COMMIT: ${{ inputs.native_source_commit }}
        run: >-
          python3 scripts/release_identity.py --producer "$NATIVE_SOURCE_COMMIT"
          --packaging "$GITHUB_SHA" --artifacts-dir native-artifacts > native-receipts.json
      - name: Pack, verify, and smoke the npm launcher
        env:
          VERSION: ${{ needs.identity.outputs.npm_version }}
        run: |
          python3 scripts/stage_npm_packages.py --release-version "$VERSION" --artifacts-dir native-artifacts --output-dir dist/npm --package codex
          python3 scripts/verify_npm_release.py --version "$VERSION" --dist-dir dist/npm
          python3 scripts/check_npm_install.py --version "$VERSION" --dist-dir dist/npm
          cp native-receipts.json dist/npm/
          if [[ -f native-artifacts/hosted-native-producers.json ]]; then
            cp native-artifacts/hosted-native-producers.json dist/npm/
          fi
          cd dist/npm
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/npm/*
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-candidate-${{ needs.identity.outputs.npm_version }}
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 14

  candidate-result:
    name: Candidate checks passed
    if: ${{ inputs.pipeline_mode == 'hosted-build' && !inputs.native_only && always() }}
    needs: [identity, handoff, native, native-mac, npm]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          HOSTED_RUN_ID: ${{ inputs.hosted_native_run_id }}
          HOSTED_NATIVE_RUNS: ${{ inputs.hosted_native_runs }}
          REUSE_LINUX_ARM: ${{ inputs.reuse_linux_arm_handoff }}
        run: |
          python3 - <<'PY'
          import json, os
          results = {name: job['result'] for name, job in json.loads(os.environ['NEEDS_JSON']).items()}
          expected = {name: 'success' for name in ('identity', 'handoff', 'npm')}
          if os.environ['HOSTED_RUN_ID'] or os.environ['HOSTED_NATIVE_RUNS']:
              expected.update(native='skipped', **{'native-mac': 'skipped'})
          elif os.environ['REUSE_LINUX_ARM'] == 'true':
              expected.update(native='skipped', **{'native-mac': 'success'})
          else:
              expected.update(native='success', **{'native-mac': 'skipped'})
          if results != expected:
              raise SystemExit(f'Candidate gates did not all pass: {results}')
          print('All native producers and seven npm packages passed their declared checks.')
          PY

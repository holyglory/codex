name: downstream-compiler-cache-load

on:
  workflow_dispatch:
  push:
    branches: [codex/compiler-cache-write-load]
    paths:
      - .github/scripts/*compiler_cache*.py
      - .github/workflows/downstream-compiler-cache-load.yml

permissions:
  contents: read

jobs:
  cache-load:
    if: github.repository == 'holyglory/codex'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: ./.github/actions/downstream-compiler-cache
      - name: Verify error classification and native cache recovery
        env:
          SCCACHE_TEST_BINARY: ${{ env.SCCACHE_PATH }}
        run: python3 -m unittest discover -s .github/scripts -p 'test_probe_compiler_cache_persistence.py'
      - name: Exercise release-sized compiler-cache writes
        shell: bash
        run: |
          python3 .github/scripts/probe_compiler_cache_persistence.py \
            --mode populate --namespace "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --workdir "$RUNNER_TEMP/compiler-cache-load" \
            --target x86_64-unknown-linux-gnu --count 4096 \
            --evidence "$RUNNER_TEMP/compiler-cache-load-evidence"
      - name: Preserve cache-load evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: compiler-cache-load
          path: ${{ runner.temp }}/compiler-cache-load-evidence

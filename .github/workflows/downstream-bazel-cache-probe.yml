name: downstream-bazel-cache-probe

on:
  workflow_dispatch:
  push:
    branches: [codex/persistent-bazel-cache]
    paths:
      - .github/scripts/*bazel*cache*.py
      - .github/workflows/downstream-bazel-cache-probe.yml
      - .github/actions/probe-bazel-cache/action.yml

permissions:
  contents: read

jobs:
  compiler-populate:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'holyglory/codex'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    uses: ./.github/workflows/downstream-persistent-compiler-probe.yml
    with:
      mode: populate
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      cache_host: ${{ vars.CODEX_BAZEL_CACHE_HOST }}
      cache_host_key: ${{ vars.CODEX_BAZEL_CACHE_HOST_KEY }}
    secrets:
      cache_ssh_key: ${{ secrets.CODEX_BAZEL_CACHE_SSH_KEY }}

  compiler-consume:
    if: always() && github.event_name == 'workflow_dispatch' && github.repository == 'holyglory/codex'
    needs: compiler-populate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    uses: ./.github/workflows/downstream-persistent-compiler-probe.yml
    with:
      mode: consume
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      cache_host: ${{ vars.CODEX_BAZEL_CACHE_HOST }}
      cache_host_key: ${{ vars.CODEX_BAZEL_CACHE_HOST_KEY }}
    secrets:
      cache_ssh_key: ${{ secrets.CODEX_BAZEL_CACHE_SSH_KEY }}

  populate:
    if: github.repository == 'holyglory/codex'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/probe-bazel-cache
        with:
          mode: populate
        env:
          CODEX_BAZEL_CACHE_HOST: ${{ vars.CODEX_BAZEL_CACHE_HOST }}
          CODEX_BAZEL_CACHE_HOST_KEY: ${{ vars.CODEX_BAZEL_CACHE_HOST_KEY }}
          CODEX_BAZEL_CACHE_SSH_KEY: ${{ secrets.CODEX_BAZEL_CACHE_SSH_KEY }}

  consume:
    needs: populate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/probe-bazel-cache
        with:
          mode: consume
        env:
          CODEX_BAZEL_CACHE_HOST: ${{ vars.CODEX_BAZEL_CACHE_HOST }}
          CODEX_BAZEL_CACHE_HOST_KEY: ${{ vars.CODEX_BAZEL_CACHE_HOST_KEY }}
          CODEX_BAZEL_CACHE_SSH_KEY: ${{ secrets.CODEX_BAZEL_CACHE_SSH_KEY }}

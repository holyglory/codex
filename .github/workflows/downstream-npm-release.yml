name: downstream-npm-release

on:
  workflow_dispatch:
    inputs:
      stage_to_npm:
        description: Stage the validated tarballs on npm for manual 2FA approval
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "npm-v*"

permissions:
  contents: read

env:
  CODEX_REPO_ROOT: ${{ github.workspace }}

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate package version and publication ref
        id: version
        shell: bash
        env:
          STAGE_TO_NPM: ${{ inputs.stage_to_npm || false }}
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("codex-rs/Cargo.toml").read_text())
          print(manifest["workspace"]["package"]["version"])
          PY
          )"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "npm-v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must equal npm-v${version}" >&2
            exit 1
          fi
          if [[ "${STAGE_TO_NPM}" == "true" && "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "npm staging is permitted only from an immutable npm-v<version> tag" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build-native:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_DEBUG: none
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: off
      CARGO_PROFILE_RELEASE_STRIP: symbols
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Configure MSVC linker
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Configure verified rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build and hash bundled bwrap
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --target "$TARGET" --release --bin bwrap
          bwrap_path="${CARGO_TARGET_DIR}/${TARGET}/release/bwrap"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"
          echo "BWRAP_BIN=${bwrap_path}" >> "$GITHUB_ENV"

      - name: Build canonical package archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          archive_dir="${GITHUB_WORKSPACE}/native-dist/${TARGET}"
          mkdir -p "$archive_dir"
          args=(
            python3 "${GITHUB_WORKSPACE}/scripts/build_codex_package.py"
            --target "$TARGET"
            --cargo-profile release
            --package-version "$VERSION"
            --archive-output "$archive_dir/codex-package-${TARGET}.tar.gz"
          )
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            args+=(--bwrap-bin "$BWRAP_BIN")
          fi
          "${args[@]}"

      - name: Upload canonical package archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}
          path: native-dist/${{ matrix.target }}/codex-package-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  package-npm:
    name: Build npm tarballs
    needs: [validate, build-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          scope: "@holyglory"

      - name: Download native archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: native-artifacts
          pattern: "*-*-*"

      - name: Stage npm tarballs
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/stage_npm_packages.py \
            --release-version "$VERSION" \
            --workflow-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --artifacts-dir native-artifacts \
            --output-dir dist/npm \
            --package codex

      - name: Verify npm package set
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python3 scripts/verify_npm_release.py --version "$VERSION" --dist-dir dist/npm

      - name: Upload npm tarballs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: downstream-npm-release
          path: dist/npm/*.tgz
          if-no-files-found: error

  stage-npm:
    name: Stage npm release for approval
    if: github.event_name == 'workflow_dispatch' && inputs.stage_to_npm
    needs: [validate, package-npm]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          scope: "@holyglory"
          package-manager-cache: false

      - name: Install npm with staged-publishing support
        run: npm install --global npm@11.19.1

      - name: Download npm tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: downstream-npm-release
          path: dist/npm

      - name: Stage platform payloads and root wrapper
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          platforms=(
            linux-x64
            linux-arm64
            darwin-x64
            darwin-arm64
            win32-x64
            win32-arm64
          )
          for platform in "${platforms[@]}"; do
            npm stage publish \
              "dist/npm/codex-npm-${platform}-${VERSION}.tgz" \
              --access public \
              --tag "$platform"
          done
          npm stage publish \
            "dist/npm/codex-npm-${VERSION}.tgz" \
            --access public \
            --tag latest

          echo "All variants are staged. Approve every platform version before the root latest version."

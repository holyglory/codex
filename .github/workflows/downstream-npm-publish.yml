name: downstream-npm-publish

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Completed successful downstream-candidate run for the tagged commit
        required: true
        type: string
      tag:
        description: Immutable annotated npm-v<version> tag at that exact candidate
        required: true
        type: string
      stage_to_npm:
        description: Stage seven tarballs after protected npm environment approval
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: downstream-npm-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Verify immutable tag and complete candidate identity
    if: github.repository == 'holyglory/codex'
    runs-on: ubuntu-24.04
    outputs:
      npm_version: ${{ steps.identity.outputs.npm_version }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
      packaging_commit: ${{ steps.identity.outputs.packaging_commit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          # The immutable tag identifies the product producer. The workflow
          # itself may run from a later packaging-only commit, which is the
          # commit that produced the candidate run and must be staged.
          ref: ${{ github.sha }}
      - name: Match annotated tag, candidate workflow, commit, and release version
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^npm-v[0-9]+\.[0-9]+\.[0-9]+-multi\.[0-9]+$ ]]
          [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == tag ]]
          source_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          npm_version="$(python3 -c 'from scripts.release_identity import version; print(version()[1])')"
          [[ "$RELEASE_TAG" == "npm-v$npm_version" ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/candidate-jobs.json"
          packaging_commit="$(jq -r '.head_sha' "$RUNNER_TEMP/candidate-run.json")"
          [[ "$packaging_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$packaging_commit" == "$(git rev-parse HEAD)" ]]
          python3 scripts/release_identity.py --producer "$source_commit" --packaging "$packaging_commit"
          python3 codex-cli/scripts/verify_candidate_run.py --repository "$GITHUB_REPOSITORY" --commit "$packaging_commit" --jobs-file "$RUNNER_TEMP/candidate-jobs.json" < "$RUNNER_TEMP/candidate-run.json"
          echo "npm_version=$npm_version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "packaging_commit=$packaging_commit" >> "$GITHUB_OUTPUT"

  stage-npm:
    name: Stage npm versions for final human approval
    if: inputs.stage_to_npm
    needs: validate
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.packaging_commit }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@holyglory"
          package-manager-cache: false
      - name: Install pinned npm staging client
        run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          name: npm-candidate-${{ needs.validate.outputs.npm_version }}
          path: dist/npm
      - name: Check immutable candidate checksums and stage platforms before launcher
        env:
          VERSION: ${{ needs.validate.outputs.npm_version }}
        run: |
          cd dist/npm
          sha256sum --check SHA256SUMS
          cd ../..
          python3 scripts/stage_verified_npm_release.py --dist-dir dist/npm --version "$VERSION"

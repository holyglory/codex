        $text = '"""Separate verified guest execution from application pass/fail results."""
        from collections import Counter
        from datetime import datetime, timezone
        import hashlib
        import json
        from pathlib import Path
        import re
        import native_guest_coverage as coverage


        def require(condition, message):
            if not condition:
                raise ValueError(message)


        def verify(plan, bundle, current, directory):
            require(current[''planId''] == plan[''planId''] and current[''taskState''] == ''Ready''
                    and current[''workerLive''] is False, ''Guest execution has not finished.'')
            progress, result = current[''progress''], current[''result'']
            require(progress[''phase''] in (''passed'', ''failed'') and result is not None,
                    ''Guest controller ended without a final test result.'')
            for key in (''sourceSha'',''sourceTree'',''controllerSha'',''bundleId'',''planId''):
                require(result[key] == plan[key], ''Guest identity mismatch: ''+key)
            require(result[''bundleRun''] == plan[''runId''] and result[''bundleAttempt''] == plan[''runAttempt''],
                    ''Guest result belongs to another workflow attempt.'')
            require(result[''validationCommit''] == plan[''sourceSha''] == bundle[''validationCommit''],
                    ''Test bundle was built from different source bytes.'')
            require(result[''networkAdapters''] == current[''networkAdapters''] == 0
                    and type(result[''networkAdapters'']) is int, ''Guest isolation differs.'')
            context = result[''context'']
            expected = dict(machine=''CODEX-VM-01'', identity=r''CODEX-VM-01\CodexVmAdmin'',
                            administrator=True, windowStation=''WinSta0'', desktop=''Default'')
            require(context == progress[''context''] and set(context) == set(expected)|{''sessionId''}
                    and all(type(context[k]) is type(v) and context[k] == v for k,v in expected.items())
                    and type(context[''sessionId'']) is int and context[''sessionId''] > 0,
                    ''Unexpected privileged guest context.'')
            require(progress[''verifiedFiles''] == bundle[''fileCount''], ''Guest bundle inventory is incomplete.'')
            require(progress[''guestCapacity''][''totalVisibleMemoryKiB'']*1024 >= 31*1024**3,
                    ''Guest memory prerequisite was not met.'')
            files = {x[''name'']: x for x in current[''files'']}
            require(len(files) == len(current[''files'']), ''Duplicate evidence filename.'')
            directory = Path(directory)

            def read(name):
                require(name in files, ''Missing guest evidence: ''+name)
                data = (directory/name).read_bytes()
                item = files[name]
                require(len(data) == item[''bytes''] and hashlib.sha256(data).hexdigest() == item[''sha256''],
                        ''Collected guest evidence differs: ''+name)
                return data.decode(''utf-8-sig'')

            tests = result[''tests'']
            require(tests == progress[''tests''] and len(tests) == len(coverage.GUEST_TARGETS)
                    and {t[''label''] for t in tests} == set(coverage.GUEST_TARGETS),
                    ''Missing or duplicated guest target selection.'')
            verified = []
            for test in tests:
                label = test[''label'']
                prefix = label.split('':'')[1]
                args = ([coverage.MIXED_FILTERS[label]] if label in coverage.MIXED_FILTERS else [])
                if label.endswith('':exec-server-exec_process-test''):
                    args += [''--exact'']
                require(test[''args''] == args+[''--test-threads=1'',''--nocapture''], ''Test arguments changed.'')
                selected = json.loads(read(prefix+''.selected.json''))
                inventory = re.findall(r''^(.+): test\r?$'', read(prefix+''.list.log''), re.M)
                require(isinstance(selected,list) and selected and selected == inventory
                        and selected == test[''selectedNames''] and len(selected) == test[''selectedCount''],
                        ''Selected guest cases differ from the compiled inventory.'')
                text = re.sub(r''\x1b\][^\x1b\x07]*(?:\x07|\x1b\\)'', '''', read(prefix+''.log'').replace(''\r\n'',''\n''))
                text = re.sub(r''\x1b\[[0-?]*[ -/]*[@-~]|\x1b[@-_]'', '''', text)
                executed = re.findall(r''^test (\S+)(?: - should panic)? \.\.\. '', text, re.M)
                summaries = re.findall(r''^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;[^\r\n]*$'', text, re.M)
                passed = failed = ignored = measured = filtered = None
                complete = False
                status = None
                if summaries:
                    status,*counts = summaries[-1]
                    passed,failed,ignored,measured,filtered = map(int,counts)
                    complete = (Counter(executed)==Counter(selected) and passed+failed+ignored==len(selected)
                                and measured==0 and (label in coverage.MIXED_FILTERS or filtered==0)
                                and ((status==''ok'') == (failed==0)))
                require(test[''coverageMatched''] is complete, ''Worker and retained logs disagree about coverage.'')
                require((passed,failed,ignored) == (test[''passedCount''],test[''failedCount''],test[''ignoredCount'']),
                        ''Worker counts differ from final log summary.'')
                for field in (''timedOut'',''outputDrainTimedOut'',''captureCompleted'',''cleanupIncomplete''):
                    require(type(test[field]) is bool, ''Invalid capture state: ''+field)
                capture_ok = (test[''captureCompleted''] and not test[''cleanupIncomplete'']
                              and not test[''outputDrainTimedOut''] and not test[''observationErrors''])
                successful = complete and capture_ok and not test[''timedOut''] and test[''exitCode'']==0 and status==''ok'' and failed==0
                require(test[''passed''] is successful, ''Worker success differs from retained evidence.'')
                classification = (''passed'' if successful else ''test_timeout_cause_unresolved'' if test[''timedOut'']
                                  else ''capture_failure'' if not capture_ok else ''test_failure'' if complete
                                  else ''incomplete_test_output'')
                verified.append(dict(label=label, selected=len(selected), selectedNames=selected,
                    selection=coverage.MIXED_FILTERS.get(label), passed=passed, failed=failed, ignored=ignored,
                    successful=successful, completeInventory=complete, captureAccepted=capture_ok,
                    classification=classification, exitCode=test[''exitCode''],
                    deadlineExceeded=test[''timedOut''], logSha256=files[prefix+''.log''][''sha256'']))
            all_passed = all(x[''successful''] for x in verified)
            require(current[''taskResult''] == (0 if all_passed else 1), ''Unexpected guest controller exit code.'')
            require(progress[''phase''] == (''passed'' if all_passed else ''failed''), ''Unexpected terminal guest phase.'')
            record = dict(schema=1, status=''passed'' if all_passed else ''failed'',
                sourceRepository=coverage.SOURCE_REPOSITORY, controllerRepository=coverage.CONTROLLER_REPOSITORY,
                sourceSha=plan[''sourceSha''], sourceTree=plan[''sourceTree''], vmId=coverage.VM_ID,
                networkAdapters=0, context=context, planId=plan[''planId''], bundleRunId=int(plan[''runId'']),
                bundleRunAttempt=int(plan[''runAttempt'']), bundleControllerSha=plan[''controllerSha''],
                validationCommit=plan[''sourceSha''], archiveSha256=plan[''archiveSha256''],
                manifestSha256=plan[''manifestSha256''], bodySha256=plan[''bodySha256''],
                verifiedUtc=datetime.now(timezone.utc).isoformat(), results=verified,
                executionCompleted=True, completeInventory=all(x[''completeInventory''] for x in verified),
                captureAccepted=all(x[''captureAccepted''] for x in verified), applicationFilesChanged=False)
            # Digest binds the local verification inputs before the report is emitted.
            record[''verificationSha256''] = hashlib.sha256(json.dumps(
                dict(plan=plan,current=current),sort_keys=True,separators=('','','':'')).encode()).hexdigest()
            if all_passed:
                coverage.validate_report(record,plan[''sourceTree''])
            return record
        '

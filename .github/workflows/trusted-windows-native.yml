            LPWSTR sid = NULL;
            PSECURITY_DESCRIPTOR sd = NULL;
            HWINSTA original = GetProcessWindowStation(), station = NULL;
            HDESK desktop = NULL;
            PROCESS_INFORMATION pi = {0};
            HANDLE job = NULL;
            wchar_t name[128], desktop_name[128], full_name[512], sddl[1024], command[32768];
            if (!original || !OpenProcessToken(GetCurrentProcess(), TOKEN_QUERY, &token)) goto cleanup;
            GetTokenInformation(token, TokenUser, NULL, 0, &bytes);
            if (GetLastError() != ERROR_INSUFFICIENT_BUFFER || !bytes) goto cleanup;
            user = (PTOKEN_USER)LocalAlloc(LPTR, bytes);
            if (!user || !GetTokenInformation(token, TokenUser, user, bytes, &bytes)) goto cleanup;
            if (!ConvertSidToStringSidW(user->User.Sid, &sid)) goto cleanup;
            if (swprintf_s(sddl, 1024, L"D:P(A;;GA;;;SY)(A;;GA;;;%s)(A;;0x000201ff;;;AC)S:(ML;;NW;;;LW)", sid) < 0) goto cleanup;
            if (!ConvertStringSecurityDescriptorToSecurityDescriptorW(sddl, SDDL_REVISION_1, &sd, NULL)) goto cleanup;
            SECURITY_ATTRIBUTES sa = {sizeof(sa), sd, FALSE};
            if (swprintf_s(name, 128, L"CodexProbeStation-%lu-%llu", GetCurrentProcessId(), GetTickCount64()) < 0) goto cleanup;
            if (swprintf_s(desktop_name, 128, L"CodexProbeDesktop-%lu-%llu", GetCurrentProcessId(), GetTickCount64()) < 0) goto cleanup;
            if (own_station) {
                station = CreateWindowStationW(name, 0, WINSTA_ALL_ACCESS, &sa);

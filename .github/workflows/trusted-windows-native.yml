    - name: Build the x64 Windows npm handoff package
      shell: bash
      env:
        LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
      run: |
        set -euo pipefail
        version="$(cargo metadata --manifest-path codex-rs/Cargo.toml --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "codex-cli"))')"
        target=x86_64-pc-windows-msvc
        handoff="$RUNNER_TEMP/native-codex-evidence/windows-handoff/$target"
        mkdir -p "$handoff"
        cargo --config codex-rs/.cargo/config.toml build --manifest-path codex-rs/Cargo.toml --locked --release --timings --target "$target" \
          --bin codex --bin codex-app-server --bin codex-code-mode-host \
          --bin codex-command-runner --bin codex-windows-sandbox-setup \
          2>&1 | tee "$handoff/build.log"
        test "${PIPESTATUS[0]}" -eq 0
        cp "$CARGO_TARGET_DIR/cargo-timings/cargo-timing.html" "$handoff/cargo-timing.html"
        release="$CARGO_TARGET_DIR/$target/release"
        python3 scripts/build_codex_package.py \
          --target "$target" --variant codex --package-version "$version" \
          --entrypoint-bin "$release/codex.exe" \
          --code-mode-host-bin "$release/codex-code-mode-host.exe" \
          --codex-command-runner-bin "$release/codex-command-runner.exe" \
          --codex-windows-sandbox-setup-bin "$release/codex-windows-sandbox-setup.exe" \
          --archive-output "$handoff/codex-package-$target.tar.gz" \
          --archive-output "$handoff/codex-package-$target.tar.zst" \
          2>&1 | tee "$handoff/package.log"
        test "${PIPESTATUS[0]}" -eq 0
        sha256sum "$handoff"/* > "$handoff/SHA256SUMS"
    - name: Import and verify the ARM64 MSVC package environment
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $vsDevCmd = 'C:\BuildTools\Common7\Tools\VsDevCmd.bat'
        $envLines = & $env:ComSpec /d /c ('"{0}" -no_logo -arch=arm64 -host_arch=x64 >nul && set' -f $vsDevCmd)
        if ($LASTEXITCODE -ne 0) { throw 'ARM64 VsDevCmd failed.' }
        $exports = @('INCLUDE','LIB','LIBPATH','PATH','UCRTVersion','UniversalCRTSdkDir','VCINSTALLDIR','VCToolsInstallDir','WindowsLibPath','WindowsSdkBinPath','WindowsSdkDir','WindowsSDKLibVersion','WindowsSDKVersion','VSCMD_ARG_HOST_ARCH','VSCMD_ARG_TGT_ARCH')
        foreach ($line in $envLines) {
          if ($line -match '^([^=]+)=(.*)$' -and $exports -contains $matches[1]) {
            [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            "$($matches[1])=$($matches[2])" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }
        }
        if ($env:VSCMD_ARG_HOST_ARCH -ne 'x64' -or $env:VSCMD_ARG_TGT_ARCH -ne 'arm64') { throw 'Expected x64 host / ARM64 target for the package build.' }
        $probe = Join-Path $env:RUNNER_TEMP 'native-codex-evidence/arm64-probe'
        New-Item -ItemType Directory -Force $probe | Out-Null
        '#include <windows.h>', 'int main(void) { return sizeof(void*) == 8 ? 0 : 1; }' | Set-Content (Join-Path $probe 'probe.c')
        & cl.exe /nologo /W4 /WX (Join-Path $probe 'probe.c') "/Fo$probe/probe.obj" "/Fe$probe/probe.exe"
        if ($LASTEXITCODE -ne 0) { throw 'ARM64 MSVC SDK compilation failed.' }
        $bytes = [IO.File]::ReadAllBytes((Join-Path $probe 'probe.exe'))
        $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
        if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0xaa64) { throw 'Compiler did not produce an ARM64 PE executable.' }
        & rustup target add --toolchain 1.95.0-x86_64-pc-windows-msvc aarch64-pc-windows-msvc
        if ($LASTEXITCODE -ne 0) { throw 'ARM64 Rust standard library setup failed.' }
        "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$((Get-Command link.exe).Source)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "ARM64 compiler: $((Get-Command cl.exe).Source)"
        $version = '21.1.8'
        $archiveHash = '749d22f565fcd5718dbed06512572d0e5353b502c03fe1f7f17ee8b8aca21a47'
        $installation = 'R:\tools\llvm-21.1.8'
        $manifestPath = Join-Path $installation 'codex-installation.json'
        $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
        if ($manifest.version -cne $version -or $manifest.archiveSha256 -cne $archiveHash) { throw 'LLVM installation provenance mismatch.' }
        $bin = Join-Path $installation 'bin'
        if (@($manifest.binaries.PSObject.Properties).Count -ne 6) { throw 'Incomplete LLVM installation inventory.' }
        foreach ($entry in $manifest.binaries.PSObject.Properties) {
            if ($entry.Name -notin @('clang.exe','clang-cl.exe','clang++.exe','llvm-lib.exe','llvm-ar.exe','lld-link.exe')) { throw 'Unexpected LLVM manifest entry.' }
            $path = Join-Path $bin $entry.Name
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry.Value) { throw "LLVM binary checksum mismatch: $($entry.Name)" }
        }
        $env:PATH = "$bin;$env:PATH"
        $clang = Join-Path $bin 'clang.exe'
        $clangCl = Join-Path $bin 'clang-cl.exe'
        $llvmLib = Join-Path $bin 'llvm-lib.exe'
        & $clang --version
        if ($LASTEXITCODE -ne 0) { throw 'Clang could not start.' }
        $probe = Join-Path $env:RUNNER_TEMP 'native-codex-evidence\arm64-clang-probe'
        $null = New-Item -ItemType Directory -Path $probe -Force
        '#include <windows.h>', 'int main(void) { return sizeof(void*) == 8 ? 0 : 1; }' | Set-Content -LiteralPath (Join-Path $probe 'probe.c') -Encoding ascii
        & $clangCl --target=aarch64-pc-windows-msvc /nologo /MT /W4 /WX (Join-Path $probe 'probe.c') "/Fo$probe\probe.obj" "/Fe$probe\probe.exe"
        if ($LASTEXITCODE -ne 0) { throw 'Clang ARM64 C/Windows SDK/MSVC link probe failed.' }
        $pe = [IO.File]::ReadAllBytes((Join-Path $probe 'probe.exe'))
        $peOffset = [BitConverter]::ToInt32($pe, 0x3c)
        if ([BitConverter]::ToUInt16($pe, $peOffset + 4) -ne 0xaa64) { throw 'Clang did not produce an ARM64 PE executable.' }
        '.text', '.globl codex_arm64_probe', 'codex_arm64_probe:', '  ret' | Set-Content -LiteralPath (Join-Path $probe 'probe.S') -Encoding ascii
        & $clang --target=aarch64-pc-windows-msvc -c (Join-Path $probe 'probe.S') -o (Join-Path $probe 'assembly.obj')
        if ($LASTEXITCODE -ne 0) { throw 'Clang ARM64 assembler probe failed.' }
        $coff = [IO.File]::ReadAllBytes((Join-Path $probe 'assembly.obj'))
        if ([BitConverter]::ToUInt16($coff, 0) -ne 0xaa64) { throw 'Assembler did not produce ARM64 COFF.' }
        & $llvmLib "/out:$probe\probe.lib" (Join-Path $probe 'assembly.obj')
        if ($LASTEXITCODE -ne 0) { throw 'LLVM MSVC librarian probe failed.' }
        @(
            "PATH=$env:PATH",
            "CC_aarch64_pc_windows_msvc=$clangCl",
            "CXX_aarch64_pc_windows_msvc=$clangCl",
            "AR_aarch64_pc_windows_msvc=$llvmLib"
        ) | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        [ordered]@{version=$version;path=$installation;archiveSha256=$archiveHash;host='x86_64-pc-windows-msvc';target='aarch64-pc-windows-msvc';cAndSdkProbe='passed';assemblyProbe='passed';librarianProbe='passed'} |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $probe 'verification.json') -Encoding utf8
    - name: Prepare V8 inputs for the ARM64 Windows package target
      uses: ./.github/actions/setup-rusty-v8
      with:
        target: aarch64-pc-windows-msvc
    - name: Build the ARM64 Windows npm handoff package
      shell: bash
      env:
        LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
      run: |
        set -euo pipefail
        version="$(cargo metadata --manifest-path codex-rs/Cargo.toml --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "codex-cli"))')"
        target=aarch64-pc-windows-msvc
        handoff="$RUNNER_TEMP/native-codex-evidence/windows-handoff/$target"
        mkdir -p "$handoff"
        cargo --config codex-rs/.cargo/config.toml build --manifest-path codex-rs/Cargo.toml --locked --release --timings --target "$target" \
          --bin codex --bin codex-app-server --bin codex-code-mode-host \
          --bin codex-command-runner --bin codex-windows-sandbox-setup \
          2>&1 | tee "$handoff/build.log"
        test "${PIPESTATUS[0]}" -eq 0
        cp "$CARGO_TARGET_DIR/cargo-timings/cargo-timing.html" "$handoff/cargo-timing.html"
        release="$CARGO_TARGET_DIR/$target/release"
        python3 scripts/build_codex_package.py \
          --target "$target" --variant codex --package-version "$version" \
          --entrypoint-bin "$release/codex.exe" \
          --code-mode-host-bin "$release/codex-code-mode-host.exe" \
          --codex-command-runner-bin "$release/codex-command-runner.exe" \
          --codex-windows-sandbox-setup-bin "$release/codex-windows-sandbox-setup.exe" \
          --archive-output "$handoff/codex-package-$target.tar.gz" \
          --archive-output "$handoff/codex-package-$target.tar.zst" \
          2>&1 | tee "$handoff/package.log"
        test "${PIPESTATUS[0]}" -eq 0
        sha256sum "$handoff"/* > "$handoff/SHA256SUMS"
    - name: Write Windows handoff manifest
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $evidence = Join-Path $env:RUNNER_TEMP 'native-codex-evidence'
        $bazelLog = Join-Path $evidence 'build.log'
        if (-not (Test-Path -LiteralPath $bazelLog)) { throw 'Bazel evidence is missing.' }
        $digest = (Get-FileHash -LiteralPath $bazelLog -Algorithm SHA256).Hash.ToLowerInvariant()
        $coveragePath = Join-Path $evidence 'combined-native-coverage.json'
        $coverage = Get-Content -LiteralPath $coveragePath -Raw | ConvertFrom-Json
        if ($coverage.status -cne 'passed' -or $coverage.sourceTree -cne $env:NATIVE_SOURCE_TREE) {
          throw 'Complete host and isolated-VM coverage is required before packaging success.'
        }
        $guestResult = Join-Path $evidence 'privileged-guest-result.json'
        $x64Build = Join-Path $evidence 'windows-handoff/x86_64-pc-windows-msvc/build.log'
        $x64Package = Join-Path $evidence 'windows-handoff/x86_64-pc-windows-msvc/package.log'
        $arm64Build = Join-Path $evidence 'windows-handoff/aarch64-pc-windows-msvc/build.log'
        $arm64Package = Join-Path $evidence 'windows-handoff/aarch64-pc-windows-msvc/package.log'
        foreach ($path in @($x64Build, $x64Package, $arm64Build, $arm64Package)) {
          if (-not (Test-Path -LiteralPath $path)) { throw "Windows package evidence is missing: $path" }
        }
        [ordered]@{
          schema = 1
          commit = $env:SOURCE_SHA
          producer = 'windows-private-controller'
          status = 'success'
          checks = @(
            [ordered]@{ name = 'windows-bazel'; exit_code = 0; log_sha256 = $digest }
            [ordered]@{ name = 'windows-native-combined-coverage'; exit_code = 0; log_sha256 = (Get-FileHash -LiteralPath $coveragePath -Algorithm SHA256).Hash.ToLowerInvariant() }
            [ordered]@{ name = 'windows-privileged-vm'; exit_code = 0; log_sha256 = (Get-FileHash -LiteralPath $guestResult -Algorithm SHA256).Hash.ToLowerInvariant() }
            [ordered]@{ name = 'windows-package-x64-build'; exit_code = 0; log_sha256 = (Get-FileHash -LiteralPath $x64Build -Algorithm SHA256).Hash.ToLowerInvariant() }
            [ordered]@{ name = 'windows-package-x64-stage'; exit_code = 0; log_sha256 = (Get-FileHash -LiteralPath $x64Package -Algorithm SHA256).Hash.ToLowerInvariant() }
            [ordered]@{ name = 'windows-package-arm64-build'; exit_code = 0; log_sha256 = (Get-FileHash -LiteralPath $arm64Build -Algorithm SHA256).Hash.ToLowerInvariant() }
            [ordered]@{ name = 'windows-package-arm64-stage'; exit_code = 0; log_sha256 = (Get-FileHash -LiteralPath $arm64Package -Algorithm SHA256).Hash.ToLowerInvariant() }
          )
        } | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $evidence 'windows-manifest.json')
    - name: Record source and runner evidence
      if: always()
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $storage=Get-Content -LiteralPath 'C:\ProgramData\CodexRunner\volume\volume.json' -Raw|ConvertFrom-Json
        if($storage.imagePath -cne 'D:\CodexRunnerVolume\build-ssd.vhdx' -or $storage.maximumBytes -ne 1498943586304){throw 'Expected the bounded D-backed SSD volume.'}
        & 'C:\ProgramData\CodexRunner\volume\Assert-CodexBuildVolume.ps1'
        $buildVolume = [IO.DriveInfo]::new('R:\')
        $scratchVolume = [IO.DriveInfo]::new('D:\')
        if (-not $buildVolume.IsReady -or -not $scratchVolume.IsReady) { throw 'Required build/scratch volume is not ready.' }
        New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\native-codex-evidence" | Out-Null
        [ordered]@{
          runId = $env:GITHUB_RUN_ID
          runAttempt = $env:GITHUB_RUN_ATTEMPT
          controllerSha = $env:GITHUB_SHA
          sourceSha = $env:SOURCE_SHA
          machine = $env:COMPUTERNAME
          runner = $env:RUNNER_NAME
          target = 'x86_64-pc-windows-msvc'
          host = 'local_windows_msvc'
          workspaceRoot = 'H:/codex-ci'
          bazelBuildRoot = 'R:/'
          backingImage = $storage.imagePath.Replace('\','/')
          backingDrive = 'D:'
          ssdMount = 'D:/codex-ci'
          maximumBuildBytes = $storage.maximumBytes
          buildVolumeGuid = $storage.volumeGuid
          backingVolumeGuid = $storage.hostVolumeGuid
          retentionDays = 14
          storageMeasurementUtc = [DateTime]::UtcNow.ToString('o')
          buildVolume = [ordered]@{ drive = $buildVolume.Name; totalBytes = $buildVolume.TotalSize; availableBytes = $buildVolume.AvailableFreeSpace }
          testScratchVolume = [ordered]@{ drive = $scratchVolume.Name; totalBytes = $scratchVolume.TotalSize; availableBytes = $scratchVolume.AvailableFreeSpace }
        } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\native-codex-evidence\identity.json"
    - name: Upload native evidence
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: native-codex-${{ inputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/native-codex-evidence
        if-no-files-found: error
        retention-days: 14
    - name: Upload Windows package handoff
      if: success()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: windows-handoff-${{ inputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/native-codex-evidence/windows-handoff
          ${{ runner.temp }}/native-codex-evidence/windows-manifest.json
        if-no-files-found: error
        retention-days: 14
'on':
  workflow_call:
    inputs:
      source_sha:
        description: Exact holyglory/codex commit to validate
        required: true
        type: string
      boot_after_utc:
        description: Optional UTC timestamp; require a reboot after it
        required: false
        type: string

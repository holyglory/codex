        def package(metadata_file, execroot_file):
            if os.environ[''COMPUTERNAME''] != ''HG-TR2020'':
                raise ValueError(''Unexpected runner machine'')
            SOURCE, SOURCE_TREE, run_id, attempt, bundle_id = run_identity(os.environ)
            workspace = Path(os.environ[''CODEX_BAZEL_WORKSPACE'']).resolve(strict=True)
            output_root = Path(r''R:\b'').resolve(strict=True)
            roots = [x.strip() for x in Path(execroot_file).read_text().splitlines()

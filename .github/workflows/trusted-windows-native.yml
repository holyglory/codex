name: Trusted native Windows release

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact holyglory/codex commit to validate and package
        required: true
        type: string
      packaging_sha:
        description: Packaging-only workflow/script commit; native source remains source_sha
        required: true
        type: string
      package_target:
        description: Build both targets or resume one target using its retained checkpoint
        required: false
        default: both
        type: string
      boot_after_utc:
        description: Optional UTC timestamp; require an actual reboot after it
        required: false
        type: string

permissions:
  contents: read

jobs:
  native-msvc:
    # The reusable workflow's github context belongs to this private caller.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#github-context
    if: >-
      github.repository == 'holyglory/codex-win-msvc-ci' &&
      github.event.repository.private == true &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'holyglory' &&
      github.triggering_actor == 'holyglory'
    runs-on: [self-hosted, Windows, X64, codex-win-msvc]
    # x64 packaging completes before the ARM64 cross-build. Keep enough wall
    # time for both targets while retaining per-target checkpoints below.
    timeout-minutes: 900
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PACKAGE_TARGET: ${{ inputs.package_target }}
      EXPECTED_BOOT_AFTER_UTC: ${{ inputs.boot_after_utc }}
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      INSTA_UPDATE: 'no'
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
    steps:
      - name: Require an exact public source commit
        run: |
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'source_sha must be a full lowercase commit ID.' }
          if ($env:PACKAGE_TARGET -cnotin @('both', 'x64', 'arm64')) { throw 'Unknown Windows package target.' }
      - name: Enable long paths for dependency checkouts
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'The runner Git configuration could not enable long paths.' }
      - name: Check out the exact public source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: holyglory/codex
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify private service identity and existing build volume
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          if ($identity.Name -notmatch '\\svc_codex_runner$' -or
              ([Security.Principal.WindowsPrincipal]$identity).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The existing non-admin svc_codex_runner identity is required.'
          }
          if (-not ([IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)).StartsWith('H:\codex-ci\_work\', [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Unexpected private runner workspace.'
          }
          $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToUniversalTime()
          if ($env:EXPECTED_BOOT_AFTER_UTC -and $boot -le ([DateTimeOffset]::Parse($env:EXPECTED_BOOT_AFTER_UTC, [Globalization.CultureInfo]::InvariantCulture)).UtcDateTime) {
            throw 'An actual Windows reboot has not occurred after the requested checkpoint.'
          }
          & 'C:\ProgramData\CodexRunner\volume\Assert-CodexBuildVolume.ps1'
          $mounted = [Text.StringBuilder]::new(128)
          $drive = [Text.StringBuilder]::new(128)
          if (-not [CodexVolumeProbe]::GetVolumeNameForVolumeMountPoint('H:\codex-ci\', $mounted, $mounted.Capacity) -or
              -not [CodexVolumeProbe]::GetVolumeNameForVolumeMountPoint('R:\', $drive, $drive.Capacity) -or $mounted.ToString() -ne $drive.ToString()) {
            throw 'R: must refer to the existing bounded H:\codex-ci build volume.'
          }
          $cargoHome = [IO.Path]::GetFullPath($env:CARGO_HOME)
          if ($cargoHome.StartsWith('H:\codex-ci\', [StringComparison]::OrdinalIgnoreCase)) {
            $shortCargoHome = 'R:\' + $cargoHome.Substring('H:\codex-ci\'.Length)
          } elseif ($cargoHome.StartsWith('R:\', [StringComparison]::OrdinalIgnoreCase)) {
            $shortCargoHome = $cargoHome
          } else {
            throw 'The runner Cargo cache must remain on the existing build volume.'
          }
          if (-not (Test-Path -LiteralPath $shortCargoHome -PathType Container)) {
            throw 'The existing Cargo cache is unavailable through the short drive alias.'
          }
          $evidence = Join-Path $env:RUNNER_TEMP "native-codex-evidence/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $null = New-Item -ItemType Directory -Path $evidence -ErrorAction Stop
          foreach ($directory in @('R:/o', 'R:/b', 'R:/bazel-disk-cache', 'R:/bazel-repository-cache', 'R:/bazel-repo-contents-cache', 'R:/cargo-target', 'R:/tmp')) {
            $null = New-Item -ItemType Directory -Path $directory -Force
          }
          @(
            "CODEX_WINDOWS_EVIDENCE=$evidence", "CODEX_REPO_ROOT=$env:GITHUB_WORKSPACE", "CARGO_HOME=$shortCargoHome",
            'BAZEL_OUTPUT_BASE=R:/o', 'BAZEL_OUTPUT_USER_ROOT=R:/b',
            'BAZEL_REPOSITORY_CACHE=R:/bazel-repository-cache', 'BAZEL_REPO_CONTENTS_CACHE=R:/bazel-repo-contents-cache',
            'CARGO_TARGET_DIR=R:/cargo-target', 'TEMP=R:/tmp', 'TMP=R:/tmp', "STABLE_GIT_COMMIT=$env:SOURCE_SHA"
          ) | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{runner=$env:RUNNER_NAME;controller_commit=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT;last_boot_utc=$boot;build_volume=$drive.ToString()} |
            ConvertTo-Json | Set-Content (Join-Path $evidence 'runner.json') -Encoding utf8
      - name: Check out packaging-only workflow helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: holyglory/codex
          ref: ${{ inputs.packaging_sha }}
          path: packaging-source
          sparse-checkout: |
            .github/scripts/downstream-windows-native.ps1
            .github/scripts/rusty_v8_bazel.py
            .github/scripts/run_bazel_with_buildbuddy.py
            .github/scripts/rusty_v8_module_bazel.py
          persist-credentials: false
      - name: Install packaging helper outside native source tree
        shell: pwsh
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE '.github/scripts-packaging'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -Path 'packaging-source/.github/scripts/*' -Destination $destination -Force
      - name: Import the preinstalled x64 MSVC SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = & $env:ComSpec /d /c '"C:\BuildTools\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64 >nul && set'
          if ($LASTEXITCODE -ne 0) { throw 'The preinstalled x64 MSVC SDK is unavailable.' }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$' -and $matches[1] -in @('PATH','INCLUDE','LIB','LIBPATH','VCINSTALLDIR','VCToolsInstallDir','WindowsSdkDir','WindowsSDKVersion','VSCMD_ARG_HOST_ARCH','VSCMD_ARG_TGT_ARCH')) {
              "$($matches[1])=$($matches[2])" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Select the source-pinned Rust toolchain and available processors
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('codex-rs/rust-toolchain.toml').read_text())['toolchain']['channel'])"
          if ($LASTEXITCODE -ne 0 -or $toolchain -cnotmatch '^\d+\.\d+\.\d+$') { throw 'An exact source-pinned Rust toolchain is required.' }
          rustup toolchain install $toolchain --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'The source-pinned Rust toolchain is unavailable.' }
          "RUSTUP_TOOLCHAIN=$toolchain" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $cpuCount = [Environment]::ProcessorCount
          if ($cpuCount -lt 1) { throw 'The Windows runner reported no processors.' }
          "CODEX_WINDOWS_CPU_COUNT=$cpuCount" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BAZEL_JOBS=$cpuCount" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_JOBS=$cpuCount" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Provision pinned just in the runner user cache
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command just -ErrorAction SilentlyContinue)) {
            cargo install just --locked --version 1.51.0 --root 'H:\codex-ci\cargo-home'
          }
          if (-not (Get-Command just -ErrorAction SilentlyContinue)) { throw 'Pinned just was not installed.' }
          $nextest = cargo nextest --version 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $nextest) {
            cargo install cargo-nextest --locked --version 0.9.103 --root 'H:\codex-ci\cargo-home'
          }
          cargo nextest --version
          if ($LASTEXITCODE -ne 0) { throw 'Pinned cargo-nextest was not installed.' }
      - name: Install pinned DotSlash
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/install-dotslash"
          mkdir -p "$root/bin"
          release_json="$root/release.json"
          curl -fsSL --retry 5 --header "authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/facebook/dotslash/releases/latest -o "$release_json"
          read -r version asset digest <<EOF
          $(python - "$release_json" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1]))
          version = release['tag_name']
          asset = f"dotslash-windows.{version}.tar.gz"
          item = next(item for item in release['assets'] if item['name'] == asset)
          print(version, asset, item['digest'])
          PY
          )
          EOF
          archive="$root/dotslash.tar.gz"
          curl -fsSL --retry 5 --header "authorization: Bearer $GH_TOKEN" \
            "https://github.com/facebook/dotslash/releases/download/$version/$asset" -o "$archive"
          expected="${digest#sha256:}"
          echo "$expected  $archive" | sha256sum --check
          tar xvf "$archive" -O > "$root/bin/dotslash.exe" --force-local
          echo "$root/bin" >> "$GITHUB_PATH"
          "$root/bin/dotslash.exe" --version
      - name: Check tool prerequisites before compiling
        run: python .github/scripts-packaging/downstream-windows-native.ps1 prerequisites
      - name: Extend the Windows sparse-work test budget
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'codexmulti-nextest.toml'
          Copy-Item -LiteralPath 'codex-rs/.config/nextest.toml' -Destination $config
          Add-Content -LiteralPath $config -Value @'

          [[profile.default.overrides]]
          filter = 'package(codex-usage) & test(=repeated_switches_aggregate_by_job_before_report_limits)'
          slow-timeout = { period = "2m", terminate-after = 2 }

          [[profile.default.overrides]]
          filter = 'package(codex-usage) & test(=review_retention::tests::work_tests::job_totals_survive_hourly_lifetime_restart_and_resumed_work)'
          slow-timeout = { period = "3m", terminate-after = 2 }
          '@
          "CODEX_WINDOWS_NEXTEST_CONFIG_FILE=$config" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build a matching x64 V8 archive and binding
        run: python .github/scripts-packaging/downstream-windows-native.ps1 source-v8
      - name: Validate native Windows account, usage and V8 regressions
        run: python .github/scripts-packaging/downstream-windows-native.ps1 acceptance
      - name: Build, assemble and run the x64 package
        if: inputs.package_target != 'arm64'
        run: python .github/scripts-packaging/downstream-windows-native.ps1 package --target x86_64-pc-windows-msvc
      - name: Seal the x64 handoff checkpoint
        if: inputs.package_target != 'arm64'
        run: python .github/scripts-packaging/downstream-windows-native.ps1 finalize-target --target x86_64-pc-windows-msvc
      - name: Upload the x64 handoff checkpoint
        if: inputs.package_target != 'arm64'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-handoff-${{ inputs.source_sha }}-x86_64
          path: ${{ env.CODEX_WINDOWS_EVIDENCE }}/windows-handoff/x86_64-pc-windows-msvc
          if-no-files-found: error
          retention-days: 14
      - name: Import the preinstalled ARM64 cross SDK
        if: inputs.package_target != 'x64'
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = & $env:ComSpec /d /c '"C:\BuildTools\Common7\Tools\VsDevCmd.bat" -no_logo -arch=arm64 -host_arch=x64 >nul && set'
          if ($LASTEXITCODE -ne 0) { throw 'The preinstalled x64-to-ARM64 MSVC SDK is unavailable.' }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$' -and $matches[1] -in @('PATH','INCLUDE','LIB','LIBPATH','VCINSTALLDIR','VCToolsInstallDir','WindowsSdkDir','WindowsSDKVersion','VSCMD_ARG_HOST_ARCH','VSCMD_ARG_TGT_ARCH')) {
              "$($matches[1])=$($matches[2])" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Verify the published ARM64 V8 pair against source-pinned checksums
        if: inputs.package_target != 'x64'
        run: python .github/scripts-packaging/downstream-windows-native.ps1 published-v8
      - name: Cross compile and assemble the ARM64 package
        if: inputs.package_target != 'x64'
        run: python .github/scripts-packaging/downstream-windows-native.ps1 package --target aarch64-pc-windows-msvc
      - name: Seal the ARM64 handoff checkpoint
        if: inputs.package_target != 'x64'
        run: python .github/scripts-packaging/downstream-windows-native.ps1 finalize-target --target aarch64-pc-windows-msvc
      - name: Upload the ARM64 handoff checkpoint
        if: inputs.package_target != 'x64'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-handoff-${{ inputs.source_sha }}-aarch64
          path: ${{ env.CODEX_WINDOWS_EVIDENCE }}/windows-handoff/aarch64-pc-windows-msvc
          if-no-files-found: error
          retention-days: 14
      - name: Seal exact source, checksums and Windows handoff
        if: inputs.package_target == 'both'
        run: python .github/scripts-packaging/downstream-windows-native.ps1 finalize
      - name: Preserve native diagnostic evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: native-codex-${{ inputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ env.CODEX_WINDOWS_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload the verified Windows package handoff
        if: inputs.package_target == 'both'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-handoff-${{ inputs.source_sha }}
          path: ${{ env.CODEX_WINDOWS_EVIDENCE }}/windows-handoff
          if-no-files-found: error
          retention-days: 14

name: Trusted native Windows MSVC
permissions:
  contents: read
jobs:
  native-msvc:
    if: github.repository == 'holyglory/codex-win-msvc-ci' && github.event.repository.private == true && github.event_name
      == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'holyglory' && github.triggering_actor
      == 'holyglory'
    runs-on:
    - self-hosted
    - Windows
    - X64
    - codex-win-msvc
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      CODEX_WINDOWS_BUILD_ROOT: H:/codex-ci
      EXPECTED_BOOT_AFTER_UTC: ${{ inputs.boot_after_utc }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      CARGO_BUILD_JOBS: '56'
    steps:
    - name: Verify source identity input
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') {
          throw 'source_sha must be a full 40-character commit ID.'
        }
    - name: Checkout exact public candidate
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: holyglory/codex
        ref: ${{ inputs.source_sha }}
        token: ${{ github.token }}
        persist-credentials: false
        fetch-depth: 1
    - name: Verify runner identity, reboot boundary, and checkout
      run: |
        $ErrorActionPreference = 'Stop'
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        if ($identity.Name -notmatch '\\svc_codex_runner$') { throw 'Unexpected runner identity.' }
        if (([Security.Principal.WindowsPrincipal]$identity).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          throw 'The runner must not be an administrator.'
        }
        $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
        if (-not $workspace.StartsWith('H:\codex-ci\_work\', [StringComparison]::OrdinalIgnoreCase)) {
          throw 'The workspace must be beneath H:\codex-ci\_work.'
        }
        $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToUniversalTime()
        if ($env:EXPECTED_BOOT_AFTER_UTC) {
          $minimumBoot = [DateTimeOffset]::Parse($env:EXPECTED_BOOT_AFTER_UTC, [Globalization.CultureInfo]::InvariantCulture)
          if ($boot -le $minimumBoot.UtcDateTime) { throw 'Windows has not rebooted since the requested checkpoint.' }
        }
        $actual = (git rev-parse HEAD).Trim()
        if ($actual -cne $env:SOURCE_SHA) { throw "Checked out $actual instead of $env:SOURCE_SHA." }
        [ordered]@{
          machine = $env:COMPUTERNAME
          identity = $identity.Name
          runner = $env:RUNNER_NAME
          workspace = $workspace
          sourceSha = $actual
          lastBootUtc = $boot
        } | ConvertTo-Json
    - name: Configure preinstalled native build tools
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        & 'C:\ProgramData\CodexRunner\volume\Assert-CodexBuildVolume.ps1'
        $mounted = [Text.StringBuilder]::new(128)
        $drive = [Text.StringBuilder]::new(128)
        if (-not [CodexVolumeProbe]::GetVolumeNameForVolumeMountPoint('H:\codex-ci\',$mounted,$mounted.Capacity) -or
            -not [CodexVolumeProbe]::GetVolumeNameForVolumeMountPoint('R:\',$drive,$drive.Capacity) -or
            $mounted.ToString() -ne $drive.ToString()) { throw 'R: is not the bounded build volume on H:.' }
        $root = 'R:'
        $repoRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).Replace('H:\codex-ci\','R:\')
        if (-not $repoRoot.StartsWith('R:\_work\',[StringComparison]::OrdinalIgnoreCase)) { throw 'Unexpected canonical repository path.' }
        foreach ($name in @('CARGO_HOME','RUSTUP_HOME','BAZELISK_HOME','HOME','USERPROFILE','APPDATA','LOCALAPPDATA','RUNNER_TOOL_CACHE','PATH')) {
          $value = [Environment]::GetEnvironmentVariable($name)
          if ($value) { "$name=$($value.Replace('H:\codex-ci','R:').Replace('H:/codex-ci','R:'))" | Add-Content -Path $env:GITHUB_ENV }
        }
        $dirs = @(
          "$root/o",
          "$root/b",
          "$root/bazel-repository-cache",
          "$root/bazel-repo-contents-cache",
          "$root/cargo-target",
          "$root/tmp",
          "$env:RUNNER_TEMP/native-codex-evidence"
        )
        $dirs | ForEach-Object { New-Item -ItemType Directory -Force -Path $_ | Out-Null }
        @(
          "SYSTEMROOT=$([Environment]::GetFolderPath('Windows'))",
          "windir=$([Environment]::GetFolderPath('Windows'))",
          "SystemDrive=C:",
          "ComSpec=C:\Windows\System32\cmd.exe",
          "CI_BUILD_ROOT=$root",
          "BAZEL_OUTPUT_BASE=$root/o",
          "BAZEL_OUTPUT_USER_ROOT=$root/b",
          "BAZEL_REPOSITORY_CACHE=$root/bazel-repository-cache",
          "BAZEL_REPO_CONTENTS_CACHE=$root/bazel-repo-contents-cache",
          "CARGO_TARGET_DIR=$root/cargo-target",
          "TEMP=$root/tmp",
          "TMP=$root/tmp",
          "CODEX_REPO_ROOT=$repoRoot",
          "CODEX_BAZEL_WORKSPACE=$repoRoot",
          "BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1"
        ) | Add-Content -Path $env:GITHUB_ENV
    - name: Import and verify the native x64 MSVC SDK environment
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # The service account cannot enumerate the installer catalog through vswhere.
        # This runner has a dedicated fixed installation, verified by compilation below.
        $installPath = 'C:\BuildTools'
        $vsDevCmd = Join-Path $installPath 'Common7/Tools/VsDevCmd.bat'
        if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) { throw 'The dedicated MSVC Build Tools installation is missing.' }
        $envLines = & $env:ComSpec /d /c ('"{0}" -no_logo -arch=x64 -host_arch=x64 >nul && set' -f $vsDevCmd)
        if ($LASTEXITCODE -ne 0) { throw 'VsDevCmd failed.' }
        $exports = @('INCLUDE','LIB','LIBPATH','PATH','UCRTVersion','UniversalCRTSdkDir','VCINSTALLDIR','VCToolsInstallDir','WindowsLibPath','WindowsSdkBinPath','WindowsSdkDir','WindowsSDKLibVersion','WindowsSDKVersion','VSCMD_ARG_HOST_ARCH','VSCMD_ARG_TGT_ARCH')
        foreach ($line in $envLines) {
          if ($line -match '^([^=]+)=(.*)$' -and $exports -contains $matches[1]) {
            [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            "$($matches[1])=$($matches[2])" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }
        }
        foreach ($name in @('INCLUDE','LIB','VCToolsInstallDir','WindowsSdkDir','WindowsSDKVersion')) {
          if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing MSVC environment: $name" }
        }
        if ($env:VSCMD_ARG_HOST_ARCH -ne 'x64' -or $env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw 'Expected x64 MSVC host and target.' }
        @(
          "BAZEL_VC=$env:VCINSTALLDIR",
          "BAZEL_VC_FULL_VERSION=$((Split-Path $env:VCToolsInstallDir.TrimEnd('\') -Leaf))",
          "BAZEL_WINSDK_FULL_VERSION=$($env:WindowsSDKVersion.TrimEnd('\'))"
        ) | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        $probe = Join-Path $env:RUNNER_TEMP 'native-codex-evidence/msvc-probe'
        New-Item -ItemType Directory -Force $probe | Out-Null
        '#include <windows.h>', '#include <stdio.h>', 'int main(void) { printf("MSVC x64 SDK compile passed\n"); return sizeof(void*) == 8 ? 0 : 1; }' | Set-Content (Join-Path $probe 'probe.c')
        & cl.exe /nologo /W4 /WX (Join-Path $probe 'probe.c') "/Fo$probe/probe.obj" "/Fe$probe/probe.exe"
        if ($LASTEXITCODE -ne 0) { throw 'Native MSVC compilation failed.' }
        & (Join-Path $probe 'probe.exe')
        if ($LASTEXITCODE -ne 0) { throw 'Native MSVC probe failed.' }
        $rust = & rustc --version
        if ($LASTEXITCODE -ne 0 -or $rust -notmatch '^rustc 1\.95\.0 ') { throw "Expected Rust 1.95.0; got $rust" }
        Write-Host $rust
        Write-Host "MSVC: $((Get-Command cl.exe).Source)"
        Write-Host "Windows SDK: $env:WindowsSdkDir$env:WindowsSDKVersion"
    - name: Prepare pinned Windows voice inputs
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # Bazel's injected repository must use the normal drive path too.
        $env:RUNNER_TEMP = [IO.Path]::GetFullPath($env:RUNNER_TEMP).Replace('H:\codex-ci\','R:\')
        if (-not $env:RUNNER_TEMP.StartsWith('R:\',[StringComparison]::OrdinalIgnoreCase)) { throw 'Voice tools must use the bounded build volume.' }
        $manifest = Get-Content -Raw .github/scripts/voice-cygwin-snapshot.json | ConvertFrom-Json
        if (-not $env:SystemRoot -or $env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Expected the native x64 Windows OS environment.' }
        "VOICE_WINDOWS_SYSTEM_ROOT=$env:SystemRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "VOICE_WINDOWS_HOST_ARCH=$env:PROCESSOR_ARCHITECTURE" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        $pin = $manifest.archive
        $source = $manifest.sourceArchive
        $directory = Join-Path $env:RUNNER_TEMP 'voice-cygwin-snapshot'
        New-Item -ItemType Directory -Force -Path $directory | Out-Null
        foreach ($asset in @($pin, $source)) {
          $uri = "https://github.com/openai/codex/releases/download/$($pin.tag)/$($asset.name)"
          Invoke-WebRequest -Uri $uri -OutFile (Join-Path $directory $asset.name)
        }
        $sourceFile = Join-Path $directory $source.name
        if ((Get-Item $sourceFile).Length -ne $source.bytes -or
            (Get-FileHash $sourceFile -Algorithm SHA256).Hash.ToLowerInvariant() -ne $source.sha256) {
          throw 'Public Cygwin source archive mismatch.'
        }
        $archiveFile = Join-Path $directory $pin.name
        if ((Get-Item $archiveFile).Length -ne $pin.bytes -or
            (Get-FileHash $archiveFile -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) {
          throw 'Pinned Cygwin archive mismatch.'
        }
        "VOICE_WINDOWS_TARGET=x86_64-pc-windows-msvc" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "VOICE_CYGWIN_ARCHIVE=$archiveFile" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        # Use the normal drive path so the pinned-image helper can reject reparse points.
        & ./.github/scripts/setup-voice-windows.ps1 -Target x86_64-pc-windows-msvc -SnapshotArchive $archiveFile -PkgconfImage 'R:\provisioned\pkgconf\3.0.6-x64\native'
    - name: Provide a working python3 launcher for native actions
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $python = (Get-Command python.exe -ErrorAction Stop).Source
        $venv = Join-Path $env:CI_BUILD_ROOT 'tools/python-native'
        # Use Python's venv launcher, which retains the base interpreter and DLL paths.
        # A renamed copy of the base python.exe outside its installation is insufficient.
        & $python -m venv --without-pip --system-site-packages $venv
        if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the Python launcher environment.' }
        $shim = Join-Path $venv 'Scripts'
        Copy-Item -LiteralPath (Join-Path $shim 'python.exe') -Destination (Join-Path $shim 'python3.exe') -Force
        & (Join-Path $shim 'python3.exe') -c 'import sys, ssl; print(sys.executable); print(sys.version)'
        if ($LASTEXITCODE -ne 0) { throw 'The python3 launcher failed.' }
        "PATH=$shim;$env:PATH" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "CODEX_PYTHON_BIN=$shim" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Prepare checksum-pinned zstd for local package archives
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $code = @'
        import json, os, sys
        from pathlib import Path
        sys.path.insert(0, 'scripts')
        from codex_package.dotslash import fetch_dotslash_executable
        from codex_package.targets import TARGET_SPECS
        # The zstd DotSlash manifest has leading comments; the shared fetcher's
        # JSON reader only strips its shebang. Normalize a separate evidence copy.
        lines = Path('.github/workflows/zstd').read_text(encoding='utf-8').splitlines()
        while lines and (not lines[0].strip() or lines[0].lstrip().startswith(('#!', '//'))):
            lines.pop(0)
        manifest = Path(os.environ['RUNNER_TEMP']) / 'native-codex-evidence' / 'zstd-manifest.json'
        manifest.write_text(json.dumps(json.loads('\n'.join(lines))), encoding='utf-8')
        path = fetch_dotslash_executable(TARGET_SPECS['x86_64-pc-windows-msvc'], manifest_path=manifest, artifact_label='zstd', cache_key='zstd-windows-x64', dest_name='zstd.exe')
        print(path)
        '@
        $zstd = & python3.exe -c $code
        if ($LASTEXITCODE -ne 0 -or -not $zstd) { throw 'Could not prepare checksum-pinned zstd.' }
        $zstd = $zstd.Trim()
        if (-not ([IO.Path]::GetFullPath($zstd)).StartsWith('R:\', [StringComparison]::OrdinalIgnoreCase)) { throw 'zstd must be cached on the bounded build volume.' }
        & $zstd --version
        if ($LASTEXITCODE -ne 0) { throw 'zstd failed to execute.' }
        Split-Path -Parent $zstd | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Compute and verify the native Windows Bazel path
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        & ./.github/scripts/compute-bazel-windows-path.ps1
        # The upstream filter recognizes hosted Visual Studio paths but misses C:\BuildTools.
        $derived = Get-Content $env:GITHUB_ENV | Where-Object { $_.StartsWith('CODEX_BAZEL_WINDOWS_PATH=') } | Select-Object -Last 1
        if (-not $derived) { throw 'Stable Windows Bazel PATH was not generated.' }
        $entries = @(
          (Join-Path $env:VCToolsInstallDir 'bin/HostX64/x64'),
          (Join-Path $env:WindowsSdkBinPath "$($env:WindowsSDKVersion.TrimEnd('\'))/x64"),
          $env:CODEX_PYTHON_BIN
        ) + ($derived.Substring('CODEX_BAZEL_WINDOWS_PATH='.Length) -split ';')
        $stablePath = ($entries | Where-Object { $_ } | Select-Object -Unique) -join ';'
        $env:PATH = $stablePath
        foreach ($command in @('cl.exe','link.exe','rc.exe','python3.exe','git.exe','node.exe','pwsh.exe')) {
          Write-Host "$command -> $((Get-Command $command -ErrorAction Stop).Source)"
        }
        & python3.exe -c 'import ssl, sys; print(sys.version)'
        if ($LASTEXITCODE -ne 0) { throw 'Python failed under the Bazel action PATH.' }
        "CODEX_BAZEL_WINDOWS_PATH=$stablePath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host 'Bazel target: //:windows_x86_64_msvc; host: //:local_windows_msvc'
    - name: Prepare exact-source CI execution helpers
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $root=[IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'native-codex-evidence')).Replace('H:\codex-ci\','R:\')
        if(-not $root.StartsWith('R:\_work\_temp\',[StringComparison]::OrdinalIgnoreCase)){throw 'CI evidence must remain on the bounded build volume.'}
        $tree=(& git.exe -C $env:CODEX_BAZEL_WORKSPACE rev-parse 'HEAD^{tree}').Trim()
        if($LASTEXITCODE -or $tree -cnotmatch '^[0-9a-f]{40}$'){throw 'Could not identify the exact source tree.'}
        "NATIVE_SOURCE_TREE=$tree"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "SCRATCH_SOURCE_TREE=$tree"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        $path=Join-Path $root 'native_guest_coverage.py'
        $text = '"""Validate the exact-source VM result and account for the host/guest test split."""
        import argparse
        from collections import Counter
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import subprocess
        from urllib.parse import unquote, urlparse

        SOURCE_REPOSITORY = "holyglory/codex"
        CONTROLLER_REPOSITORY = "holyglory/codex-win-msvc-ci"
        VM_ID = "23b78cc8-71f0-45c1-ad87-f763fd2c1165"
        GUEST_TARGETS = frozenset([''//codex-rs/core:core-all-test'', ''//codex-rs/exec-server:exec-server-exec_process-test'', ''//codex-rs/exec-server:exec-server-file_system_windows-test'', ''//codex-rs/windows-sandbox-rs:windows-sandbox-rs-helper_manifest-test'', ''//codex-rs/windows-sandbox-rs:windows-sandbox-rs-unit-tests''])
        MIXED_FILTERS = {
            "//codex-rs/core:core-all-test": "suite::windows_sandbox::",
            "//codex-rs/exec-server:exec-server-exec_process-test":
                "windows_sandbox::tmpdir_uses_command_environment_over_rpc::elevated",
        }
        BASE_FILTERS = [
            "suite::code_mode::code_mode_can_call_hidden_dynamic_tools",
            "tests::windows_tests::conpty_ctrl_c_interrupts_powershell_foreground_child",
        ]
        LINUX_ONLY_TESTS = {
            "//bazel/rules/testing/wine:wine-test-support-unit-tests",
            "//codex-rs/app-server:app-server-all-wine-exec-test",
            "//codex-rs/core/tests/remote_env_windows:smoke-test",
            "//codex-rs/core:core-all-wine-exec-test",
            "//codex-rs/core:core-mcp_trace_propagation-wine-exec-test",
            "//codex-rs/core:core-responses_headers-wine-exec-test",
            "//codex-rs/exec-server:exec-server-current-version-test",
            "//codex-rs/exec-server:exec-server-minimum-release-test",
            "//codex-rs/exec-server:exec-server-stable-release-test",
        }


        def require(condition, message):
            if not condition:
                raise ValueError(message)


        def digest(value, length=64):
            return isinstance(value, str) and re.fullmatch("[0-9a-f]{" + str(length) + "}", value)


        def inventory_counts(values):
            require(isinstance(values, list) and 0 < len(values) < 100000, "Invalid test inventory")
            require(all(isinstance(n, str) and re.fullmatch(r"\S{1,500}", n) for n in values), "Invalid test name")
            return Counter(values)


        def names(values):
            # Privileged result names remain unique under the current five-target schema.
            counts = inventory_counts(values)
            require(len(values) == len(counts), "Duplicate test name")
            return set(counts)


        def check_host_case_coverage(executed, expected):
            require(inventory_counts(executed) == inventory_counts(expected),
                    "Host and VM case coverage has a gap, overlap, or wrong multiplicity")


        def validate_report(report, source_tree):
            require(digest(source_tree, 40), "Invalid source tree")
            require(report.get("schema") == 1 and report.get("status") == "passed", "VM result has not passed")
            require(report.get("sourceRepository") == SOURCE_REPOSITORY, "Wrong source repository")
            require(report.get("sourceTree") == source_tree, "VM result is for different source bytes")
            require(report.get("controllerRepository") == CONTROLLER_REPOSITORY, "Wrong controller repository")
            require(report.get("vmId") == VM_ID, "Wrong isolated VM")
            require(type(report.get("networkAdapters")) is int and report["networkAdapters"] == 0,
                    "Guest network isolation is not verified")
            context = report.get("context", {})
            expected_context = dict(machine="CODEX-VM-01", identity=r"CODEX-VM-01\CodexVmAdmin",
                                    administrator=True, windowStation="WinSta0", desktop="Default")
            require(isinstance(context, dict) and set(context) == set(expected_context) | {"sessionId"}
                    and all(type(context[k]) is type(v) and context[k] == v for k, v in expected_context.items())
                    and type(context.get("sessionId")) is int and context["sessionId"] > 0,
                    "Wrong privileged execution context")
            for field in ("archiveSha256", "manifestSha256", "bodySha256", "verificationSha256"):
                require(digest(report.get(field)), "Missing verified evidence digest: " + field)
            for field in ("bundleControllerSha", "validationCommit"):
                require(digest(report.get(field), 40), "Missing immutable source identity: " + field)
            require(isinstance(report.get("bundleRunId"), int) and report["bundleRunId"] > 0, "Invalid bundle run")
            require(digest(report.get("planId"), 32), "Missing guest plan identity")
            results = report.get("results", [])
            require(len(results) == len(GUEST_TARGETS) and {x.get("label") for x in results} == set(GUEST_TARGETS),
                    "The VM must cover all five target selections exactly once")
            for result in results:
                label = result["label"]
                passed, ignored = result.get("passed"), result.get("ignored")
                require(all(type(v) is int and v >= 0 for v in (passed, ignored, result.get("failed"))),
                        "Invalid guest result counts")
                require(result.get("successful") is True and result["failed"] == 0, "A guest target failed")
                selected = inventory_counts(result.get("selectedNames"))
                require(type(result.get("selected")) is int and sum(selected.values()) == result["selected"] == passed + ignored, "Incomplete guest coverage")
                require(result.get("selection") == MIXED_FILTERS.get(label), "Unexpected guest filter")
                require(digest(result.get("logSha256")), "Missing guest log digest")
                if label in MIXED_FILTERS:
                    require(all(MIXED_FILTERS[label] in n for n in selected), "Guest filter does not match inventory")
                if label.endswith(":exec-server-exec_process-test"):
                    require(selected == Counter({MIXED_FILTERS[label]: 1}), "Elevated exec case must be exact")
            return {x["label"]: x for x in results}


        def partition_inventory(label, inventory, report=None):
            require(label in MIXED_FILTERS, "Only mixed targets can be partitioned")
            guest_results = validate_report(report, report["sourceTree"]) if report is not None else None
            complete = inventory_counts(inventory)
            moved = Counter({n:count for n,count in complete.items() if MIXED_FILTERS[label] in n})
            if guest_results is not None:
                require(moved == Counter(guest_results[label]["selectedNames"]),
                        "VM and host inventories do not cover the same privileged cases")
            upstream = Counter({n:count for n,count in complete.items() if any(f in n for f in BASE_FILTERS)})
            require(not moved & upstream, "Privileged coverage overlaps an upstream exclusion")
            host = complete - moved - upstream
            require(host and not host & moved and host + moved + upstream == complete, "Invalid coverage partition")
            return dict(label=label, fullNames=sorted(complete.elements()), hostNames=sorted(host.elements()),
                        guestNames=sorted(moved.elements()), upstreamExcludedNames=sorted(upstream.elements()))


        def bounded_build_path(value):
            path = Path(value).resolve(strict=True)
            require(path.drive.upper() == "R:", "Evidence must remain on the H-backed build volume")
            return path


        def inventory_command(label, executable):
            expected = {"//codex-rs/core:core-all-test": ".bat",
                        "//codex-rs/exec-server:exec-server-exec_process-test": ".exe"}
            require(label in expected and executable.suffix.lower() == expected[label],
                    "Unexpected native mixed-target executable type")
            command = [str(executable), "--list", "--format", "terse"]
            return [r"C:\Windows\System32\cmd.exe", "/d", "/c", *command] if executable.suffix.lower() == ".bat" else command


        def inventory_environment(row, manifest):
            env = dict(os.environ)
            for key in ("TEST_TOTAL_SHARDS", "TEST_SHARD_INDEX", "RUNFILES_DIR", "TEST_SRCDIR", "RULES_RUST_TEST_TOTAL_SHARDS",
                        "RULES_RUST_TEST_SHARD_INDEX", "TESTBRIDGE_TEST_ONLY", "CODEX_BAZEL_TEST_SKIP_FILTERS"):
                env.pop(key, None)
            env.update(row.get("environment", {}))
            # Direct execution bypasses Bazel''s test setup, which normally supplies the
            # workspace prefix used by the Windows wrapper''s manifest lookup.
            env.update(TEST_WORKSPACE="_main", RUNFILES_MANIFEST_FILE=str(manifest), RUNFILES_MANIFEST_ONLY="1")
            return env


        def collect_inventories(metadata, execroot_file, report, output, source_tree=None):
            source_tree = source_tree or (report["sourceTree"] if report is not None else None)
            require(digest(source_tree, 40), "An exact source tree is required for host partition planning")
            if report is not None:
                validate_report(report, source_tree)
            rows = [json.loads(l) for l in Path(metadata).read_text().splitlines() if l.startswith("{")]
            for row in rows:
                row["label"] = row["label"].removeprefix("@@")
            require(len(rows) == 2 and {r["label"] for r in rows} == set(MIXED_FILTERS), "Expected the two mixed targets")
            roots = [l.strip() for l in Path(execroot_file).read_text().splitlines()
                     if re.fullmatch(r"[Rr]:[/\\]b[/\\][^\r\n]+[/\\]execroot[/\\]_main", l.strip())]
            require(len(roots) == 1, "Expected one dedicated Bazel execroot")
            root = bounded_build_path(roots[0])
            partitions = []
            for row in rows:
                executable = bounded_build_path(root / row["executable"])
                manifest = bounded_build_path(root / row["manifest"])
                require(executable.is_relative_to(root) and manifest.is_relative_to(root), "Runfiles escaped the execroot")
                if executable.suffix.lower() == ".bat":
                    resolved_names = re.findall(r''call :resolve_runfile "([^"]+)"'', executable.read_text())
                    require(len(resolved_names) >= 2, "Unexpected Windows workspace launcher")
                    mappings = dict(line.split(" ", 1) for line in manifest.read_text().splitlines() if " " in line)
                    binary_key = resolved_names[1]
                    mapped = mappings.get(binary_key, mappings.get("_main/" + binary_key))
                    require(mapped, "Test binary missing from runfiles manifest")
                    binary = bounded_build_path(mapped)
                    require(binary.is_relative_to(root) and binary.is_file() and binary.stat().st_size > 0,
                            "Test binary must be materialized before direct enumeration")
                env = inventory_environment(row, manifest)
                result = subprocess.run(inventory_command(row["label"], executable), cwd=root, env=env,
                                        capture_output=True, timeout=120)
                require(result.returncode == 0, "Native test inventory failed")
                text = result.stdout.decode("utf-8", errors="strict")
                inventory = re.findall(r"^(.+): test\r?$", text, re.M)
                partitions.append(partition_inventory(row["label"], inventory, report))
            Path(output).write_text(json.dumps(dict(sourceTree=source_tree, partitions=partitions, guestExecutionVerified=report is not None), indent=2) + "\n")


        def events(path):
            return [json.loads(l) for l in Path(path).read_text().splitlines() if l]


        def native_test_selection(data):
            configured = {e["id"]["targetConfigured"]["label"] for e in data
                          if e.get("configured", {}).get("testSize")}
            # defs.bzl assigns WINDOWS_GNULLVM_ONLY to the cross wrappers. The Wine
            # rules and exec-server compatibility rules explicitly require Linux.
            incompatible = {n for n in configured if n.endswith("-windows-cross")} | (configured & LINUX_ONLY_TESTS)
            skipped = {e["id"].get("targetCompleted", {}).get("label") for e in data
                       if e.get("aborted", {}).get("reason") == "SKIPPED"} & configured
            require(skipped == incompatible, "Unexpected native target skip or platform-selection change")
            return configured, configured - incompatible, incompatible


        def check_events(data, expected_labels):
            summaries = {e["id"]["testSummary"]["label"]: e["testSummary"] for e in data if "testSummary" in e}
            results = [{"id": e["id"]["testResult"], **e["testResult"]} for e in data if "testResult" in e]
            require(set(summaries) == expected_labels, "Missing or unexpected host test targets")
            require(all(s.get("overallStatus") == "PASSED" for s in summaries.values()), "A host target failed")
            require(all(r["status"] == "PASSED" and r["id"]["run"] == r["id"]["attempt"] == 1
                        and not r.get("cachedLocally") and not r.get("cachedRemotely") for r in results),
                    "Host coverage requires passing, uncached, first-attempt results")
            identities = [json.dumps(r["id"], sort_keys=True) for r in results]
            require(len(identities) == len(set(identities)), "Duplicate host shard result")
            for label, summary in summaries.items():
                require(sum(r["id"]["label"] == label for r in results) == summary["totalRunCount"] > 0,
                        "Host shard coverage is incomplete")
            finished = [e["finished"] for e in data if "finished" in e]
            require(len(finished) == 1 and finished[0].get("overallSuccess") is True
                    and finished[0]["exitCode"]["name"] == "SUCCESS", "Host test command did not succeed")
            return results


        def finish(report, inventory, build_path, general_path, core_path, exec_path, output):
            guest = validate_report(report, inventory["sourceTree"])
            build = events(build_path)
            configured, targets, incompatible = native_test_selection(build)
            require(bool(configured) and bool(targets) and set(guest) <= targets,
                    "Full native build selection is empty or omits a required guest target")
            finish_events = [e["finished"] for e in build if "finished" in e]
            require(len(finish_events) == 1 and finish_events[0].get("overallSuccess") is True
                    and finish_events[0]["exitCode"]["name"] == "SUCCESS", "Full native build did not pass")
            all_results = check_events(events(general_path), targets - set(guest))
            partitions = {p["label"]: p for p in inventory["partitions"]}
            require(len(inventory["partitions"]) == 2 and set(partitions) == set(MIXED_FILTERS), "Missing mixed inventory")
            for label, path in zip(MIXED_FILTERS, (core_path, exec_path), strict=True):
                expected = partition_inventory(label, partitions[label]["fullNames"], report)
                require(partitions[label] == expected, "Changed coverage partition")
                results = check_events(events(path), {label})
                executed = []
                for result in results:
                    logs = [x["uri"] for x in result.get("testActionOutput", []) if x["name"] == "test.log"]
                    require(len(logs) == 1, "Missing mixed-target test log")
                    uri = urlparse(logs[0])
                    require(uri.scheme == "file" and not uri.netloc, "Unexpected test-log location")
                    log_path = bounded_build_path(unquote(uri.path).removeprefix("/"))
                    text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", log_path.read_text(encoding="utf-8", errors="replace"))
                    executed.extend(re.findall(r"^test (\S+) \.\.\.", text, re.M))
                check_host_case_coverage(executed, expected["hostNames"])
                all_results.extend(results)
            host_labels = {r["id"]["label"] for r in all_results}
            guest_only = set(guest) - set(MIXED_FILTERS)
            require(not host_labels & guest_only and host_labels | guest_only == targets, "Incomplete combined target coverage")
            record = dict(schema=1, status="passed", sourceTree=report["sourceTree"], configuredTargets=len(configured),
                          compatibleNativeTargets=len(targets), incompatibleTargets=sorted(incompatible),
                          hostTargets=len(host_labels), guestOnlyTargets=sorted(guest_only),
                          guestSelected=sum(x["selected"] for x in guest.values()),
                          guestPassed=sum(x["passed"] for x in guest.values()),
                          guestIgnored=sum(x["ignored"] for x in guest.values()),
                          hostResultStatuses=dict(Counter(r["status"] for r in all_results)),
                          mixedTargetCoverage=inventory["partitions"], guestPlanId=report["planId"],
                          guestBundleRunId=report["bundleRunId"], assertionsChanged=False)
            Path(output).write_text(json.dumps(record, indent=2) + "\n")
            return record


        if __name__ == "__main__":
            parser = argparse.ArgumentParser()
            parser.add_argument("operation", choices=("verify-report", "inventory", "finish"))
            parser.add_argument("--report", type=Path)
            parser.add_argument("--source-tree")
            parser.add_argument("--metadata", type=Path)
            parser.add_argument("--execroot", type=Path)
            parser.add_argument("--inventory", type=Path)
            parser.add_argument("--build", type=Path)
            parser.add_argument("--general", type=Path)
            parser.add_argument("--core", type=Path)
            parser.add_argument("--exec", dest="exec_events", type=Path)
            parser.add_argument("--output", type=Path)
            args = parser.parse_args()
            report = json.loads(args.report.read_text(encoding="utf-8-sig")) if args.report else None
            if args.operation != "inventory" and report is None:
                parser.error("--report is required to verify completed guest execution")
            if args.operation == "verify-report":
                validate_report(report, args.source_tree)
                print(json.dumps(dict(status="passed", sourceTree=args.source_tree, guestSelected=sum(x["selected"] for x in report["results"]))))
            elif args.operation == "inventory":
                collect_inventories(args.metadata, args.execroot, report, args.output, args.source_tree)
            else:

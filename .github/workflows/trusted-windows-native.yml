                    }
                    if(-not $process.WaitForExit($TerminationDeadlineMilliseconds)){$state.cleanupIncomplete=$true}
                }
                $state.rootExitObserved=$process.HasExited
                if($state.rootExitObserved){$state.exitCode=$process.ExitCode}
                if(-not [Threading.Tasks.Task]::WaitAll($copies,$DrainDeadlineMilliseconds)){
                    $state.drainDeadlineExceeded=$true;$state.cleanupIncomplete=$true
                    $state.phase=''output-drain-deadline'';Publish-Observation

            getattr(library,name).restype=ctypes.c_ulong
        library.probe_original.argtypes=[ctypes.c_int]
        library.probe_original.restype=ctypes.c_wchar_p
        library.probe_grant.argtypes=[ctypes.c_wchar_p,ctypes.c_ulong]
        library.probe_grant.restype=ctypes.c_ulong
        record[''snapshotError'']=library.probe_snapshot(); save()
        assert record[''snapshotError'']==0, ''Unexpected service station/desktop identity or owner.''
        record[''originalDescriptors'']=[library.probe_original(i) for i in range(2)]; save()
        code=1
        try:
            record[''grantError'']=library.probe_grant(''S-1-15-2-1'',0x20022); save()
            assert record[''grantError'']==0, ''Non-admin owner could not apply minimal station rights.''
            bash=Path(r''C:\Program Files\Git\bin\bash.exe'').resolve(strict=True)
            command=[str(bash),''--noprofile'',''--norc'',script.as_posix()]
            scratch_folder = Path(''D:/cxt'') / (os.environ[''GITHUB_RUN_ID''] + ''_'' + os.environ[''GITHUB_RUN_ATTEMPT'']) / args.label / ''t''
            record[''scratchObservation''] = {}
            with observe_scratch(scratch_folder, record[''scratchObservation'']):
                result=run_with_bazel_batch_environment([str(launcher),''desktop'',str(bash),subprocess.list2cmdline(command)])
            code=record[''childExitCode'']=result.returncode
        finally:
            record[''restoreError'']=library.probe_restore()
            record[''restoredVerificationError'']=library.probe_unchanged()

        from datetime import datetime, timezone
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import subprocess
        import sys
        import time

        def resolve_launcher(value):
            """Resolve Bazel''s relative test executable in manifest-only Windows runfiles."""
            path = Path(value)
            if path.is_absolute():
                return path.resolve(strict=True), ''absolute''
            assert not path.drive and ''..'' not in path.parts, ''Unexpected launcher path''
            relative = path.as_posix()
            workspace = os.environ.get(''TEST_WORKSPACE'')
            manifest_name = os.environ.get(''RUNFILES_MANIFEST_FILE'')
            runfiles = os.environ.get(''TEST_SRCDIR'') or os.environ.get(''RUNFILES_DIR'')
            if not manifest_name and runfiles and (Path(runfiles)/''MANIFEST'').is_file():
                manifest_name = str(Path(runfiles)/''MANIFEST'')
            if manifest_name and workspace:
                key = workspace + ''/'' + relative
                with Path(manifest_name).open(encoding=''utf-8'') as manifest:
                    for line in manifest:
                        line = line.rstrip(''\n\r'')
                        escaped = line.startswith('' '')
                        logical, separator, physical = line[int(escaped):].partition('' '')
                        if escaped:
                            unescape = lambda text: re.sub(r''\\([snb])'', lambda m: {''s'':'' '', ''n'':''\n'', ''b'':''\\''}[m[1]], text)
                            logical, physical = unescape(logical), unescape(physical)
                        if logical == key:
                            assert separator and physical, ''Empty launcher mapping''
                            return Path(physical).resolve(strict=True), ''manifest''
                raise FileNotFoundError(''Launcher absent from the supplied runfiles manifest: '' + key)
            if runfiles and workspace:
                return (Path(runfiles)/workspace/path).resolve(strict=True), ''runfiles-directory''
            return path.resolve(strict=True), ''working-directory''

        def main():
            root=Path(os.environ[''CODEX_CI_NATIVE_CAPTURE_ROOT'']).resolve(strict=True)
            attempt=os.environ[''GITHUB_RUN_ATTEMPT'']
            assert attempt.isascii() and attempt.isdecimal() and int(attempt)>0 and attempt==str(int(attempt))
            target=os.environ[''TEST_TARGET'']
            assert re.fullmatch(r''(?:(?:@@?)[A-Za-z0-9_+.-]*)?//[^\r\n]+'',target), ''Invalid test identity''
            shard=int(os.environ.get(''TEST_SHARD_INDEX'',''0''))
            total=int(os.environ.get(''TEST_TOTAL_SHARDS'',''0''))
            run=int(os.environ.get(''TEST_RUN_NUMBER'',''1''))
            assert shard>=0 and total>=0 and run==1
            assert total==0 or shard<total
            key=hashlib.sha256(target.encode()).hexdigest()[:24]+f''-s{shard}-r{run}''
            output=root/key
            output.mkdir() # Refuse duplicate executions within the same phase.
            command=sys.argv[1:]
            assert command and ''\x00'' not in ''''.join(command)
            executable,resolution=resolve_launcher(command[0])
            command[0]=str(executable)
            if executable.suffix.lower() in (''.bat'',''.cmd''):
                # These are Bazel-created launchers and libtest arguments, not shell code.
                assert all(not re.search(r''[\r\n"&|<>^%!]'',value) for value in command), ''Unsafe batch argument''
                quoted='' ''.join(''"''+value+''"'' for value in command)
                child_command=''"''+os.environ.get(''ComSpec'',r''C:\Windows\System32\cmd.exe'')+''" /d /s /c "''+quoted+''"''
            else:
                child_command=command
            started=datetime.now(timezone.utc).isoformat()
            began=time.monotonic()
            with (output/''stdout.log'').open(''xb'') as stream:
                child=subprocess.run(child_command,stdin=None,stdout=stream,stderr=subprocess.STDOUT,check=False)
            digest=hashlib.sha256()
            with (output/''stdout.log'').open(''rb'') as stream:
                while chunk:=stream.read(1024*1024):
                    digest.update(chunk)
            manifest=dict(target=target,shardIndex=shard,totalShards=total,run=run,exitCode=child.returncode,
                startedUtc=started,finishedUtc=datetime.now(timezone.utc).isoformat(),elapsedSeconds=time.monotonic()-began,
                bytes=(output/''stdout.log'').stat().st_size,sha256=digest.hexdigest(),
                helperSha256=hashlib.sha256(Path(__file__).read_bytes()).hexdigest(),
                runId=os.environ[''GITHUB_RUN_ID''],runAttempt=attempt,controllerSha=os.environ.get(''GITHUB_SHA''),
                captureCompleted=True,testArgumentsChanged=False,deadlinesChanged=False,
                launcherResolution=resolution)
            (output/''completion.json'').write_text(json.dumps(manifest,indent=2)+''\n'')
            # The copy is for the usual console view; the completed sidecar is authoritative.
            # Ignore a broken console consumer only after the full log and exit code are saved.
            try:
                with (output/''stdout.log'').open(''rb'') as stream:
                    while chunk:=stream.read(1024*1024):
                        sys.stdout.buffer.write(chunk)
                sys.stdout.buffer.flush()
            except BrokenPipeError:
                with open(os.devnull,''wb'') as sink:
                    os.dup2(sink.fileno(),sys.stdout.fileno())
            return child.returncode

        if __name__==''__main__'':
            sys.exit(main())

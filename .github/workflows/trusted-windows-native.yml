            if(-not [IO.Directory]::Exists($directory) -or ((Get-Item -LiteralPath $directory).Attributes -band [IO.FileAttributes]::ReparsePoint)){throw ''Expected an existing regular result directory.''}
            $StartInfo.UseShellExecute=$false
            $StartInfo.RedirectStandardOutput=$true
            $StartInfo.RedirectStandardError=$true
            $stdoutPath=Join-Path $directory ($Prefix+''.stdout.log'')
            $stderrPath=Join-Path $directory ($Prefix+''.stderr.log'')
            $stdoutFile=$null;$stderrFile=$null;$process=$null;$copies=$null
            $copyCancellation=[Threading.CancellationTokenSource]::new()
            $watch=[Diagnostics.Stopwatch]::StartNew()
            $errors=[Collections.Generic.List[string]]::new()
            $state=[ordered]@{phase=''starting'';pid=$null;startedUtc=$null;exitCode=$null;deadlineExceeded=$false;drainDeadlineExceeded=$false;terminationRequested=$false;terminationError=$null;rootExitObserved=$false;captureCompleted=$false;cleanupIncomplete=$false;stdout=$stdoutPath;stderr=$stderrPath}
            function Publish-Observation {
                if($OnObservation){
                    try{& $OnObservation ([pscustomobject]$state)|Out-Null}catch{$errors.Add($_.Exception.Message)}
                }
            }
            try {
                $stdoutFile=[IO.FileStream]::new($stdoutPath,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::Read,1,[IO.FileOptions]::Asynchronous)
                $stderrFile=[IO.FileStream]::new($stderrPath,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::Read,1,[IO.FileOptions]::Asynchronous)

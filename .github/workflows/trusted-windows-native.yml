        #include <sddl.h>
        #include <wchar.h>

        static HANDLE objects[2];
        static PSECURITY_DESCRIPTOR original[2];
        static LPWSTR original_text[2];
        static BOOL changed[2];
        static const SECURITY_INFORMATION query_info = OWNER_SECURITY_INFORMATION | DACL_SECURITY_INFORMATION | LABEL_SECURITY_INFORMATION;

        __declspec(dllexport) DWORD probe_snapshot(void) {
            if (original[0] || original[1]) return ERROR_ALREADY_INITIALIZED;
            objects[0] = GetProcessWindowStation();
            objects[1] = GetThreadDesktop(GetCurrentThreadId());
            wchar_t name[256] = {0}; DWORD needed = 0;
            USEROBJECTFLAGS flags = {0};
            if (!GetUserObjectInformationW(objects[0], UOI_NAME, name, sizeof(name), &needed)) return GetLastError();
            if (wcsncmp(name, L"Service-0x", 10) != 0) return ERROR_ACCESS_DENIED;
            if (!GetUserObjectInformationW(objects[0], UOI_FLAGS, &flags, sizeof(flags), &needed)) return GetLastError();
            if (flags.dwFlags & WSF_VISIBLE) return ERROR_ACCESS_DENIED;
            if (!GetUserObjectInformationW(objects[1], UOI_NAME, name, sizeof(name), &needed)) return GetLastError();
            if (wcscmp(name, L"Default") != 0) return ERROR_ACCESS_DENIED;
            HANDLE token = NULL;
            if (!OpenProcessToken(GetCurrentProcess(), TOKEN_QUERY, &token)) return GetLastError();
            GetTokenInformation(token, TokenUser, NULL, 0, &needed);
            if (GetLastError() != ERROR_INSUFFICIENT_BUFFER || !needed) { CloseHandle(token); return ERROR_INVALID_DATA; }
            PTOKEN_USER user = LocalAlloc(LPTR, needed);
            if (!user) { CloseHandle(token); return ERROR_OUTOFMEMORY; }
            DWORD result = 0;
            if (!GetTokenInformation(token, TokenUser, user, needed, &needed)) result = GetLastError();
            for (int i = 0; i < 2 && result == 0; ++i) {
                result = GetSecurityInfo(objects[i], SE_WINDOW_OBJECT, query_info, NULL, NULL, NULL, NULL, &original[i]);
                if (result) break;
                PSID owner = NULL; BOOL defaulted = FALSE;
                if (!GetSecurityDescriptorOwner(original[i], &owner, &defaulted)) { result = GetLastError(); break; }
                if (!owner || !EqualSid(owner, user->User.Sid)) { result = ERROR_ACCESS_DENIED; break; }
                if (!ConvertSecurityDescriptorToStringSecurityDescriptorW(original[i], SDDL_REVISION_1, query_info, &original_text[i], NULL)) result = GetLastError();
            }
            LocalFree(user); CloseHandle(token);
            return result;
        }

        __declspec(dllexport) const wchar_t *probe_original(int index) {
            return index >= 0 && index < 2 ? original_text[index] : NULL;
        }

        __declspec(dllexport) DWORD probe_restore(void) {
            DWORD first = 0;
            for (int i = 1; i >= 0; --i) {
                if (!changed[i]) continue;
                PACL dacl = NULL; BOOL present = FALSE, defaulted = FALSE;
                if (!GetSecurityDescriptorDacl(original[i], &present, &dacl, &defaulted)) {
                    if (!first) first = GetLastError();
                    continue;
                }
                DWORD error = SetSecurityInfo(objects[i], SE_WINDOW_OBJECT, DACL_SECURITY_INFORMATION, NULL, NULL, dacl, NULL);
                if (error) { if (!first) first = error; } else changed[i] = FALSE;
            }
            return first;
        }

        __declspec(dllexport) DWORD probe_unchanged(void) {
            for (int i = 0; i < 2; ++i) {
                if (!original_text[i]) return ERROR_INVALID_STATE;
                PSECURITY_DESCRIPTOR sd = NULL; LPWSTR text = NULL;
                DWORD error = GetSecurityInfo(objects[i], SE_WINDOW_OBJECT, query_info, NULL, NULL, NULL, NULL, &sd);
                if (error) return error;
                if (!ConvertSecurityDescriptorToStringSecurityDescriptorW(sd, SDDL_REVISION_1, query_info, &text, NULL)) { error = GetLastError(); LocalFree(sd); return error; }
                BOOL equal = wcscmp(text, original_text[i]) == 0;
                LocalFree(text); LocalFree(sd);
                if (!equal) return ERROR_INVALID_SECURITY_DESCR;
            }
            return 0;
        }

        __declspec(dllexport) DWORD probe_grant(const wchar_t *sid_text, DWORD mask) {
            DWORD error = probe_unchanged();
            if (error) return error;
            if (wcscmp(sid_text, L"S-1-15-2-1") != 0 || (mask & ~0x0002037f)) return ERROR_INVALID_PARAMETER;
            PSID sid = NULL;
            BOOL present = FALSE, defaulted = FALSE;
            if (!ConvertStringSidToSidW(sid_text, &sid)) return GetLastError();
            for (int i = 0; i < 1; ++i) {
                PACL old_acl = NULL, new_acl = NULL;
                if (!GetSecurityDescriptorDacl(original[i], &present, &old_acl, &defaulted)) { error = GetLastError(); break; }
                EXPLICIT_ACCESS_W entry = {0};
                /* Runtime UI rights only: never grant WRITE_DAC, WRITE_OWNER or DELETE. */
                entry.grfAccessPermissions = mask;
                entry.grfAccessMode = GRANT_ACCESS;
                entry.grfInheritance = NO_INHERITANCE;
                entry.Trustee.TrusteeForm = TRUSTEE_IS_SID;
                entry.Trustee.TrusteeType = TRUSTEE_IS_UNKNOWN;

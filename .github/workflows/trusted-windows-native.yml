        from contextlib import contextmanager
        from pathlib import Path
        import threading
        import time


        @contextmanager
        def observe_scratch(folder, record):
            folder = Path(folder).resolve(strict=True)
            assert folder.drive.upper() == ''D:'' and folder.name == ''t''
            stop = threading.Event()
            seen = set()
            record.update(root=str(folder), samples=0, maximumEntries=0, observedEntries=0, errors=0)

            def sample():
                while not stop.is_set():
                    try:
                        names = {p.name for p in folder.iterdir()}
                        seen.update(names)
                        record[''samples''] += 1
                        record[''maximumEntries''] = max(record[''maximumEntries''], len(names))
                        record[''observedEntries''] = len(seen)
                        if names and ''firstObservationUnixSeconds'' not in record:
                            record[''firstObservationUnixSeconds''] = time.time()
                    except OSError:
                        record[''errors''] += 1
                    stop.wait(0.25)

            thread = threading.Thread(target=sample, daemon=True)
            thread.start()
            try:
                yield
            finally:
                stop.set()
                thread.join(timeout=5)
                record[''observerStopped''] = not thread.is_alive()


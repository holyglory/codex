        \ | Out-Null\n[ordered]@{\n  runId = $env:GITHUB_RUN_ID\n  runAttempt = $env:GITHUB_RUN_ATTEMPT\n  controllerSha\
        \ = $env:GITHUB_SHA\n  sourceSha = $env:SOURCE_SHA\n  machine = $env:COMPUTERNAME\n  runner = $env:RUNNER_NAME\n\
        \  target = 'x86_64-pc-windows-msvc'\n  host = 'local_windows_msvc'\n  workspaceRoot = 'H:/codex-ci'\n \
        \ bazelBuildRoot = 'R:/'\n  backingImage = 'H:/CodexRunnerVolume/build-20tb.vhdx'\n  storageMeasurementUtc\
        \ = [DateTime]::UtcNow.ToString('o')\n  buildVolume = [ordered]@{ drive = $buildVolume.Name; totalBytes\
        \ = $buildVolume.TotalSize; availableBytes = $buildVolume.AvailableFreeSpace }\n  testScratchVolume = [ordered]@{\
        \ drive = $scratchVolume.Name; totalBytes = $scratchVolume.TotalSize; availableBytes = $scratchVolume.AvailableFreeSpace\
        \ }\n} | ConvertTo-Json | Set-Content \"$env:RUNNER_TEMP\\native-codex-evidence\\identity.json\"\n"
    - name: Upload native evidence
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: native-codex-${{ inputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/native-codex-evidence
        if-no-files-found: error
    - name: Upload Windows package handoff
      if: success()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: windows-handoff-${{ inputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: '${{ runner.temp }}/native-codex-evidence/windows-handoff

          ${{ runner.temp }}/native-codex-evidence/windows-manifest.json

          '
        if-no-files-found: error
        retention-days: 14
'on':
  workflow_call:
    inputs:
      source_sha:
        description: Exact holyglory/codex commit to validate
        required: true
        type: string
      boot_after_utc:
        description: Optional UTC timestamp; require a reboot after it
        required: false
        type: string

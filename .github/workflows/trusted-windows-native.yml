                $measured=[int]$last.Groups[5].Value;$filtered=[int]$last.Groups[6].Value
                $complete=$inventoryMatched -and $measured -eq 0 -and ($passed+$failed+$ignored) -eq $Inventory.Count
                if($FullTarget -and $filtered -ne 0){$complete=$false}
                if(($summaryState -ceq ''ok'') -ne ($failed -eq 0)){$complete=$false}
            }
            return [pscustomobject]@{selected=$Inventory.Count;selectedNames=$Inventory;startedNames=$started;inventoryMatched=$inventoryMatched;
                passed=$passed;failed=$failed;ignored=$ignored;filtered=$filtered;summary=$summary;
                coverageMatched=$complete;testsPassed=($complete -and $failed -eq 0 -and $summaryState -ceq ''ok'')}
        }

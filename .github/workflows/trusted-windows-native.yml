        $text = '"""Durable, bounded requests through the guest-only bridge, never host elevation."""
        from datetime import datetime, timezone
        import hashlib
        import json
        from pathlib import Path
        import time
        import uuid


        class GuestRpc:
            def __init__(self, client, evidence_root, *, clock=time.monotonic, sleep=time.sleep):
                self.client = client
                self.root = Path(evidence_root)
                self.root.mkdir(exist_ok=True)
                self.clock, self.sleep = clock, sleep
                self.journal = self.root/''guest-request.json''

            def save(self, record):
                temporary = self.journal.with_suffix(''.tmp'')
                temporary.write_text(json.dumps(record, indent=2)+''\n'', encoding=''utf-8'')
                temporary.replace(self.journal)

            def recover(self):
                """Consume an existing request before allowing another mutation."""
                if not self.journal.exists():
                    return
                record = json.loads(self.journal.read_text())
                if record[''phase''] == ''acknowledged'':
                    return
                self.finish(record)

            def recover_channel(self):
                """Retain terminal results left by a cancelled workflow before new work.

                The helper is deliberately not restarted here: a pending request without
                a live supervisor needs inspection, not replay of a guest mutation.
                """
                for request_id in self.client.outstanding_requests():
                    deadline=self.clock()+660
                    response=self.client.read_result(request_id,acknowledge=False)
                    while response is None and self.clock()<deadline:
                        self.sleep(1)
                        response=self.client.read_result(request_id,acknowledge=False)
                    if response is None:
                        raise TimeoutError(''Earlier CI request ''+request_id+'' is unresolved; no helper restart or new request was issued.'')
                    if response.get(''id'')!=request_id:
                        raise RuntimeError(''Earlier CI response identity differs.'')
                    path=self.root/(''recovered-prior-response-''+request_id+''.json'')
                    temporary=path.with_suffix(''.tmp'')
                    temporary.write_text(json.dumps(dict(priorWorkflowResult=True,response=response),indent=2)+''\n'',encoding=''utf-8'')
                    temporary.replace(path)
                    self.client.acknowledge_result(request_id)

            def call(self, operation, script=None, timeout=180):
                self.recover()
                record = dict(id=uuid.uuid4().hex, operation=operation, timeoutSeconds=timeout,
                    scriptSha256=hashlib.sha256((script or '''').encode()).hexdigest(),
                    createdUtc=datetime.now(timezone.utc).isoformat(), phase=''submission-pending'')
                self.save(record)  # Persist the ID before the request can reach the broker.
                try:
                    returned = self.client.submit(operation, script, timeout, request_id=record[''id''])
                    if returned != record[''id'']:
                        raise RuntimeError(''Bridge changed the prepared request identity.'')
                except Exception:
                    # Never replace an uncertain request with a new ID. Recovery reads
                    # its authoritative response; an absent response requires inspection.
                    record[''phase''] = ''submission-uncertain''
                    self.save(record)
                    raise
                record[''phase''] = ''submitted''
                self.save(record)
                return self.finish(record)

            def finish(self, record):
                request_id = record[''id'']
                history = self.root/(''guest-response-''+request_id+''.json'')
                if history.exists():
                    response = json.loads(history.read_text())
                else:
                    deadline = self.clock() + record[''timeoutSeconds''] + 660
                    response = self.client.read_result(request_id, acknowledge=False)
                    while response is None and self.clock() < deadline:
                        self.sleep(1)
                        response = self.client.read_result(request_id, acknowledge=False)
                    if response is None:
                        raise TimeoutError(''Guest request ''+request_id+'' remains unresolved; no replacement was submitted.'')
                    if response.get(''id'') != request_id:
                        raise RuntimeError(''Bridge response identity differs.'')
                    temporary = history.with_suffix(''.tmp'')
                    temporary.write_text(json.dumps(response, indent=2)+''\n'', encoding=''utf-8'')
                    temporary.replace(history)  # Durable evidence before acknowledgement.
                if response.get(''id'') != request_id:
                    raise RuntimeError(''Retained response identity differs.'')
                record[''phase''] = ''response-retained''
                self.save(record)
                self.client.acknowledge_result(request_id)
                record[''phase''] = ''acknowledged''
                record[''ok''] = response.get(''ok'') is True
                self.save(record)
                if response.get(''ok'') is not True:
                    raise RuntimeError(''Guest operation failed: ''+str(response.get(''error'')))
                return response.get(''data'')

            def guest(self, script, timeout=180):
                data = self.call(''guest-exec'', script, timeout)
                if not isinstance(data, list) or len(data) != 1:
                    raise RuntimeError(''Expected one structured guest response.'')
                return data[0]

        \            continue\n        key, separator, value = option.get('optionValue', '').partition('=')\n  \
        \      folded = key.casefold()\n        if separator and folded in inherited:\n            assert folded\
        \ not in client or client[folded] == value, 'Conflicting inherited Windows environment entries'\n      \
        \      client[folded] = value\n    result = {}\n    for kind, values in raw.items():\n        resolved =\
        \ {}\n        for value in values:\n            key, separator, explicit = value.partition('=')\n      \
        \      assert re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', key), 'Invalid action environment variable name'\n\
        \            if separator:\n                resolved[key] = explicit\n            else:\n              \
        \  assert key.casefold() in client, 'Inherited action environment value is absent from canonical client\

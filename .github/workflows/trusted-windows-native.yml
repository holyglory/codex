        $text = '"""Validate only the whitelisted temporary-path evidence from native Bazel tests."""
        from pathlib import PureWindowsPath


        def validate(run_id, controller_sha, source_tree, phase, prepared, finished, options, desktop, *, run_attempt):
            assert phase in (''general'', ''core'', ''exec'')
            attempt = run_attempt
            assert isinstance(attempt, str) and attempt.isascii() and attempt.isdecimal() and int(attempt)>0
            assert attempt==str(int(attempt)), ''Noncanonical workflow attempt''
            expected = PureWindowsPath(''D:/cxt'') / f''{run_id}_{attempt}'' / phase
            for document in (prepared, finished):
                assert document[''runId''] == str(run_id) and document[''runAttempt''] == attempt
                assert document[''controllerSha''] == controller_sha and document[''sourceTree''] == source_tree
                assert document[''phase''] == phase and document[''drive''] == ''D:''
                assert PureWindowsPath(document[''root'']) == expected
            assert prepared[''writeReadProbePassed''] and finished[''cleaned'']
            for field in (''client_env'', ''test_env''):
                for key in (''TMP'', ''TEMP'', ''TMPDIR''):
                    value, = [v.split(''='', 1)[1] for v in options[field] if v.startswith(key + ''='')]
                    assert PureWindowsPath(value) == expected / ''t'', ''Effective temporary path is not the expected D phase''
            assert [PureWindowsPath(v) for v in options[''test_tmpdir'']] == [expected / ''bazel-temp'']
            assert [PureWindowsPath(v) for v in options[''disk_cache'']] == [PureWindowsPath(''R:/bazel-disk-cache'')]
            assert options[''experimental_disk_cache_gc_max_size''] == [''200G'']
            assert options[''experimental_disk_cache_gc_max_age''] == [''14d'']
            observation = desktop[''scratchObservation'']
            assert PureWindowsPath(observation[''root'']) == expected / ''t''
            runtime_observed = observation[''observedEntries''] > 0 and observation[''errors''] == 0 and observation[''observerStopped'']
            return dict(runAttempt=attempt, root=str(expected), clientTemporaryPathsOnD=True, testTemporaryPathsOnD=True,
                        runtimeObserved=runtime_observed, cleaned=True, boundedCacheOnR=True,
                        observedEntries=observation[''observedEntries''], observationErrors=observation[''errors''])

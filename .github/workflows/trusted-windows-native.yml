                if (error) break;
                changed[i] = TRUE;
                error = SetSecurityInfo(objects[i], SE_WINDOW_OBJECT, DACL_SECURITY_INFORMATION, NULL, NULL, new_acl, NULL);
                LocalFree(new_acl);
                if (error) break;
            }
            LocalFree(sid);
            return error;
        }

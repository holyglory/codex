        """Run a fixed CI script on a private desktop, restoring the service station afterward."""
        import argparse
        import ctypes
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess

        def run_with_bazel_batch_environment(command):
            # Python''s Windows os.environ mapping uppercases every key. Rebuilding an
            # environment block from it loses mixed-case MSVC variables used by Bash.
            # Inherit the original native block, changing only the required batch flag.
            previous = os.environ.get(''CODEX_BAZEL_BATCH'')
            os.environ[''CODEX_BAZEL_BATCH''] = ''1''
            try:
                return subprocess.run(command)
            finally:
                if previous is None:
                    del os.environ[''CODEX_BAZEL_BATCH'']
                else:
                    os.environ[''CODEX_BAZEL_BATCH''] = previous

        parser = argparse.ArgumentParser()
        parser.add_argument(''label'', choices=[''general'',''core'',''exec''])
        parser.add_argument(''script'')
        args = parser.parse_args()
        assert os.name == ''nt'' and os.environ[''RUNNER_NAME''] == ''codex-win-msvc-01''
        root = (Path(os.environ[''RUNNER_TEMP'']) / ''native-codex-evidence'').resolve(strict=True)
        script = Path(args.script).resolve(strict=True)
        assert root.drive.upper() == ''R:'' and script.parent == root and script.name == args.label + ''.sh''
        folder = root / (''desktop-'' + args.label)
        folder.mkdir(exist_ok=False)
        record = dict(label=args.label, scriptSha256=hashlib.sha256(Path(__file__).read_bytes()).hexdigest(),
            runId=os.environ[''GITHUB_RUN_ID''], runAttempt=os.environ[''GITHUB_RUN_ATTEMPT''], controllerSha=os.environ[''GITHUB_SHA''], sourceSha=os.environ[''SOURCE_SHA''], sourcePatchSha256=os.environ.get(''SOURCE_PATCH_SHA256''),
            commandSha256=hashlib.sha256(script.read_bytes()).hexdigest(), stationMask=0x20022,
            qualification=''Non-admin runner-owned service window station only. New private desktop for this command. Default desktop ACL unchanged; station descriptor restored and verified. Bazel batch mode ensures the JVM and tests inherit this desktop. An owned nested job contains only the launched validation process tree.'')
        def save():
            (root / (''desktop-'' + args.label + ''.json'')).write_text(json.dumps(record,indent=2)+''\n'')
        def build(name, source, dll=False):
            path=folder/(name+''.c''); path.write_text(source)
            output=folder/(name+(''.dll'' if dll else ''.exe''))
            argv=[''cl.exe'',''/nologo'',''/W4'',''/WX'',''/MT'',str(path),''/Fe:''+str(output),''/Fo:''+str(folder/(name+''.obj'')),''advapi32.lib'',''user32.lib'']
            if dll: argv += [''/LD'',''/link'',''/IMPLIB:''+str(folder/(name+''.lib''))]
            p=subprocess.run(argv,cwd=folder,capture_output=True,timeout=60)

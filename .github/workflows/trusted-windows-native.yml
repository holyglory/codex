        import argparse
        from datetime import datetime, timezone
        import json
        from pathlib import Path
        import subprocess
        import time
        import uuid

        ROOT=Path(r''C:\Program Files\Codex Runner Setup Helper'')
        OPERATIONS=(''status'',''vm-start'',''guest-exec'')

        def configuration(*, require_active=True):
            data=json.loads((ROOT/''runner-config.json'').read_text(encoding=''utf-8-sig''))
            expiry=datetime.fromisoformat(data[''expiresUtc''].replace(''Z'',''+00:00''))
            if require_active and datetime.now(timezone.utc)>=expiry:
                raise RuntimeError(''The approved guest bridge has expired; host elevation is not available to CI.'')
            assert data[''operations'']==list(OPERATIONS) and data[''task'']==''CodexRunnerScopedSetup''
            for name in (''runner-inbox'',''runner-outbox''):
                path=ROOT/name
                assert path.is_dir() and not path.is_symlink() and not path.is_junction()
            return data

        def submit(operation, script=None, timeout=180, *, request_id=None):
            configuration()
            pending=list((ROOT/''runner-inbox'').glob(''*.json''))
            if pending:
                raise RuntimeError(''Recover the existing request before submitting another: ''+pending[0].stem)
            assert operation in OPERATIONS and type(timeout) is int and 15<=timeout<=600
            request_id=request_id or uuid.uuid4().hex
            assert len(request_id)==32 and all(x in ''0123456789abcdef'' for x in request_id)
            request=dict(id=request_id,operation=operation,timeoutSeconds=timeout)
            if operation==''guest-exec'':
                assert isinstance(script,str) and 0<len(script)<=16777216
                request[''script'']=script
            else:
                assert script is None
            raw=json.dumps(request,ensure_ascii=False).encode(''utf-8'')
            assert len(raw)<=25165824
            # This permission runs only the immutable protected task as its existing
            # approved principal. It grants no right to edit the task or host code.
            subprocess.run([r''C:\Windows\System32\schtasks.exe'',''/Run'',''/TN'',''CodexRunnerScopedSetup''],
                           check=True,capture_output=True,creationflags=subprocess.CREATE_NO_WINDOW,timeout=20)
            temporary=ROOT/''runner-inbox''/(request[''id'']+''.tmp'')
            with temporary.open(''xb'') as stream:
                stream.write(raw)
            temporary.rename(temporary.with_suffix(''.json''))
            return request[''id'']

        def acknowledge_result(request_id):
            assert len(request_id)==32 and all(x in ''0123456789abcdef'' for x in request_id)
            configuration(require_active=False)
            request=ROOT/''runner-inbox''/(request_id+''.json'')
            response=ROOT/''runner-outbox''/(request_id+''.json'')
            if request.is_symlink() or request.is_junction() or response.is_symlink() or response.is_junction():
                raise RuntimeError(''Unexpected transport link; cleanup refused.'')
            request.unlink(missing_ok=True)
            response.unlink(missing_ok=True)

        def read_result(request_id, *, acknowledge=True):
            assert len(request_id)==32 and all(x in ''0123456789abcdef'' for x in request_id)
            configuration(require_active=False)
            path=ROOT/''runner-outbox''/(request_id+''.json'')
            try:
                value=json.loads(path.read_text(encoding=''utf-8-sig''))
            except (FileNotFoundError,json.JSONDecodeError):

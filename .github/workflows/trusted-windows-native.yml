            tests = []
            for row in sorted(rows, key=lambda r:r[''label'']):
                name = row[''label''].split('':'')[1]
                executable = Path(row[''executable''])
                launcher = copy(str(executable), ''launchers/'' + name + executable.suffix)
                if not row[''manifest'']:
                    raise ValueError(''Missing runfiles manifest: '' + name)
                manifest_source = (execroot / row[''manifest'']).resolve(strict=True)
                if not manifest_source.is_relative_to(output_root):
                    raise ValueError(''Manifest outside build outputs'')
                mapping = []
                for logical, source in manifest_rows(manifest_source.read_text(encoding=''utf-8'')):
                    relative = ''runfiles/'' + logical
                    if logical == ''_repo_mapping'':
                        relative = ''mappings/'' + name + ''.csv''
                    mapped = copy(source, relative)
                    if '' '' in logical or ''\n'' in logical:
                        raise ValueError(''Guest launchers require unescaped logical names'')
                    mapping.append(logical + '' '' + mapped)
                manifest_rel = ''manifests/'' + name + ''.manifest''
                manifest_path = dest / manifest_rel
                manifest_path.parent.mkdir(exist_ok=True)
                manifest_path.write_text(''\n''.join(mapping) + ''\n'', encoding=''utf-8'', newline=''\n'')
                inventory[manifest_rel.casefold()] = {''path'': manifest_rel, ''bytes'':manifest_path.stat().st_size, ''sha256'':digest(manifest_path)}
                # Only explicit Bazel rule values are transferred. No host environment or credentials.
                environment = row[''environment'']
                if any(re.search(r''TOKEN|PASSWORD|SECRET|SSH'', k, re.I) for k in environment):
                    raise ValueError(''Unexpected credential-like test environment field'')
                tests.append({''label'':row[''label''], ''executable'':launcher, ''manifest'':guest+''/''+manifest_rel, ''environment'':environment, ''args'':TEST_FILTERS.get(row[''label''], []) + [''--test-threads=1'', ''--nocapture'']})
            metadata = {''schema'':1, ''runId'':run_id, ''runAttempt'':attempt, ''bundleId'':bundle_id, ''sourceSha'':SOURCE, ''sourceTree'':SOURCE_TREE, ''patchSha256'':PATCH_SHA256, ''validationCommit'':actual, ''controllerSha'':os.environ[''GITHUB_SHA''], ''guestRoot'':guest, ''files'':list(inventory.values()), ''tests'':tests}
            (dest/''bundle.json'').write_text(json.dumps(metadata, indent=2), encoding=''utf-8'')
            archive=parent/(bundle_id+''.zip'')
            with zipfile.ZipFile(archive, ''x'', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
                z.write(dest/''bundle.json'', ''bundle.json'')

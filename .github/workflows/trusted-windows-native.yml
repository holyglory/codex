            return value

        def outstanding_requests():
            """Discover retained CI transport only; this never starts the helper."""
            configuration(require_active=False)
            identities=set()
            for directory in (''runner-inbox'',''runner-outbox''):
                for path in (ROOT/directory).glob(''*.json''):
                    request_id=path.stem
                    if len(request_id)==32 and all(x in ''0123456789abcdef'' for x in request_id):

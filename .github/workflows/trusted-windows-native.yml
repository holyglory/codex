name: Trusted native Windows MSVC
permissions:
  contents: read
jobs:
  native-msvc:
    if: github.repository == 'holyglory/codex-win-msvc-ci' && github.event.repository.private == true && github.event_name
      == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'holyglory' && github.triggering_actor
      == 'holyglory'
    runs-on:
    - self-hosted
    - Windows
    - X64
    - codex-win-msvc
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      CODEX_WINDOWS_BUILD_ROOT: H:/codex-ci
      EXPECTED_BOOT_AFTER_UTC: ${{ inputs.boot_after_utc }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      CARGO_BUILD_JOBS: '56'
    steps:
    - name: Verify source identity input
      run: "$ErrorActionPreference = 'Stop'\nif ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') {\n  throw 'source_sha\
        \ must be a full 40-character commit ID.'\n}\n"
    - name: Checkout exact public candidate
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: holyglory/codex
        ref: ${{ inputs.source_sha }}
        token: ${{ github.token }}
        persist-credentials: false
        fetch-depth: 1
    - name: Verify runner identity, reboot boundary, and checkout
      run: "$ErrorActionPreference = 'Stop'\n$identity = [Security.Principal.WindowsIdentity]::GetCurrent()\nif\
        \ ($identity.Name -notmatch '\\\\svc_codex_runner$') { throw 'Unexpected runner identity.' }\nif (([Security.Principal.WindowsPrincipal]$identity).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))\
        \ {\n  throw 'The runner must not be an administrator.'\n}\n$workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)\n\
        if (-not $workspace.StartsWith('H:\\codex-ci\\_work\\', [StringComparison]::OrdinalIgnoreCase)) {\n  throw\
        \ 'The workspace must be beneath H:\\codex-ci\\_work.'\n}\n$boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToUniversalTime()\n\
        if ($env:EXPECTED_BOOT_AFTER_UTC) {\n  $minimumBoot = [DateTimeOffset]::Parse($env:EXPECTED_BOOT_AFTER_UTC,\
        \ [Globalization.CultureInfo]::InvariantCulture)\n  if ($boot -le $minimumBoot.UtcDateTime) { throw 'Windows\
        \ has not rebooted since the requested checkpoint.' }\n}\n$actual = (git rev-parse HEAD).Trim()\nif ($actual\
        \ -cne $env:SOURCE_SHA) { throw \"Checked out $actual instead of $env:SOURCE_SHA.\" }\n[ordered]@{\n  machine\
        \ = $env:COMPUTERNAME\n  identity = $identity.Name\n  runner = $env:RUNNER_NAME\n  workspace = $workspace\n\
        \  sourceSha = $actual\n  lastBootUtc = $boot\n} | ConvertTo-Json\n"
    - name: Configure preinstalled native build tools
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n& 'C:\\ProgramData\\CodexRunner\\volume\\Assert-CodexBuildVolume.ps1'\n\
        $mounted = [Text.StringBuilder]::new(128)\n$drive = [Text.StringBuilder]::new(128)\nif (-not [CodexVolumeProbe]::GetVolumeNameForVolumeMountPoint('H:\\\
        codex-ci\\',$mounted,$mounted.Capacity) -or\n    -not [CodexVolumeProbe]::GetVolumeNameForVolumeMountPoint('R:\\\
        ',$drive,$drive.Capacity) -or\n    $mounted.ToString() -ne $drive.ToString()) { throw 'R: is not the bounded\
        \ build volume on H:.' }\n$root = 'R:'\n$repoRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).Replace('H:\\\
        codex-ci\\','R:\\')\nif (-not $repoRoot.StartsWith('R:\\_work\\',[StringComparison]::OrdinalIgnoreCase))\
        \ { throw 'Unexpected canonical repository path.' }\nforeach ($name in @('CARGO_HOME','RUSTUP_HOME','BAZELISK_HOME','HOME','USERPROFILE','APPDATA','LOCALAPPDATA','RUNNER_TOOL_CACHE','PATH'))\
        \ {\n  $value = [Environment]::GetEnvironmentVariable($name)\n  if ($value) { \"$name=$($value.Replace('H:\\\
        codex-ci','R:').Replace('H:/codex-ci','R:'))\" | Add-Content -Path $env:GITHUB_ENV }\n}\n$dirs = @(\n  \"\
        $root/o\",\n  \"$root/b\",\n  \"$root/bazel-repository-cache\",\n  \"$root/bazel-repo-contents-cache\",\n\
        \  \"$root/cargo-target\",\n  \"$root/tmp\",\n  \"$env:RUNNER_TEMP/native-codex-evidence\"\n)\n$dirs | ForEach-Object\
        \ { New-Item -ItemType Directory -Force -Path $_ | Out-Null }\n@(\n  \"SYSTEMROOT=$([Environment]::GetFolderPath('Windows'))\"\
        ,\n  \"windir=$([Environment]::GetFolderPath('Windows'))\",\n  \"SystemDrive=C:\",\n  \"ComSpec=C:\\Windows\\\
        System32\\cmd.exe\",\n  \"CI_BUILD_ROOT=$root\",\n  \"BAZEL_OUTPUT_BASE=$root/o\",\n  \"BAZEL_OUTPUT_USER_ROOT=$root/b\"\
        ,\n  \"BAZEL_REPOSITORY_CACHE=$root/bazel-repository-cache\",\n  \"BAZEL_REPO_CONTENTS_CACHE=$root/bazel-repo-contents-cache\"\
        ,\n  \"CARGO_TARGET_DIR=$root/cargo-target\",\n  \"TEMP=$root/tmp\",\n  \"TMP=$root/tmp\",\n  \"CODEX_REPO_ROOT=$repoRoot\"\
        ,\n  \"CODEX_BAZEL_WORKSPACE=$repoRoot\",\n  \"BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1\"\n) | Add-Content\
        \ -Path $env:GITHUB_ENV\n"
    - name: Import and verify the native x64 MSVC SDK environment
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n# The service account cannot enumerate the installer catalog through\
        \ vswhere.\n# This runner has a dedicated fixed installation, verified by compilation below.\n$installPath\
        \ = 'C:\\BuildTools'\n$vsDevCmd = Join-Path $installPath 'Common7/Tools/VsDevCmd.bat'\nif (-not (Test-Path\
        \ -LiteralPath $vsDevCmd -PathType Leaf)) { throw 'The dedicated MSVC Build Tools installation is missing.'\
        \ }\n$envLines = & $env:ComSpec /d /c ('\"{0}\" -no_logo -arch=x64 -host_arch=x64 >nul && set' -f $vsDevCmd)\n\
        if ($LASTEXITCODE -ne 0) { throw 'VsDevCmd failed.' }\n$exports = @('INCLUDE','LIB','LIBPATH','PATH','UCRTVersion','UniversalCRTSdkDir','VCINSTALLDIR','VCToolsInstallDir','WindowsLibPath','WindowsSdkBinPath','WindowsSdkDir','WindowsSDKLibVersion','WindowsSDKVersion','VSCMD_ARG_HOST_ARCH','VSCMD_ARG_TGT_ARCH')\n\
        foreach ($line in $envLines) {\n  if ($line -match '^([^=]+)=(.*)$' -and $exports -contains $matches[1])\
        \ {\n    [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')\n    \"$($matches[1])=$($matches[2])\"\
        \ | Out-File $env:GITHUB_ENV -Encoding utf8 -Append\n  }\n}\nforeach ($name in @('INCLUDE','LIB','VCToolsInstallDir','WindowsSdkDir','WindowsSDKVersion'))\
        \ {\n  if (-not [Environment]::GetEnvironmentVariable($name)) { throw \"Missing MSVC environment: $name\"\
        \ }\n}\nif ($env:VSCMD_ARG_HOST_ARCH -ne 'x64' -or $env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw 'Expected\
        \ x64 MSVC host and target.' }\n@(\n  \"BAZEL_VC=$env:VCINSTALLDIR\",\n  \"BAZEL_VC_FULL_VERSION=$((Split-Path\
        \ $env:VCToolsInstallDir.TrimEnd('\\') -Leaf))\",\n  \"BAZEL_WINSDK_FULL_VERSION=$($env:WindowsSDKVersion.TrimEnd('\\\
        '))\"\n) | Out-File $env:GITHUB_ENV -Encoding utf8 -Append\n$probe = Join-Path $env:RUNNER_TEMP 'native-codex-evidence/msvc-probe'\n\
        New-Item -ItemType Directory -Force $probe | Out-Null\n'#include <windows.h>', '#include <stdio.h>', 'int\
        \ main(void) { printf(\"MSVC x64 SDK compile passed\\n\"); return sizeof(void*) == 8 ? 0 : 1; }' | Set-Content\
        \ (Join-Path $probe 'probe.c')\n& cl.exe /nologo /W4 /WX (Join-Path $probe 'probe.c') \"/Fo$probe/probe.obj\"\
        \ \"/Fe$probe/probe.exe\"\nif ($LASTEXITCODE -ne 0) { throw 'Native MSVC compilation failed.' }\n& (Join-Path\
        \ $probe 'probe.exe')\nif ($LASTEXITCODE -ne 0) { throw 'Native MSVC probe failed.' }\n$rust = & rustc --version\n\
        if ($LASTEXITCODE -ne 0 -or $rust -notmatch '^rustc 1\\.95\\.0 ') { throw \"Expected Rust 1.95.0; got $rust\"\
        \ }\nWrite-Host $rust\nWrite-Host \"MSVC: $((Get-Command cl.exe).Source)\"\nWrite-Host \"Windows SDK: $env:WindowsSdkDir$env:WindowsSDKVersion\"\
        \n"
    - name: Prepare pinned Windows voice inputs
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n# Bazel's injected repository must use the normal drive path too.\n\
        $env:RUNNER_TEMP = [IO.Path]::GetFullPath($env:RUNNER_TEMP).Replace('H:\\codex-ci\\','R:\\')\nif (-not $env:RUNNER_TEMP.StartsWith('R:\\\
        ',[StringComparison]::OrdinalIgnoreCase)) { throw 'Voice tools must use the bounded build volume.' }\n$manifest\
        \ = Get-Content -Raw .github/scripts/voice-cygwin-snapshot.json | ConvertFrom-Json\nif (-not $env:SystemRoot\
        \ -or $env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Expected the native x64 Windows OS environment.'\
        \ }\n\"VOICE_WINDOWS_SYSTEM_ROOT=$env:SystemRoot\" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append\n\"\
        VOICE_WINDOWS_HOST_ARCH=$env:PROCESSOR_ARCHITECTURE\" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append\n\
        $pin = $manifest.archive\n$source = $manifest.sourceArchive\n$directory = Join-Path $env:RUNNER_TEMP 'voice-cygwin-snapshot'\n\
        New-Item -ItemType Directory -Force -Path $directory | Out-Null\nforeach ($asset in @($pin, $source)) {\n\
        \  $uri = \"https://github.com/openai/codex/releases/download/$($pin.tag)/$($asset.name)\"\n  Invoke-WebRequest\
        \ -Uri $uri -OutFile (Join-Path $directory $asset.name)\n}\n$sourceFile = Join-Path $directory $source.name\n\
        if ((Get-Item $sourceFile).Length -ne $source.bytes -or\n    (Get-FileHash $sourceFile -Algorithm SHA256).Hash.ToLowerInvariant()\
        \ -ne $source.sha256) {\n  throw 'Public Cygwin source archive mismatch.'\n}\n$archiveFile = Join-Path $directory\
        \ $pin.name\nif ((Get-Item $archiveFile).Length -ne $pin.bytes -or\n    (Get-FileHash $archiveFile -Algorithm\
        \ SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) {\n  throw 'Pinned Cygwin archive mismatch.'\n}\n\"VOICE_WINDOWS_TARGET=x86_64-pc-windows-msvc\"\
        \ | Out-File $env:GITHUB_ENV -Encoding utf8 -Append\n\"VOICE_CYGWIN_ARCHIVE=$archiveFile\" | Out-File $env:GITHUB_ENV\
        \ -Encoding utf8 -Append\n# Use the normal drive path so the pinned-image helper can reject reparse points.\n\
        & ./.github/scripts/setup-voice-windows.ps1 -Target x86_64-pc-windows-msvc -SnapshotArchive $archiveFile\
        \ -PkgconfImage 'R:\\provisioned\\pkgconf\\3.0.6-x64\\native'\n"
    - name: Provide a working python3 launcher for native actions
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        $python = (Get-Command python.exe -ErrorAction Stop).Source

        $venv = Join-Path $env:CI_BUILD_ROOT ''tools/python-native''

        # Use Python''s venv launcher, which retains the base interpreter and DLL paths.

        # A renamed copy of the base python.exe outside its installation is insufficient.

        & $python -m venv --without-pip --system-site-packages $venv

        if ($LASTEXITCODE -ne 0) { throw ''Could not prepare the Python launcher environment.'' }

        $shim = Join-Path $venv ''Scripts''

        Copy-Item -LiteralPath (Join-Path $shim ''python.exe'') -Destination (Join-Path $shim ''python3.exe'') -Force

        & (Join-Path $shim ''python3.exe'') -c ''import sys, ssl; print(sys.executable); print(sys.version)''

        if ($LASTEXITCODE -ne 0) { throw ''The python3 launcher failed.'' }

        "PATH=$shim;$env:PATH" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

        "CODEX_PYTHON_BIN=$shim" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

        '
    - name: Prepare checksum-pinned zstd for local package archives
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$code = @'\nimport json, os, sys\nfrom pathlib import Path\nsys.path.insert(0,\
        \ 'scripts')\nfrom codex_package.dotslash import fetch_dotslash_executable\nfrom codex_package.targets import\
        \ TARGET_SPECS\n# The zstd DotSlash manifest has leading comments; the shared fetcher's\n# JSON reader only\
        \ strips its shebang. Normalize a separate evidence copy.\nlines = Path('.github/workflows/zstd').read_text(encoding='utf-8').splitlines()\n\
        while lines and (not lines[0].strip() or lines[0].lstrip().startswith(('#!', '//'))):\n    lines.pop(0)\n\
        manifest = Path(os.environ['RUNNER_TEMP']) / 'native-codex-evidence' / 'zstd-manifest.json'\nmanifest.write_text(json.dumps(json.loads('\\\
        n'.join(lines))), encoding='utf-8')\npath = fetch_dotslash_executable(TARGET_SPECS['x86_64-pc-windows-msvc'],\
        \ manifest_path=manifest, artifact_label='zstd', cache_key='zstd-windows-x64', dest_name='zstd.exe')\nprint(path)\n\
        '@\n$zstd = & python3.exe -c $code\nif ($LASTEXITCODE -ne 0 -or -not $zstd) { throw 'Could not prepare checksum-pinned\
        \ zstd.' }\n$zstd = $zstd.Trim()\nif (-not ([IO.Path]::GetFullPath($zstd)).StartsWith('R:\\', [StringComparison]::OrdinalIgnoreCase))\
        \ { throw 'zstd must be cached on the bounded build volume.' }\n& $zstd --version\nif ($LASTEXITCODE -ne\
        \ 0) { throw 'zstd failed to execute.' }\nSplit-Path -Parent $zstd | Out-File $env:GITHUB_PATH -Encoding\
        \ utf8 -Append\n"
    - name: Compute and verify the native Windows Bazel path
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n& ./.github/scripts/compute-bazel-windows-path.ps1\n# The upstream\
        \ filter recognizes hosted Visual Studio paths but misses C:\\BuildTools.\n$derived = Get-Content $env:GITHUB_ENV\
        \ | Where-Object { $_.StartsWith('CODEX_BAZEL_WINDOWS_PATH=') } | Select-Object -Last 1\nif (-not $derived)\
        \ { throw 'Stable Windows Bazel PATH was not generated.' }\n$entries = @(\n  (Join-Path $env:VCToolsInstallDir\
        \ 'bin/HostX64/x64'),\n  (Join-Path $env:WindowsSdkBinPath \"$($env:WindowsSDKVersion.TrimEnd('\\'))/x64\"\
        ),\n  $env:CODEX_PYTHON_BIN\n) + ($derived.Substring('CODEX_BAZEL_WINDOWS_PATH='.Length) -split ';')\n$stablePath\
        \ = ($entries | Where-Object { $_ } | Select-Object -Unique) -join ';'\n$env:PATH = $stablePath\nforeach\
        \ ($command in @('cl.exe','link.exe','rc.exe','python3.exe','git.exe','node.exe','pwsh.exe')) {\n  Write-Host\
        \ \"$command -> $((Get-Command $command -ErrorAction Stop).Source)\"\n}\n& python3.exe -c 'import ssl, sys;\
        \ print(sys.version)'\nif ($LASTEXITCODE -ne 0) { throw 'Python failed under the Bazel action PATH.' }\n\
        \"CODEX_BAZEL_WINDOWS_PATH=$stablePath\" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append\nWrite-Host 'Bazel\
        \ target: //:windows_x86_64_msvc; host: //:local_windows_msvc'\n"
    - name: Require verified isolated-VM coverage for this exact source
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: "$ErrorActionPreference = 'Stop'\n$root = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'native-codex-evidence')).Replace('H:\\\
        codex-ci\\','R:\\')\nif ([IO.Path]::GetPathRoot($root) -ine 'R:\\') { throw 'Coverage evidence must remain\
        \ on the H-backed volume.' }\n$null = New-Item -ItemType Directory -Path $root -Force\n$helper = @'\n\"\"\
        \"Validate the exact-source VM result and account for the host/guest test split.\"\"\"\nimport argparse\n\
        from collections import Counter\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport\
        \ re\nimport subprocess\nfrom urllib.parse import unquote, urlparse\n\nSOURCE_REPOSITORY = \"holyglory/codex\"\
        \nCONTROLLER_REPOSITORY = \"holyglory/codex-win-msvc-ci\"\nVM_ID = \"23b78cc8-71f0-45c1-ad87-f763fd2c1165\"\
        \nCOUNTS = {\n    \"//codex-rs/core:core-all-test\": (9, 0),\n    \"//codex-rs/exec-server:exec-server-exec_process-test\"\
        : (1, 0),\n    \"//codex-rs/exec-server:exec-server-file_system_windows-test\": (65, 2),\n    \"//codex-rs/windows-sandbox-rs:windows-sandbox-rs-helper_manifest-test\"\
        : (1, 0),\n    \"//codex-rs/windows-sandbox-rs:windows-sandbox-rs-unit-tests\": (277, 5),\n}\nMIXED_FILTERS\
        \ = {\n    \"//codex-rs/core:core-all-test\": \"suite::windows_sandbox::\",\n    \"//codex-rs/exec-server:exec-server-exec_process-test\"\
        :\n        \"windows_sandbox::tmpdir_uses_command_environment_over_rpc::elevated\",\n}\nBASE_FILTERS = [\n\
        \    \"suite::code_mode::code_mode_can_call_hidden_dynamic_tools\",\n    \"tests::windows_tests::conpty_ctrl_c_interrupts_powershell_foreground_child\"\
        ,\n]\nLINUX_ONLY_TESTS = {\n    \"//bazel/rules/testing/wine:wine-test-support-unit-tests\",\n    \"//codex-rs/app-server:app-server-all-wine-exec-test\"\
        ,\n    \"//codex-rs/core/tests/remote_env_windows:smoke-test\",\n    \"//codex-rs/core:core-all-wine-exec-test\"\
        ,\n    \"//codex-rs/core:core-mcp_trace_propagation-wine-exec-test\",\n    \"//codex-rs/core:core-responses_headers-wine-exec-test\"\
        ,\n    \"//codex-rs/exec-server:exec-server-current-version-test\",\n    \"//codex-rs/exec-server:exec-server-minimum-release-test\"\
        ,\n    \"//codex-rs/exec-server:exec-server-stable-release-test\",\n}\n\n\ndef require(condition, message):\n\
        \    if not condition:\n        raise ValueError(message)\n\n\ndef digest(value, length=64):\n    return\
        \ isinstance(value, str) and re.fullmatch(\"[0-9a-f]{\" + str(length) + \"}\", value)\n\n\ndef inventory_counts(values):\n\
        \    require(isinstance(values, list) and 0 < len(values) < 100000, \"Invalid test inventory\")\n    require(all(isinstance(n,\
        \ str) and re.fullmatch(r\"\\S{1,500}\", n) for n in values), \"Invalid test name\")\n    return Counter(values)\n\
        \n\ndef names(values):\n    # Privileged result names remain unique under the current five-target schema.\n\
        \    counts = inventory_counts(values)\n    require(len(values) == len(counts), \"Duplicate test name\"\
        )\n    return set(counts)\n\n\ndef check_host_case_coverage(executed, expected):\n    require(inventory_counts(executed)\
        \ == inventory_counts(expected),\n            \"Host and VM case coverage has a gap, overlap, or wrong multiplicity\"\
        )\n\n\ndef validate_report(report, source_tree):\n    require(digest(source_tree, 40), \"Invalid source\
        \ tree\")\n    require(report.get(\"schema\") == 1 and report.get(\"status\") == \"passed\", \"VM result\
        \ has not passed\")\n    require(report.get(\"sourceRepository\") == SOURCE_REPOSITORY, \"Wrong source repository\"\
        )\n    require(report.get(\"sourceTree\") == source_tree, \"VM result is for different source bytes\")\n\
        \    require(report.get(\"controllerRepository\") == CONTROLLER_REPOSITORY, \"Wrong controller repository\"\
        )\n    require(report.get(\"vmId\") == VM_ID, \"Wrong isolated VM\")\n    require(type(report.get(\"networkAdapters\"\
        )) is int and report[\"networkAdapters\"] == 0,\n            \"Guest network isolation is not verified\"\
        )\n    context = report.get(\"context\", {})\n    require(context == dict(machine=\"CODEX-VM-01\", identity=r\"\
        CODEX-VM-01\\CodexVmAdmin\",\n                            administrator=True, sessionId=1, windowStation=\"\
        WinSta0\", desktop=\"Default\"),\n            \"Wrong privileged execution context\")\n    for field in\
        \ (\"archiveSha256\", \"manifestSha256\", \"bodySha256\", \"verificationSha256\"):\n        require(digest(report.get(field)),\
        \ \"Missing verified evidence digest: \" + field)\n    for field in (\"bundleControllerSha\", \"validationCommit\"\
        ):\n        require(digest(report.get(field), 40), \"Missing immutable source identity: \" + field)\n  \
        \  require(isinstance(report.get(\"bundleRunId\"), int) and report[\"bundleRunId\"] > 0, \"Invalid bundle\
        \ run\")\n    require(digest(report.get(\"planId\"), 32), \"Missing guest plan identity\")\n    results\
        \ = report.get(\"results\", [])\n    require(len(results) == len(COUNTS) and {x.get(\"label\") for x in\
        \ results} == set(COUNTS),\n            \"The VM must cover all five target selections exactly once\")\n\
        \    for result in results:\n        label = result[\"label\"]\n        passed, ignored = COUNTS[label]\n\
        \        require(result.get(\"successful\") is True and result.get(\"failed\") == 0, \"A guest target failed\"\
        )\n        require(result.get(\"passed\") == passed and result.get(\"ignored\") == ignored,\n          \
        \      \"Guest result counts differ\")\n        selected = names(result.get(\"selectedNames\"))\n      \
        \  require(len(selected) == result.get(\"selected\") == passed + ignored, \"Incomplete guest coverage\"\
        )\n        require(result.get(\"selection\") == MIXED_FILTERS.get(label), \"Unexpected guest filter\")\n\
        \        require(digest(result.get(\"logSha256\")), \"Missing guest log digest\")\n        if label in MIXED_FILTERS:\n\
        \            require(all(MIXED_FILTERS[label] in n for n in selected), \"Guest filter does not match inventory\"\
        )\n        if label.endswith(\":exec-server-exec_process-test\"):\n            require(selected == {MIXED_FILTERS[label]},\
        \ \"Elevated exec case must be exact\")\n    require(sum(x[\"passed\"] for x in results) == 353 and sum(x[\"\
        ignored\"] for x in results) == 7,\n            \"Incomplete privileged result\")\n    return {x[\"label\"\
        ]: x for x in results}\n\n\ndef partition_inventory(label, inventory, report):\n    require(label in MIXED_FILTERS,\
        \ \"Only mixed targets can be partitioned\")\n    guest_results = validate_report(report, report[\"sourceTree\"\
        ])\n    complete = inventory_counts(inventory)\n    moved = Counter({n:count for n,count in complete.items()\
        \ if MIXED_FILTERS[label] in n})\n    require(moved == Counter(guest_results[label][\"selectedNames\"]),\n\
        \            \"VM and host inventories do not cover the same privileged cases\")\n    upstream = Counter({n:count\
        \ for n,count in complete.items() if any(f in n for f in BASE_FILTERS)})\n    require(not moved & upstream,\
        \ \"Privileged coverage overlaps an upstream exclusion\")\n    host = complete - moved - upstream\n    require(host\
        \ and not host & moved and host + moved + upstream == complete, \"Invalid coverage partition\")\n    return\
        \ dict(label=label, fullNames=sorted(complete.elements()), hostNames=sorted(host.elements()),\n        \
        \        guestNames=sorted(moved.elements()), upstreamExcludedNames=sorted(upstream.elements()))\n\n\ndef\
        \ bounded_build_path(value):\n    path = Path(value).resolve(strict=True)\n    require(path.drive.upper()\
        \ == \"R:\", \"Evidence must remain on the H-backed build volume\")\n    return path\n\n\ndef inventory_command(label,\
        \ executable):\n    expected = {\"//codex-rs/core:core-all-test\": \".bat\",\n                \"//codex-rs/exec-server:exec-server-exec_process-test\"\
        : \".exe\"}\n    require(label in expected and executable.suffix.lower() == expected[label],\n         \
        \   \"Unexpected native mixed-target executable type\")\n    command = [str(executable), \"--list\", \"\
        --format\", \"terse\"]\n    return [r\"C:\\Windows\\System32\\cmd.exe\", \"/d\", \"/c\", *command] if executable.suffix.lower()\
        \ == \".bat\" else command\n\n\ndef inventory_environment(row, manifest):\n    env = dict(os.environ)\n\
        \    for key in (\"TEST_TOTAL_SHARDS\", \"TEST_SHARD_INDEX\", \"RUNFILES_DIR\", \"TEST_SRCDIR\", \"RULES_RUST_TEST_TOTAL_SHARDS\"\
        ,\n                \"RULES_RUST_TEST_SHARD_INDEX\", \"TESTBRIDGE_TEST_ONLY\", \"CODEX_BAZEL_TEST_SKIP_FILTERS\"\
        ):\n        env.pop(key, None)\n    env.update(row.get(\"environment\", {}))\n    # Direct execution bypasses\
        \ Bazel's test setup, which normally supplies the\n    # workspace prefix used by the Windows wrapper's\

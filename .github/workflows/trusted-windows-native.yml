        import sys
        import zipfile

        TARGETS = set([''//codex-rs/core:core-all-test'', ''//codex-rs/exec-server:exec-server-exec_process-test'', ''//codex-rs/exec-server:exec-server-file_system_windows-test'', ''//codex-rs/windows-sandbox-rs:windows-sandbox-rs-helper_manifest-test'', ''//codex-rs/windows-sandbox-rs:windows-sandbox-rs-unit-tests''])
        # No application patch is applied. This field records the empty patch.
        PATCH_SHA256 = hashlib.sha256(b'''').hexdigest()
        TEST_FILTERS = {''//codex-rs/exec-server:exec-server-exec_process-test'': [''windows_sandbox::tmpdir_uses_command_environment_over_rpc::elevated'', ''--exact''], ''//codex-rs/core:core-all-test'': [''suite::windows_sandbox::'']}
        MAX_BYTES = 20 * 1024**3

        def digest(path):
            with path.open(''rb'') as f:
                return hashlib.file_digest(f, ''sha256'').hexdigest()

        def logical_path(value):
            p = PurePosixPath(value)
            if not value or p.is_absolute() or any(x in ('''', ''..'', ''.'') for x in value.split(''/'')) or re.search(r''[:\\\r\n]'', value):
                raise ValueError(''Invalid logical runfile path: '' + repr(value))
            return p

        def manifest_rows(text):
            for line in text.splitlines():
                escaped = line.startswith('' '')
                key, sep, source = line[1 if escaped else 0:].partition('' '')
                if escaped:
                    def unescape(s):
                        return re.sub(r''\\([snb])'', lambda m: {''s'':'' '', ''n'':''\n'', ''b'':''\\''}[m[1]], s)
                    key, source = unescape(key), unescape(source)
                yield str(logical_path(key)), source if sep else key

        def run_identity(environment):
            source, tree = environment.get(''SOURCE_SHA'', ''''), environment.get(''NATIVE_SOURCE_TREE'', '''')
            controller = environment.get(''GITHUB_SHA'', '''')
            if not all(re.fullmatch(''[0-9a-f]{40}'', x) for x in (source, tree, controller)):
                raise ValueError(''Exact source, tree and controller commits are required'')
            run, attempt = environment.get(''GITHUB_RUN_ID'', ''''), environment.get(''GITHUB_RUN_ATTEMPT'', '''')
            if not all(re.fullmatch(''[1-9][0-9]*'', x) for x in (run, attempt)):

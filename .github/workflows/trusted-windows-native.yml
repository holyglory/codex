            error = desktop ? 0 : GetLastError();
            if (!SetProcessWindowStation(original)) goto cleanup;
            if (!desktop) { SetLastError(error); goto cleanup; }
            if (swprintf_s(full_name, 512, L"%s\\%s", name, desktop_name) < 0) goto cleanup;
            if (wcslen(argv[3]) >= 32768) { SetLastError(ERROR_BUFFER_OVERFLOW); goto cleanup; }
            if (wcscpy_s(command, 32768, argv[3]) != 0) { SetLastError(ERROR_INVALID_PARAMETER); goto cleanup; }

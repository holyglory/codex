        \ the same directory handle.\nNo child content, ACLs, privileges, or security settings are read or changed.\n\
        \"\"\"\nimport ctypes\nfrom ctypes import wintypes\nimport struct\nfrom types import SimpleNamespace\n\n\
        _kernel = ctypes.WinDLL('kernel32', use_last_error=True)\n_kernel.CreateFileW.argtypes = [wintypes.LPCWSTR,wintypes.DWORD,wintypes.DWORD,\n\
        \    wintypes.LPVOID,wintypes.DWORD,wintypes.DWORD,wintypes.HANDLE]\n_kernel.CreateFileW.restype = wintypes.HANDLE\n\
        _kernel.GetFileInformationByHandleEx.argtypes = [wintypes.HANDLE,ctypes.c_int,wintypes.LPVOID,wintypes.DWORD]\n\
        _kernel.GetFileInformationByHandleEx.restype = wintypes.BOOL\n_kernel.CloseHandle.argtypes = [wintypes.HANDLE]\n\
        _kernel.CloseHandle.restype = wintypes.BOOL\n_INVALID_HANDLE = ctypes.c_void_p(-1).value\n\ndef parse_directory_entries(data,\
        \ volume):\n    \"\"\"Decode the documented 88-byte FILE_ID_EXTD_DIR_INFO fixed header.\"\"\"\n    if volume\
        \ <= 0:\n        raise ValueError('Missing directory volume identity')\n    entries=[]\n    offset=0\n \
        \   while True:\n        if offset+88 > len(data):\n            raise ValueError('Truncated directory identity\
        \ header')\n        next_offset=struct.unpack_from('<I',data,offset)[0]\n        size=struct.unpack_from('<q',data,offset+40)[0]\n\
        \        attributes,name_bytes=struct.unpack_from('<II',data,offset+56)\n        inode=int.from_bytes(data[offset+72:offset+88],'little')\n\
        \        end=offset+88+name_bytes\n        if name_bytes==0 or name_bytes%2 or end>len(data) or size<0:\n\
        \            raise ValueError('Invalid directory identity record')\n        name=data[offset+88:end].decode('utf-16-le',errors='strict')\n\
        \        if any(c in name for c in ('\\x00','/','\\\\')):\n            raise ValueError('Invalid directory\
        \ entry name')\n        if name not in ('.','..'):\n            entries.append((name,SimpleNamespace(st_dev=volume,st_ino=inode,\n\
        \                st_size=size,st_file_attributes=attributes)))\n        if next_offset==0:\n           \
        \ break\n        if next_offset%8 or next_offset<88+name_bytes or offset+next_offset>=len(data):\n     \
        \       raise ValueError('Invalid directory entry offset')\n        offset+=next_offset\n    return entries\n\
        \ndef enumerate_directory_identities(directory):\n    # FILE_LIST_DIRECTORY | FILE_READ_ATTRIBUTES, share\
        \ read/write/delete,\n    # OPEN_EXISTING, BACKUP_SEMANTICS | OPEN_REPARSE_POINT. No privilege enabled.\n\
        \    handle=_kernel.CreateFileW(str(directory),0x81,7,None,3,0x02200000,None)\n    if handle==_INVALID_HANDLE:\n\
        \        raise ctypes.WinError(ctypes.get_last_error())\n    try:\n        attributes=ctypes.create_string_buffer(8)\n\
        \        if not _kernel.GetFileInformationByHandleEx(handle,9,attributes,8):\n            raise ctypes.WinError(ctypes.get_last_error())\n\
        \        flags=struct.unpack_from('<I',attributes.raw)[0]\n        if not flags & 0x10 or flags & 0x400:\n\
        \            raise ValueError('Fixture directory is not an ordinary directory')\n        identity=ctypes.create_string_buffer(24)\n\
        \        if not _kernel.GetFileInformationByHandleEx(handle,18,identity,24):\n            raise ctypes.WinError(ctypes.get_last_error())\n\
        \        volume=struct.unpack_from('<Q',identity.raw)[0]\n        if volume<=0 or int.from_bytes(identity.raw[8:24],'little')<=0:\n\
        \            raise ValueError('Missing directory identity')\n        buffer=ctypes.create_string_buffer(65536)\n\
        \        entries=[]\n        for page in range(256):\n            if not _kernel.GetFileInformationByHandleEx(handle,20\
        \ if page==0 else 19,buffer,len(buffer)):\n                error=ctypes.get_last_error()\n             \
        \   if error==18: # ERROR_NO_MORE_FILES: successful end of enumeration.\n                    names=[name\
        \ for name,_ in entries]\n                    if len(names)!=len(set(names)):\n                        raise\
        \ ValueError('Duplicate directory entry')\n                    return entries\n                raise ctypes.WinError(error)\n\
        \            entries.extend(parse_directory_entries(buffer.raw,volume))\n        raise ValueError('Fixture\
        \ directory enumeration exceeded its bound')\n    finally:\n        if not _kernel.CloseHandle(handle):\n\
        \            raise ctypes.WinError(ctypes.get_last_error())\n'@\n[IO.File]::WriteAllText((Join-Path $root\
        \ 'windows_directory_identity.py'), $tool.Replace(\"`r`n\",\"`n\") + \"`n\", [Text.UTF8Encoding]::new($false))\n\
        \n$tool = @'\n\"\"\"Observe positive IDs through directory entries; keep all unresolved errors fatal.\"\"\
        \"\nfrom contextlib import contextmanager\nfrom pathlib import Path\nimport stat\nimport threading\nimport\
        \ time\nfrom windows_directory_identity import enumerate_directory_identities\n\ndef classify_fixture_identity(device,inode,expected):\n\
        \    if device==0 or inode==0:return 'unavailable'\n    return 'hard_link' if (device,inode)==expected else\
        \ 'copy'\n\n@contextmanager\ndef observe_binary_fixtures(folder,prepared,record):\n    folder=Path(folder).resolve(strict=True)\n\
        \    assert folder.drive.upper()=='R:' and folder==Path(prepared['root'])\n    expected={p['name']:(p['device'],p['inode'])\
        \ for p in prepared['probes']}\n    assert set(expected)=={'codex-app-server.exe','codex-code-mode-host.exe'}\n\
        \    assert all(d>0 and i>0 for d,i in expected.values())\n    stop=threading.Event();linked=set();copied=set();unavailable=set();directories=set();blocked=set()\n\
        \    record.update(root=str(folder),samples=0,observedDirectories=0,hardLinkedExecutables=0,\n        hardLinksByExecutable={name:0\
        \ for name in expected},copiedExecutables=0,errors=0,observerStopped=False,\n        identityMethod='positive-volume-and-file-id-v1',identityObservation='windows-directory-file-id-v1',\n\
        \        unavailableIdentitySamples=0,unavailableOnlyExecutables=0,unavailableIdentityExamples=[],\n   \
        \     copyIdentityExamples=[],errorExamples=[],errorExamplesTruncated=0,blockedDirectories=0)\n    def error_record(error,operation,directory=None):\n\
        \        record['errors']+=1\n        if len(record['errorExamples'])<32:\n            record['errorExamples'].append(dict(operation=operation,directory=directory,name=None,\n\
        \                type=type(error).__name__,errno=getattr(error,'errno',None),winerror=getattr(error,'winerror',None)))\n\
        \        else:record['errorExamplesTruncated']+=1\n    def sample():\n        while not stop.is_set():\n\
        \            try:\n                entries=list(folder.iterdir())\n            except Exception as error:\n\
        \                error_record(error,'enumerate_root')\n                break # No retries of a failed or\
        \ denied root.\n            for directory in entries:\n                if directory.name in ('.fixture-owner.json','.seed')\
        \ or directory.name in blocked:continue\n                operation='directory_lstat'\n                try:\n\
        \                    info=directory.lstat()\n                    if info.st_file_attributes & stat.FILE_ATTRIBUTE_REPARSE_POINT:continue\n\
        \                    if not info.st_file_attributes & stat.FILE_ATTRIBUTE_DIRECTORY:continue\n         \
        \           operation='directory_file_ids'\n                    # Query both executable identities from\
        \ the parent handle. Opening a\n                    # short-lived executable separately can race with Windows\
        \ deletion.\n                    identities=enumerate_directory_identities(directory)\n                \
        \    directories.add(directory.name)\n                    for name,file_info in identities:\n          \
        \              if name not in expected or file_info.st_file_attributes & (stat.FILE_ATTRIBUTE_REPARSE_POINT|stat.FILE_ATTRIBUTE_DIRECTORY):continue\n\
        \                        key=(directory.name,name)\n                        kind=classify_fixture_identity(file_info.st_dev,file_info.st_ino,expected[name])\n\
        \                        if kind=='hard_link':linked.add(key)\n                        else:\n         \
        \                   target=unavailable if kind=='unavailable' else copied\n                            examples=record['unavailableIdentityExamples'\
        \ if kind=='unavailable' else 'copyIdentityExamples']\n                            if key not in target\
        \ and len(examples)<32:\n                                examples.append(dict(directory=directory.name,name=name,device=file_info.st_dev,\n\
        \                                    inode=file_info.st_ino,bytes=file_info.st_size,attributes=file_info.st_file_attributes,\n\
        \                                    previouslyLinked=key in linked))\n                            target.add(key)\n\
        \                            if kind=='unavailable':record['unavailableIdentitySamples']+=1\n          \
        \      except FileNotFoundError:\n                    continue # The directory retired before this sample.\n\
        \                except Exception as error:\n                    error_record(error,operation,directory.name)\n\
        \                    blocked.add(directory.name) # Preserve failure; never retry it.\n            record.update(samples=record['samples']+1,observedDirectories=len(directories),\n\
        \                hardLinkedExecutables=len(linked),copiedExecutables=len(copied),blockedDirectories=len(blocked),\n\
        \                unavailableOnlyExecutables=len(unavailable-linked-copied),\n                hardLinksByExecutable={name:sum(n==name\
        \ for _,n in linked) for name in expected})\n            if linked and 'firstObservationUnixSeconds' not\
        \ in record:record['firstObservationUnixSeconds']=time.time()\n            stop.wait(0.25)\n    thread=threading.Thread(target=sample,daemon=True);thread.start()\n\
        \    try:yield\n    finally:\n        stop.set();thread.join(timeout=5);record['observerStopped']=not thread.is_alive()\n\
        '@\n[IO.File]::WriteAllText((Join-Path $root 'binary_fixture_observer.py'), $tool.Replace(\"`r`n\",\"`n\"\
        ) + \"`n\", [Text.UTF8Encoding]::new($false))\n"

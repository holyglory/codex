        import base64
        import hashlib
        from pathlib import Path
        import re
        import time

        CHUNK = 4 * 1024 * 1024
        MAX_ARCHIVE = 21 * 1024**3
        PREAMBLE = "\n$ErrorActionPreference=''Stop''\nif($env:COMPUTERNAME -cne ''CODEX-VM-01''){throw ''Wrong guest.''}\nif(@(Get-NetAdapter -ErrorAction SilentlyContinue).Count){throw ''Guest must remain offline.''}\n$root=''C:\\codex-tests''\nif((Get-Item -LiteralPath $root).Attributes -band [IO.FileAttributes]::ReparsePoint){throw ''Unexpected guest root redirection.''}\nif(Test-Path -LiteralPath (Join-Path $root ''quarantine.json'')){throw ''Guest cleanup needs inspection.''}\n$incoming=Join-Path $root ''incoming''\n$null=New-Item -ItemType Directory -Path $incoming -Force\nif((Get-Item -LiteralPath $incoming).Attributes -band [IO.FileAttributes]::ReparsePoint){throw ''Unexpected staging redirection.''}\n$final=Join-Path $root ''__NAME__''\n$partial=Join-Path $incoming ''__NAME__.__SHA__.part''\n$expectedBytes=[long]__BYTES__\n$expectedSha=''__SHA__''\nforeach($path in @($final,$partial)){\n if((Test-Path -LiteralPath $path) -and ((Get-Item -LiteralPath $path).Attributes -band [IO.FileAttributes]::ReparsePoint)){throw ''Unexpected file redirection.''}\n}\nfunction Hash-Bytes([byte[]]$bytes){\n $sha=[Security.Cryptography.SHA256]::Create()\n try{return [BitConverter]::ToString($sha.ComputeHash($bytes)).Replace(''-'','''').ToLowerInvariant()}finally{$sha.Dispose()}\n}\n"

        START = "\nif(Test-Path -LiteralPath $final){\n $file=Get-Item -LiteralPath $final\n if($file.Length -ne $expectedBytes -or (Get-FileHash -LiteralPath $final -Algorithm SHA256).Hash -ine $expectedSha){throw ''Existing destination differs; preserving it.''}\n [ordered]@{complete=$true;length=$file.Length;sha256=$expectedSha;path=$final}\n}elseif(Test-Path -LiteralPath $partial){\n $file=Get-Item -LiteralPath $partial\n if($file.Length -gt $expectedBytes){throw ''Partial exceeds expected archive length.''}\n [ordered]@{complete=$false;length=$file.Length;sha256=(Get-FileHash -LiteralPath $partial -Algorithm SHA256).Hash.ToLowerInvariant()}\n}else{[ordered]@{complete=$false;length=0;sha256=(Hash-Bytes ([byte[]]@()))}}\n"

        APPEND = "\n$offset=[long]__OFFSET__\n$bytes=[Convert]::FromBase64String(''__DATA__'')\nif($bytes.Length -gt 4194304 -or (Hash-Bytes $bytes) -cne ''__CHUNK_SHA__'' -or $offset+$bytes.Length -gt $expectedBytes){throw ''Invalid transfer chunk.''}\n$file=[IO.File]::Open($partial,[IO.FileMode]::OpenOrCreate,[IO.FileAccess]::ReadWrite,[IO.FileShare]::None)\ntry{\n if($file.Length -eq $offset){\n  $file.Position=$offset;$file.Write($bytes,0,$bytes.Length);$file.Flush($true)\n }elseif($file.Length -ge $offset+$bytes.Length){\n  $existing=[byte[]]::new($bytes.Length);$file.Position=$offset;$read=0\n  while($read -lt $existing.Length){$count=$file.Read($existing,$read,$existing.Length-$read);if($count -eq 0){throw ''Unexpected end of partial file.''};$read+=$count}\n  if((Hash-Bytes $existing) -cne ''__CHUNK_SHA__''){throw ''Conflicting replay; preserving existing data.''}\n }else{throw ''Out-of-order chunk; preserving partial file.''}\n [ordered]@{complete=$false;length=$file.Length;acceptedOffset=$offset;acceptedBytes=$bytes.Length}\n}finally{$file.Dispose()}\n"

        FINISH = "\nif(Test-Path -LiteralPath $final){\n if((Get-Item -LiteralPath $final).Length -ne $expectedBytes -or (Get-FileHash -LiteralPath $final -Algorithm SHA256).Hash -ine $expectedSha){throw ''Existing destination differs.''}\n}else{\n if((Get-Item -LiteralPath $partial).Length -ne $expectedBytes -or (Get-FileHash -LiteralPath $partial -Algorithm SHA256).Hash -ine $expectedSha){throw ''Transferred archive failed final verification.''}\n Move-Item -LiteralPath $partial -Destination $final\n}\n[ordered]@{complete=$true;length=$expectedBytes;sha256=$expectedSha;path=$final;checkedUtc=[DateTime]::UtcNow.ToString(''o'')}\n"

        def sha_file(path):
            with Path(path).open(''rb'') as stream:
                return hashlib.file_digest(stream, ''sha256'').hexdigest()


        def preamble(name, size, digest):
            if not re.fullmatch(r''[1-9][0-9]*_[1-9][0-9]*\.zip'', name):
                raise ValueError(''Expected a workflow run and attempt archive name.'')
            if type(size) is not int or not 0 < size <= MAX_ARCHIVE or not re.fullmatch(''[0-9a-f]{64}'', digest):
                raise ValueError(''Invalid archive size or checksum.'')
            return PREAMBLE.replace(''__NAME__'', name).replace(''__SHA__'', digest).replace(''__BYTES__'', str(size))


        def append_script(prefix, offset, data):
            if type(offset) is not int or offset < 0 or not 0 < len(data) <= CHUNK:
                raise ValueError(''Invalid transfer range.'')
            script = prefix + APPEND.replace(''__OFFSET__'', str(offset)).replace(
                ''__DATA__'', base64.b64encode(data).decode()).replace(''__CHUNK_SHA__'', hashlib.sha256(data).hexdigest())
            if len(script.encode(''utf-8'')) >= 8 * 1024**2 - 4096:
                raise ValueError(''Transfer request exceeds the protected snapshot bound.'')
            return script


        def transfer(rpc, archive, bundle):
            archive = Path(archive)
            name = bundle[''bundleId''] + ''.zip''
            size = archive.stat().st_size
            digest = sha_file(archive)
            if archive.name != name or digest != bundle[''archiveSha256'']:
                raise ValueError(''Current workflow bundle identity differs.'')
            prefix = preamble(name, size, digest)
            deadline = time.monotonic() + 45 * 60
            rpc.recover()
            state = rpc.guest(prefix + START, timeout=180)
            offset = state[''length'']
            if type(offset) is not int or not 0 <= offset <= size:
                raise ValueError(''Invalid retained guest prefix length.'')
            with archive.open(''rb'') as stream:
                hasher = hashlib.sha256()
                remaining = offset
                while remaining:
                    data = stream.read(min(CHUNK, remaining))
                    if not data:
                        raise ValueError(''Local archive ended before retained guest prefix.'')
                    hasher.update(data)
                    remaining -= len(data)
                if hasher.hexdigest() != state[''sha256'']:
                    raise ValueError(''Retained guest bytes differ; preserving them for inspection.'')
                if state[''complete'']:
                    if offset != size:
                        raise ValueError(''Guest falsely reported a complete archive.'')
                    return state
                chunks = 0
                while offset < size:
                    if time.monotonic() >= deadline:
                        raise TimeoutError(''Transfer exceeded 45 minutes; the exact prefix and request IDs are retained.'')
                    data = stream.read(CHUNK)
                    response = rpc.guest(append_script(prefix, offset, data), timeout=180)
                    if response[''acceptedOffset''] != offset or response[''acceptedBytes''] != len(data) or response[''length''] != offset + len(data):
                        raise ValueError(''Guest accepted an unexpected transfer range.'')
                    offset += len(data)
                    chunks += 1
                    if chunks % 16 == 0:
                        print(''Guest bundle transfer: ''+str(offset)+'' / ''+str(size)+'' bytes'', flush=True)
            result = rpc.guest(prefix + FINISH, timeout=180)
            if result[''complete''] is not True or result[''length''] != size or result[''sha256''] != digest:
                raise ValueError(''Guest did not verify the complete archive.'')
            return result
        '

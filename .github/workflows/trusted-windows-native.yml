        $text = '"""Prepare and remove only a single run''s explicitly authorized test scratch."""
        from datetime import datetime, timezone
        import argparse
        import json
        import os
        from pathlib import Path
        import shutil
        import stat
        import tempfile

        NAME = ''native-codex-evidence''
        PHASES = (''general'', ''core'', ''exec'')
        SID = ''S-1-5-21-3998296994-10675985-2695611401-1025''

        def checked_directory(path):
            assert path.is_absolute()
            for item in (*reversed(path.parents), path):
                if item.exists():
                    assert not item.is_symlink() and not item.is_junction(), str(item)
                    assert not item.stat().st_file_attributes & stat.FILE_ATTRIBUTE_REPARSE_POINT, str(item)
            assert path.resolve() == path
            return path

        def remove_tree(path, permitted):
            assert path.is_relative_to(permitted) and path != permitted.parent
            checked_directory(path)
            count = size = 0
            for child in path.iterdir():
                if child.is_symlink():
                    child.unlink()
                elif child.is_junction():
                    os.rmdir(child)
                elif child.is_dir():
                    n, b = remove_tree(child, permitted)
                    count += n; size += b
                else:
                    info = child.stat()
                    assert not info.st_file_attributes & stat.FILE_ATTRIBUTE_REPARSE_POINT
                    count += 1; size += info.st_size
                    if not info.st_mode & stat.S_IWRITE:
                        child.chmod(info.st_mode | stat.S_IWRITE)
                    child.unlink()
            path.rmdir()
            return count, size

        def main():
            parser = argparse.ArgumentParser()
            parser.add_argument(''operation'', choices=(''prepare'', ''finish''))
            parser.add_argument(''phase'', choices=PHASES)
            args = parser.parse_args()
            assert os.name == ''nt'' and os.environ[''RUNNER_NAME''] == ''codex-win-msvc-01''
            assert os.environ[''USERNAME''].lower() == ''svc_codex_runner''
            run_id, attempt = os.environ[''GITHUB_RUN_ID''], os.environ[''GITHUB_RUN_ATTEMPT'']
            assert run_id.isdecimal() and attempt.isdecimal()
            drive = ''D:''
            parent = checked_directory(Path(drive + ''/cxt''))
            if drive == ''D:'':
                root_marker = json.loads((parent / ''.codex-scratch-root.json'').read_text(encoding=''utf-8-sig''))
                assert root_marker[''schema''] == 1 and root_marker[''runnerSid''] == SID
                assert Path(root_marker[''root'']) == parent
            parent.mkdir(exist_ok=True)
            run_root = checked_directory(parent / (run_id + ''_'' + attempt))
            phase_root = checked_directory(run_root / args.phase)
            evidence = (Path(os.environ[''RUNNER_TEMP'']) / NAME).resolve(strict=True)
            assert evidence.drive.upper() == ''R:''
            identity = dict(runId=run_id, runAttempt=attempt, phase=args.phase,
                            sourceTree=os.environ[''SCRATCH_SOURCE_TREE''], controllerSha=os.environ[''GITHUB_SHA''],
                            root=str(phase_root), drive=drive)
            marker = phase_root / ''.phase.json''
            report = dict(identity, checkedUtc=datetime.now(timezone.utc).isoformat(),
                          freeBytes=shutil.disk_usage(parent).free, operation=args.operation)
            if args.operation == ''prepare'':
                assert report[''freeBytes''] >= 50 * 1024**3, ''Insufficient test scratch capacity''
                run_root.mkdir(exist_ok=True)
                phase_root.mkdir(exist_ok=False)
                marker.write_text(json.dumps(identity))
                temporary = phase_root / ''t''
                temporary.mkdir()
                with tempfile.TemporaryDirectory(dir=temporary) as probe:
                    file = Path(probe) / ''probe.txt''
                    file.write_text(''codex scratch comparison'')
                    assert file.read_text() == ''codex scratch comparison''
                    assert file.resolve().drive.upper() == drive
                report.update(writeReadProbePassed=True, testTmpdir=str(phase_root / ''bazel-temp''),
                              testEnvironment={key: str(temporary) for key in (''TEMP'', ''TMP'', ''TMPDIR'')})
            else:
                assert json.loads(marker.read_text()) == identity
                desktop = json.loads((evidence / (''desktop-'' + args.phase + ''.json'')).read_text())
                assert ''childExitCode'' in desktop and desktop[''restoreError''] == desktop[''restoredVerificationError''] == 0
                assert (evidence / (args.phase + ''-snapshot.json'')).is_file()
                report[''observedBazelScratchDirectories''] = sum(1 for p in (phase_root / ''bazel-temp'').iterdir()) if (phase_root / ''bazel-temp'').is_dir() else 0
                # Resolve the exact dedicated phase before recursive deletion; never follow reparse points.
                assert phase_root.resolve() == parent / (run_id + ''_'' + attempt) / args.phase
                count, size = remove_tree(phase_root, phase_root)
                report.update(removedFiles=count, removedBytes=size, cleaned=not phase_root.exists())
                if not any(run_root.iterdir()):
                    run_root.rmdir()
            (evidence / (args.phase + ''-scratch-'' + args.operation + ''.json'')).write_text(json.dumps(report, indent=2) + ''\n'')
            print(json.dumps(report), flush=True)

        if __name__ == ''__main__'':
            main()

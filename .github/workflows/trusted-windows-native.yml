        $text = 'function Get-CodexGuestCoverage {
            param([Parameter(Mandatory)][string]$Text,[Parameter(Mandatory)][string[]]$Inventory,[switch]$FullTarget)
            if($Inventory.Count -eq 0){throw ''Guest selection must not be empty.''}
            $expected=[Collections.Generic.Dictionary[string,int]]::new([StringComparer]::Ordinal)
            foreach($name in $Inventory){
                if($name -notmatch ''^\S{1,500}$''){throw ''Invalid test inventory name.''}
                if($expected.ContainsKey($name)){$expected[$name]++}else{$expected.Add($name,1)}
            }
            $normalized=$Text.Replace("`r`n","`n")
            $esc=[char]27
            $normalized=[regex]::Replace($normalized,([regex]::Escape([string]$esc)+''\][^\x1b\x07]*(?:\x07|\x1b\\)''),'''')
            $normalized=[regex]::Replace($normalized,([regex]::Escape([string]$esc)+''\[[0-?]*[ -/]*[@-~]|''+[regex]::Escape([string]$esc)+''[@-_]''),'''')
            $started=@([regex]::Matches($normalized,''(?m)^test (\S+)(?: - should panic)? \.\.\. '')|ForEach-Object {$_.Groups[1].Value})
            $actual=[Collections.Generic.Dictionary[string,int]]::new([StringComparer]::Ordinal)
            foreach($name in $started){if($actual.ContainsKey($name)){$actual[$name]++}else{$actual.Add($name,1)}}
            $inventoryMatched=$actual.Count -eq $expected.Count
            foreach($name in $expected.Keys){if(-not $actual.ContainsKey($name) -or $actual[$name] -ne $expected[$name]){$inventoryMatched=$false}}
            $summaries=@([regex]::Matches($normalized,''(?m)^test result: (ok|FAILED)\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored; ([0-9]+) measured; ([0-9]+) filtered out;[^\r\n]*$''))

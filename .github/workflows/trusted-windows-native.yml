        $text = '"""Snapshot original Bazel results and independently completed test output."""
        import hashlib
        import json
        import os
        from pathlib import Path
        import sys
        from urllib.parse import unquote,urlparse

        def collect(root,phase,identity):
            assert phase in (''general'',''core'',''exec'')
            root=root.resolve(strict=True)
            raw_events=(root/(phase+''-events.json'')).read_bytes()
            events=[json.loads(line) for line in raw_events.splitlines() if line]
            results=[{''id'':e[''id''][''testResult''],**e[''testResult'']} for e in events if ''testResult'' in e]
            logs=[];problems=[]
            helper_sha=hashlib.sha256((root/''capture-native-test.py'').read_bytes()).hexdigest()
            for result in results:
                test_id=result[''id'']
                assert test_id[''run'']==test_id[''attempt'']==1 and not result.get(''cachedLocally'',False)
                filename=phase+''-''+hashlib.sha256(json.dumps(test_id,sort_keys=True).encode()).hexdigest()[:20]+''.log''
                outputs=[f for f in result.get(''testActionOutput'',[]) if f.get(''name'')==''test.log'']
                if len(outputs)!=1:
                    problems.append(dict(id=test_id,status=result[''status''],classification=''test_timeout_cause_unresolved'' if result[''status'']==''TIMEOUT'' else ''capture_failure'',error=''Expected exactly one Bazel test log''))
                    continue
                uri=urlparse(outputs[0][''uri''])
                assert uri.scheme==''file'' and not uri.netloc
                source=Path(unquote(uri.path).lstrip(''/'')).resolve(strict=True)
                assert source.drive.upper()==root.drive.upper() and source.name==''test.log''
                raw=source.read_bytes();assert len(raw)<50*1024**2
                (root/(filename+''.bazel.log'')).write_bytes(raw)
                key=hashlib.sha256(test_id[''label''].encode()).hexdigest()[:24]+f''-s{test_id["shard"]-1}-r1''
                relative=Path(''captures-''+phase)/key/''completion.json''
                manifest_path=root/relative
                data=raw;complete=False
                if manifest_path.is_file():
                    manifest=json.loads(manifest_path.read_text())
                    assert manifest[''target'']==test_id[''label''] and manifest[''shardIndex'']==test_id[''shard'']-1
                    assert manifest[''run'']==1 and manifest[''runId'']==identity[''runId''] and manifest[''controllerSha'']==identity[''controllerSha'']
                    assert manifest[''runAttempt'']==identity[''runAttempt''], ''Stale workflow attempt sidecar''
                    assert manifest[''captureCompleted''] and manifest[''helperSha256'']==helper_sha
                    assert not manifest[''testArgumentsChanged''] and not manifest[''deadlinesChanged'']
                    data=(manifest_path.parent/''stdout.log'').read_bytes()
                    assert len(data)==manifest[''bytes''] and hashlib.sha256(data).hexdigest()==manifest[''sha256'']
                    assert len(data)<50*1024**2
                    if result[''status'']==''PASSED'':assert manifest[''exitCode'']==0
                    if result[''status'']==''FAILED'':assert manifest[''exitCode'']!=0
                    complete=True
                else:
                    partial=manifest_path.parent/''stdout.log''
                    problems.append(dict(id=test_id,status=result[''status''],classification=''test_timeout_cause_unresolved'' if result[''status'']==''TIMEOUT'' else ''capture_failure'',
                        partialCapturePath=partial.relative_to(root).as_posix() if partial.is_file() else None,
                        error=''No completed sidecar; preserve original result, raw log and any partial capture''))
                with (root/filename).open(''xb'') as stream:stream.write(data)
                logs.append(dict(id=test_id,path=filename,sha256=hashlib.sha256(data).hexdigest(),
                                 completeSidecar=complete,captureManifest=relative.as_posix() if complete else None,
                                 bazelLogPath=filename+''.bazel.log'',bazelLogSha256=hashlib.sha256(raw).hexdigest()))
            snapshot=dict(identity,phase=phase,eventsSha256=hashlib.sha256(raw_events).hexdigest(),
                          exitCode=int((root/(phase+''-exit-code.txt'')).read_text()),results=results,logs=logs,
                          helperSha256=helper_sha,completeSidecars=bool(results) and not problems,problems=problems)
            with (root/(phase+''-snapshot.json'')).open(''x'') as stream:json.dump(snapshot,stream,indent=2)

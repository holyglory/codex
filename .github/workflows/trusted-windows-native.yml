        $text = '"""Compare effective Windows action environments without emitting client secrets."""
        import re

        def action_environment(events):
            command, = [e[''structuredCommandLine''] for e in events
                        if e.get(''id'', {}).get(''structuredCommandLine'', {}).get(''commandLineLabel'') == ''canonical'']
            options = [option for section in command.get(''sections'', [])
                       for option in section.get(''optionList'', {}).get(''option'', [])]
            kinds = (''action_env'', ''host_action_env'')
            raw = {kind: [o.get(''optionValue'', '''') for o in options if o[''optionName''] == kind] for kind in kinds}
            inherited = {value.casefold() for values in raw.values() for value in values if ''='' not in value}
            client = {}
            # Inspect only variables actually inherited by an action. Unrelated client
            # values (including tokens) are never copied into the comparison result.
            for option in options:
                if option[''optionName''] != ''client_env'':
                    continue
                key, separator, value = option.get(''optionValue'', '''').partition(''='')
                folded = key.casefold()
                if separator and folded in inherited:
                    assert folded not in client or client[folded] == value, ''Conflicting inherited Windows environment entries''
                    client[folded] = value
            result = {}
            for kind, values in raw.items():
                resolved = {}
                for value in values:
                    key, separator, explicit = value.partition(''='')
                    assert re.fullmatch(r''[A-Za-z_][A-Za-z0-9_]*'', key), ''Invalid action environment variable name''
                    if separator:
                        resolved[key] = explicit
                    else:
                        assert key.casefold() in client, ''Inherited action environment value is absent from canonical client evidence''
                        resolved[key] = client[key.casefold()]
                # Retain the original canonical-list comparison as well as resolved
                # values. The caller compares in memory and records only a boolean.
                result[kind] = {''canonical'': values, ''resolved'': resolved}
            return result

        import json
        import os
        from pathlib import Path
        from native_d_scratch_evidence import validate
        root = Path(__file__).resolve().parent
        results = {}
        def read_events(phase):
            return [json.loads(line) for line in (root / (phase + ''-events.json'')).read_text().splitlines() if line]

        def compiler_counts(events):
            metrics, = [event[''buildMetrics''] for event in events if ''buildMetrics'' in event]
            return {name: sum(int(item.get(''actionsExecuted'', 0))
                             for item in metrics.get(''actionSummary'', {}).get(''actionData'', [])
                             if item.get(''mnemonic'') == name)
                    for name in (''Rustc'', ''CppCompile'', ''CargoBuildScriptRun'')}

        def verify_repository_temp(events):
            command, = [event[''structuredCommandLine''] for event in events
                        if event.get(''id'', {}).get(''structuredCommandLine'', {}).get(''commandLineLabel'') == ''canonical'']
            values = {}
            for section in command.get(''sections'', []):
                for option in section.get(''optionList'', {}).get(''option'', []):
                    if option[''optionName''] == ''repo_env'':
                        name, separator, value = option.get(''optionValue'', '''').partition(''='')
                        if name.upper() in (''TMP'', ''TEMP''):
                            assert separator and value == ''R:/tmp'', ''Compiler repository temp must stay on the bounded volume''
                            values[name.upper()] = value
            assert values == {''TMP'': ''R:/tmp'', ''TEMP'': ''R:/tmp''}, ''Missing explicit stable compiler temp paths''

        build = read_events(''build'')
        build_environment = action_environment(build)
        verify_repository_temp(build)
        build_counts = compiler_counts(build)
        for phase in (''general'', ''core'', ''exec''):
            events = [json.loads(line) for line in (root / (phase + ''-events.json'')).read_text().splitlines() if line]
            command, = [event[''structuredCommandLine''] for event in events if event.get(''id'', {}).get(''structuredCommandLine'', {}).get(''commandLineLabel'') == ''canonical'']
            allowed = {''client_env'', ''test_env'', ''test_tmpdir'', ''disk_cache'', ''experimental_disk_cache_gc_max_size'', ''experimental_disk_cache_gc_max_age''}
            options = {}
            for section in command.get(''sections'', []):
                for option in section.get(''optionList'', {}).get(''option'', []):
                    name, value = option[''optionName''], option.get(''optionValue'', '''')
                    if name in (''client_env'', ''test_env'') and value.split(''='', 1)[0] not in (''TMP'', ''TEMP'', ''TMPDIR''):
                        continue
                    if name in allowed:
                        options.setdefault(name, []).append(value)
            def read(name):
                return json.loads((root / name).read_text())
            results[phase] = validate(os.environ[''GITHUB_RUN_ID''], os.environ[''GITHUB_SHA''], os.environ[''NATIVE_SOURCE_TREE''], phase,
                read(phase + ''-scratch-prepare.json''), read(phase + ''-scratch-finish.json''), options, read(''desktop-'' + phase + ''.json''), run_attempt=os.environ[''GITHUB_RUN_ATTEMPT''])
            observation=read(''desktop-''+phase+''.json'')[''scratchObservation'']
            assert observation[''errors'']==0 and observation[''observerStopped''] and observation[''samples'']>0, ''D scratch observation failed''
            # Record actual filesystem activity without requiring software to create a particular temporary file.
            verify_repository_temp(events)
            assert action_environment(events) == build_environment, ''Effective MSVC environment changed after the build''
            results[phase].update(repositoryTemporaryPathsVerified=True, effectiveActionEnvironmentMatchesBuild=True,
                                  buildCompilerActionCounts=build_counts, phaseCompilerActionCounts=compiler_counts(events))
        (root / ''test-storage-verification.json'').write_text(json.dumps(results, indent=2) + ''\n'')
        print(json.dumps(results))

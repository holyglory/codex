        $path=Join-Path $root 'guest_controller.py'
        $text = '"""Start guest validation alongside host tests, then collect the exact run''s results."""
        import argparse
        import base64
        from datetime import datetime, timezone
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import time
        import uuid
        import zipfile

        import runner_guest_client as client
        from guest_rpc import GuestRpc
        from guest_transfer import transfer, sha_file
        from guest_results import verify
        from package_guest import run_identity, TARGETS

        HERE = Path(__file__).resolve().parent
        VM_ID = ''23b78cc8-71f0-45c1-ad87-f763fd2c1165''
        PAYLOADS = (''guest-run-tests.ps1'',''guest-observed-process.ps1'',''guest-libtest-coverage.ps1'')


        def save(path, value):
            temporary = path.with_suffix(''.tmp'')
            temporary.write_text(json.dumps(value, indent=2)+''\n'', encoding=''utf-8'')
            temporary.replace(path)


        def encoded(value):
            return base64.b64encode(json.dumps(value,separators=('','','':'')).encode()).decode()


        def script(filename, parameters):
            text = (HERE/filename).read_text(encoding=''utf-8-sig'')
            arguments = []
            for name,value in parameters.items():
                if not re.fullmatch(''[A-Za-z]+'',name):
                    raise ValueError(''Invalid guest parameter name.'')
                if not isinstance(value,(str,int)) or isinstance(value,bool):
                    raise ValueError(''Invalid guest parameter type.'')
                arguments.append(''-''+name+" ''"+str(value).replace("''","''''")+"''")
            return ''& {\n''+text+''\n} ''+'' ''.join(arguments)


        def require(condition, message):
            if not condition:
                raise ValueError(message)


        def load_bundle(evidence, environment):
            source,tree,run,attempt,bundle_id = run_identity(environment)
            bundle = json.loads((evidence/''vm-test-bundle.json'').read_text())
            expected = dict(sourceSha=source,sourceTree=tree,runId=run,runAttempt=attempt,
                            bundleId=bundle_id,controllerSha=environment[''GITHUB_SHA''],validationCommit=source)
            for key,value in expected.items():
                require(bundle[key] == value,''Bundle identity differs: ''+key)
            require(bundle[''executedOnHost''] is False and set(bundle[''targets'']) == TARGETS,
                    ''Unexpected guest target bundle.'')
            archive = Path(bundle[''archive'']).resolve(strict=True)
            require(archive == Path(''R:/vm-test-bundles'')/(bundle_id+''.zip''),
                    ''Guest input archive must be on the bounded bulk volume.'')
            require(sha_file(archive) == bundle[''archiveSha256''], ''Local bundle archive changed.'')
            with zipfile.ZipFile(archive) as zipped:
                entry = zipped.getinfo(''bundle.json'')
                require(entry.file_size <= 2*1024**2,''Bundle metadata exceeds its bound.'')
                raw = zipped.read(entry)
            require(hashlib.sha256(raw).hexdigest() == bundle[''manifestSha256''], ''Bundle metadata changed.'')
            metadata = json.loads(raw)
            for key,value in expected.items():
                require(metadata[key] == value,''Archive provenance differs: ''+key)
            return bundle,archive


        def plan_for(control,bundle):
            path = control/''plan.json''
            payload = {}
            for name in PAYLOADS:
                raw = (HERE/name).read_bytes()
                payload[name] = dict(sha256=hashlib.sha256(raw).hexdigest(),bytes=base64.b64encode(raw).decode())
            expected = {key:bundle[key] for key in (''sourceSha'',''sourceTree'',''controllerSha'',
                        ''runId'',''runAttempt'',''bundleId'',''archiveSha256'',''manifestSha256'')}
            expected[''bodySha256''] = payload[''guest-run-tests.ps1''][''sha256'']
            if path.exists():
                plan = json.loads(path.read_text())
                require(all(plan[k] == v for k,v in expected.items()),''Existing guest plan differs; preserve it.'')
            else:
                plan = dict(expected,schema=2,planId=uuid.uuid4().hex,createdUtc=datetime.now(timezone.utc).isoformat())
                save(path,plan)
            return plan,payload


        def validate_status(status):
            require(status[''vm''][''Id''] == VM_ID and status[''network''] == [],
                    ''Guest identity or network isolation differs.'')


        def start(rpc,control,bundle,archive,plan,payload):
            state_path = control/''launch.json''
            if state_path.exists():
                state = json.loads(state_path.read_text())
                require(state.get(''started'') is True and state[''planId''] == plan[''planId''],
                        ''Prior launch outcome needs inspection; never submit a duplicate guest task.'')
                return state
            validate_status(rpc.call(''status''))
            rpc.call(''vm-start'',timeout=90)
            transferred = transfer(rpc,archive,bundle)
            save(control/''transfer.json'',transferred)
            parameters = dict(PlanEncoded=encoded(plan),PayloadEncoded=encoded(payload))
            code = script(''guest-start.ps1'',parameters)
            # The fixed plan ID is saved before launch. An interrupted response is
            # recovered through the request journal instead of launching a second task.
            state = dict(started=False,planId=plan[''planId''],scriptSha256=hashlib.sha256(code.encode()).hexdigest())
            save(state_path,state)
            result = rpc.guest(code,timeout=600)
            require(result[''planId''] == plan[''planId''] and result[''bundleId''] == plan[''bundleId'']
                    and result[''sourceSha''] == plan[''sourceSha''] and result[''bodySha256''] == plan[''bodySha256''],
                    ''Guest launch receipt differs.'')
            state.update(started=True,result=result,startedUtc=datetime.now(timezone.utc).isoformat())
            save(state_path,state)
            print(json.dumps(dict(guestStarted=True,planId=plan[''planId''],bundleId=plan[''bundleId''])),flush=True)
            return state


        def collect(rpc,plan,current,directory):
            directory.mkdir(exist_ok=True)
            names=set();total=0
            for item in current[''files'']:
                name=item[''name'']
                require(re.fullmatch(r''[A-Za-z0-9._-]{1,100}\.(log|json)'',name) and ''..'' not in name
                        and name.casefold() not in names,''Invalid or duplicate evidence name.'')
                names.add(name.casefold())
                size=item[''bytes''];total+=size
                require(type(size) is int and 0 <= size <= 512*1024**2 and total <= 2*1024**3
                        and re.fullmatch(''[a-f0-9]{64}'',item[''sha256'']),''Invalid evidence inventory.'')
                path=directory/name
                require(not path.is_symlink() and not path.is_junction(),''Collected evidence is redirected.'')
                if path.exists():
                    require(path.stat().st_size == size and sha_file(path) == item[''sha256''],
                            ''Existing collected evidence differs.'')
                    continue
                partial=path.with_suffix(path.suffix+''.part'')
                require(not partial.is_symlink() and not partial.is_junction(),''Partial evidence is redirected.'')
                offset=partial.stat().st_size if partial.exists() else 0
                require(offset <= size,''Partial evidence exceeds expected length.'')
                with partial.open(''ab'') as stream:
                    while offset<size:
                        count=min(3*1024**2,size-offset)
                        value=rpc.guest(script(''guest-read.ps1'',dict(PlanId=plan[''planId''],Mode=''Chunk'',
                                Name=name,Offset=offset,Count=count)),timeout=180)
                        raw=base64.b64decode(value[''content''],validate=True)
                        require(value[''planId'']==plan[''planId''] and value[''name'']==name
                                and value[''offset'']==offset and value[''fileBytes'']==size and value[''bytes'']==count
                                and len(raw)==count and hashlib.sha256(raw).hexdigest()==value[''sha256''],
                                ''Evidence chunk differs from the requested range.'')
                        stream.write(raw);stream.flush();offset+=len(raw)
                require(sha_file(partial)==item[''sha256''],''Full collected evidence checksum differs.'')
                partial.rename(path)


        def finish(rpc,evidence,control,bundle,plan):
            launched=json.loads((control/''launch.json'').read_text())
            require(launched[''started''] and launched[''planId'']==plan[''planId''],''Guest has not been launched.'')
            started=datetime.fromisoformat(launched[''startedUtc''])
            deadline=started.timestamp()+145*60
            while True:
                current=rpc.guest(script(''guest-read.ps1'',dict(PlanId=plan[''planId''])),timeout=180)
                save(control/''current.json'',current)
                require(current[''planId'']==plan[''planId''],''Guest observation belongs to another plan.'')
                if current[''taskState'']!=''Running'' and not current[''workerLive''] and current.get(''progress''):
                    break
                if time.time()>=deadline:
                    raise TimeoutError(''Guest task exceeded its controller limit; exact task and request IDs are retained.'')
                phase=(current.get(''progress'') or {}).get(''stage'',''Waiting for the guest worker'')
                print(json.dumps(dict(guestPlan=plan[''planId''],stage=phase)),flush=True)
                time.sleep(30)
            validate_status(rpc.call(''status''))
            logs=evidence/''guest-logs''
            collect(rpc,plan,current,logs)
            record=verify(plan,bundle,current,logs)
            save(evidence/''privileged-guest-result.json'',record)
            print(json.dumps(dict(guestExecutionCompleted=record[''executionCompleted''],
                                 completeInventory=record[''completeInventory''],captureAccepted=record[''captureAccepted''],
                                 testStatus=record[''status''],results=[dict(label=x[''label''],classification=x[''classification'']) for x in record[''results'']])),flush=True)
            return 0 if record[''status'']==''passed'' else 1


        def main():
            parser=argparse.ArgumentParser()
            parser.add_argument(''operation'',choices=(''start'',''finish''))
            args=parser.parse_args()

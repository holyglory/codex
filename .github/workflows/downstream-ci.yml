name: downstream-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: downstream-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CODEX_REPO_ROOT: ${{ github.workspace }}

jobs:
  quality:
    name: Format, lint, schemas, and locks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy, rustfmt
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Check formatting
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Run focused Clippy
        run: >-
          cargo clippy --locked --tests
          -p codex-rollout
          -p codex-thread-store
          -p codex-account-registry
          -p codex-account-selection
          -p codex-login
          -p codex-usage
          -p codex-core
          -p codex-app-server-protocol
          -p codex-app-server
          -p codex-cli
          -p codex-tui
          -- -D warnings
      - name: Check downstream npm packaging helpers
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s codex-cli/scripts -p 'test_*.py'
      - name: Regenerate schemas
        run: |
          just write-config-schema
          just write-app-server-schema
          just write-app-server-schema --experimental
      - name: Check Cargo and Bazel lock agreement
        working-directory: ${{ github.workspace }}
        run: |
          cargo metadata --manifest-path codex-rs/Cargo.toml --locked --format-version 1 >/dev/null
          ./scripts/check-module-bazel-lock.sh
      - name: Require generated files to be current
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code

  downstream-tests:
    name: Focused downstream tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Run downstream suites
        run: >-
          just test
          -p codex-rollout
          -p codex-thread-store
          -p codex-account-registry
          -p codex-account-selection
          -p codex-login
          -p codex-usage
          -p codex-core
          -p codex-app-server-protocol
          -p codex-app-server
          -p codex-cli
          -p codex-tui

  linux-compile:
    name: Compile Linux product binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Compile product entrypoints
        run: >-
          cargo build --locked
          --bin codex
          --bin codex-app-server
          --bin codex-code-mode-host

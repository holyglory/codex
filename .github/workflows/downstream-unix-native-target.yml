name: downstream-unix-native-target

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      platform:
        required: true
        type: string
      bazel_config:
        required: true
        type: string
      source_version:
        required: true
        type: string
      v8_run_id:
        description: Optional completed run whose successful V8 pair artifact is reused
        required: false
        type: string
      v8_source_commit:
        description: Exact source commit that produced the reused V8 pair
        required: false
        type: string
    secrets:
      BUILDBUDDY_API_KEY:
        required: false

permissions:
  contents: read
  actions: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  v8:
    name: V8 source pair
    if: inputs.v8_run_id == ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      TARGET: ${{ inputs.target }}
      BAZEL_PLATFORM: ${{ inputs.platform }}
      BAZEL_CONFIG: ${{ inputs.bazel_config }}
      SOURCE_VERSION: ${{ inputs.source_version }}
      CARGO_PROFILE_RELEASE_DEBUG: "1"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ contains(inputs.target, 'apple-darwin') && 'packed' || 'off' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Bootstrap locked Bazel dependency distdir
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/bootstrap_bazel_distdir.py
          --workspace "$GITHUB_WORKSPACE"
          --distdir "$RUNNER_TEMP/bazel-distdir"
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ inputs.target }}
          cache-scope: downstream-v8-source
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"
          targets: ${{ inputs.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: runner.os == 'Linux'
        with:
          version: 0.14.0
          use-cache: false
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          bash .github/scripts/install-musl-build-tools.sh
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${TARGET//-/_}"
          echo "$target_no_jitter=1" >> "$GITHUB_ENV"
          python3 .github/scripts/prepare_downstream_musl.py --target "$TARGET" --output-dir "$RUNNER_TEMP/downstream-musl/$TARGET"
      - name: Build and seal the matching V8 pair
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bash .github/scripts/downstream-unix-native.sh source-v8
      - name: Require a complete V8 handoff before upload
        run: bash .github/scripts/downstream-unix-native.sh verify-pair
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: success()
        with:
          name: downstream-v8-${{ inputs.target }}
          path: ${{ runner.temp }}/downstream-v8/${{ inputs.target }}
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package native target
    needs: v8
    if: >-
      !cancelled() &&
      (needs.v8.result == 'success' ||
       (needs.v8.result == 'skipped' && inputs.v8_run_id != ''))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      TARGET: ${{ inputs.target }}
      BAZEL_PLATFORM: ${{ inputs.platform }}
      BAZEL_CONFIG: ${{ inputs.bazel_config }}
      SOURCE_VERSION: ${{ inputs.source_version }}
      V8_PRODUCER_COMMIT: ${{ inputs.v8_source_commit }}
      V8_PRODUCER_RUN_ID: ${{ inputs.v8_run_id }}
      CARGO_PROFILE_RELEASE_DEBUG: "1"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ contains(inputs.target, 'apple-darwin') && 'packed' || 'off' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Bootstrap locked Bazel dependency distdir
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/bootstrap_bazel_distdir.py
          --workspace "$GITHUB_WORKSPACE"
          --distdir "$RUNNER_TEMP/bazel-distdir"
      - name: Download V8 handoff from this run
        if: inputs.v8_run_id == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: downstream-v8-${{ inputs.target }}
          path: ${{ runner.temp }}/downstream-v8/${{ inputs.target }}
      - name: Download V8 handoff from the producer run
        if: inputs.v8_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.v8_run_id }}
          name: downstream-v8-${{ inputs.target }}
          path: ${{ runner.temp }}/downstream-v8/${{ inputs.target }}
      - name: Verify the V8 handoff before package setup
        run: bash .github/scripts/downstream-unix-native.sh verify-pair
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ inputs.target }}
          cache-scope: downstream-v8-source
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"
          targets: ${{ inputs.target }}
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: nextest
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: runner.os == 'Linux'
        with:
          version: 0.14.0
          use-cache: false
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/install-musl-build-tools.sh
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${TARGET//-/_}"
          echo "$target_no_jitter=1" >> "$GITHUB_ENV"
          python3 .github/scripts/prepare_downstream_musl.py --target "$TARGET" --output-dir "$RUNNER_TEMP/downstream-musl/$TARGET"
      - name: Install archive tools
        run: |
          if ! command -v zstd >/dev/null; then
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              sudo apt-get install -y zstd
            else
              brew install zstd
            fi
          fi
      - name: Extend hosted sparse-work test budget
        run: |
          git update-index --assume-unchanged codex-rs/.config/nextest.toml
          cat >> codex-rs/.config/nextest.toml <<'EOF'

          [[profile.default.overrides]]
          filter = 'package(codex-usage) & test(=repeated_switches_aggregate_by_job_before_report_limits)'
          slow-timeout = { period = "2m", terminate-after = 2 }
          EOF
      - name: Verify the V8 handoff, run native regressions, and assemble packages
        run: bash .github/scripts/downstream-unix-native.sh package
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: ${{ inputs.target }}
          path: |
            native-dist/${{ inputs.target }}/codex-package-*.tar.*
            native-dist/${{ inputs.target }}/native-manifest.json
            native-dist/${{ inputs.target }}/SHA256SUMS
            native-dist/${{ inputs.target }}/logs
          if-no-files-found: error
          retention-days: 14

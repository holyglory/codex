name: setup-voice-bazel-windows
description: Provision the pinned Windows voice inputs used by Bazel native analysis.
inputs:
  target:
    description: Windows target being tested; GNU targets use the matching MSVC host tools.
    required: true

runs:
  using: composite
  steps:
    - name: Download pinned Windows voice inputs
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        VOICE_BAZEL_TARGET: ${{ inputs.target }}
      run: |
        $voiceTarget = switch ($env:VOICE_BAZEL_TARGET) {
          "x86_64-pc-windows-msvc" { "x86_64-pc-windows-msvc"; break }
          "aarch64-pc-windows-msvc" { "aarch64-pc-windows-msvc"; break }
          "x86_64-pc-windows-gnullvm" { "x86_64-pc-windows-msvc"; break }
          "x86_64-pc-windows-gnu" { "x86_64-pc-windows-msvc"; break }
          default { throw "Unsupported Windows Bazel voice target: $env:VOICE_BAZEL_TARGET" }
        }
        $manifest = Get-Content -Raw .github/scripts/voice-cygwin-snapshot.json | ConvertFrom-Json
        $pin = $manifest.archive
        $source = $manifest.sourceArchive
        $directory = Join-Path $env:RUNNER_TEMP "voice-cygwin-snapshot"
        New-Item -ItemType Directory -Force -Path $directory | Out-Null
        gh release download $pin.tag --repo openai/codex --pattern $pin.name --pattern $source.name --dir $directory
        if ($LASTEXITCODE -ne 0) { throw "Cannot obtain the public Cygwin inputs and source" }
        $sourceFile = Join-Path $directory $source.name
        if ((Get-Item $sourceFile).Length -ne $source.bytes -or
            (Get-FileHash $sourceFile -Algorithm SHA256).Hash.ToLowerInvariant() -ne $source.sha256) {
          throw "Public Cygwin source archive mismatch"
        }
        "VOICE_WINDOWS_TARGET=$voiceTarget" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "VOICE_CYGWIN_ARCHIVE=$(Join-Path $directory $pin.name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Verify and install pinned public voice tools
      shell: pwsh
      run: |
        & ./.github/scripts/setup-voice-windows.ps1 -Target $env:VOICE_WINDOWS_TARGET -SnapshotArchive $env:VOICE_CYGWIN_ARCHIVE
        if (-not $env:SystemRoot) { throw "Windows SystemRoot is required for native audio actions" }
        "VOICE_WINDOWS_SYSTEM_ROOT=$env:SystemRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        $hostArch = $env:PROCESSOR_ARCHITEW6432
        if (-not $hostArch) { $hostArch = $env:PROCESSOR_ARCHITECTURE }
        if (-not $hostArch) { throw "Windows host architecture is required" }
        "VOICE_WINDOWS_HOST_ARCH=$hostArch" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        $voiceSourceCommit = (& git rev-parse --verify HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $voiceSourceCommit -cnotmatch '^[0-9a-f]{40}$') {
          throw "Cannot resolve the source identity for native voice inputs"
        }
        $env:STABLE_GIT_COMMIT = $voiceSourceCommit
        $voiceStatus = & cmd.exe /d /c .\scripts\workspace-status.cmd
        if ($LASTEXITCODE -ne 0 -or $voiceStatus -cne "STABLE_GIT_COMMIT $voiceSourceCommit") {
          throw "Windows workspace status did not emit the selected source identity"
        }
        "STABLE_GIT_COMMIT=$voiceSourceCommit" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

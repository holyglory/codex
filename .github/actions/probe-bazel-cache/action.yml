name: Probe persistent Bazel cache
description: Build a small native object with isolated state on independent runners.
inputs:
  mode:
    required: true
    description: Populate or consume the shared cache proof.
runs:
  using: composite
  steps:
    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-version: 1.28.1
    - name: Verify transport helper boundaries
      shell: bash
      run: python3 -m unittest discover -s .github/scripts -p 'test_bazel_remote_cache.py'
    - name: Prove compiled-output behavior
      shell: bash
      env:
        PROBE_MODE: ${{ inputs.mode }}
      run: |
        export USE_BAZEL_VERSION="$(< .bazelversion)"
        python3 .github/scripts/run_with_bazel_remote_cache.py --require-cache -- \
          python3 .github/scripts/probe_bazel_remote_cache.py \
          --mode "$PROBE_MODE" --namespace "$GITHUB_RUN_ID" \
          --evidence "$RUNNER_TEMP/cache-probe-evidence"
    - name: Preserve cache proof
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: bazel-cache-proof-${{ inputs.mode }}
        path: ${{ runner.temp }}/cache-probe-evidence
